envoyProxyForGatewayClass:
  apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    namespace: envoy-gateway-system
    name: test
  spec:
    mergeBackends: {}
gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-1
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
httpRoutes:
  # The same backends in opposite priority orders on two routes. Neither rule may be
  # deduplicated: the backendRef without a filter (priority 0) must stay in the same
  # cluster as the one with the backendPriority filter.
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      namespace: default
      name: http-route-1
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
      rules:
        - matches:
            - path:
                value: /route-1
          backendRefs:
            - name: service-1
              port: 8080
            - name: service-2
              port: 8080
              filters:
                - type: ExtensionRef
                  extensionRef:
                    group: gateway.envoyproxy.io
                    kind: HTTPRouteFilter
                    name: priority-1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      namespace: default
      name: http-route-2
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
      rules:
        - matches:
            - path:
                value: /route-2
          backendRefs:
            - name: service-1
              port: 8080
              filters:
                - type: ExtensionRef
                  extensionRef:
                    group: gateway.envoyproxy.io
                    kind: HTTPRouteFilter
                    name: priority-1
            - name: service-2
              port: 8080
  # A lone backendRef with a backendPriority filter must not leak its priority into the
  # cluster shared by http-route-4.
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      namespace: default
      name: http-route-3
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
      rules:
        - matches:
            - path:
                value: /route-3
          backendRefs:
            - name: service-3
              port: 8080
              filters:
                - type: ExtensionRef
                  extensionRef:
                    group: gateway.envoyproxy.io
                    kind: HTTPRouteFilter
                    name: priority-1
  # Plain routes still share one deduplicated cluster.
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      namespace: default
      name: http-route-4
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
      rules:
        - matches:
            - path:
                value: /route-4
          backendRefs:
            - name: service-3
              port: 8080
        - matches:
            - path:
                value: /route-5
          backendRefs:
            - name: service-3
              port: 8080
httpFilters:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: HTTPRouteFilter
    metadata:
      namespace: default
      name: priority-1
    spec:
      backendPriority: 1
