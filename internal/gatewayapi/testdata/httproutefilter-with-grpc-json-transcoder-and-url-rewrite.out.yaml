          settings:
          - addressType: IP
            endpoints:
            - host: 7.7.7.7
              port: 8080
            metadata:
              kind: Service
              name: service-1
              namespace: default
              sectionName: "8080"
            name: httproute/default/httproute-host-rewrite/rule/0/backend/0
            protocol: HTTP
            weight: 1
        grpcJSONTranscoder:
