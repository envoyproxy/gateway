gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: gateway-1
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.envoyproxy.io"
      allowedRoutes:
        namespaces:
          from: All
httpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: httproute-1
  spec:
    hostnames:
    - gateway.envoyproxy.io
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
      sectionName: http
    rules:
    - matches:
      - path:
          value: "/foo"
      backendRefs:
      - name: service-1
        port: 8080
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: oauth2-credential-injection-1
    - matches:
      - path:
          value: "/bar"
      backendRefs:
      - name: service-1
        port: 8080
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: oauth2-credential-injection-2
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: httproute-2
  spec:
    hostnames:
    - gateway.envoyproxy.io
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
      sectionName: http
    rules:
    - matches:
      - path:
          value: "/baz"
      backendRefs:
      - name: service-1
        port: 8080
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: oauth2-credential-injection-3
httpFilters:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: HTTPRouteFilter
  metadata:
    name: oauth2-credential-injection-1
    namespace: default
  spec:
    credentialInjection:
      overwrite: true
      credential:
        oauth2:
          tokenEndpoint: https://oauth.example.com/oauth2/token
          clientID: client-1
          clientSecret:
            name: oauth2-client-secret
          scopes:
          - read
          - write
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: HTTPRouteFilter
  metadata:
    name: oauth2-credential-injection-2
    namespace: default
  spec:
    credentialInjection:
      credential:
        oauth2:
          tokenEndpoint: https://oauth.example.com/oauth2/token
          clientID: client-2
          clientSecret:
            name: secret-without-client-secret
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: HTTPRouteFilter
  metadata:
    name: oauth2-credential-injection-3
    namespace: default
  spec:
    credentialInjection:
      credential:
        oauth2:
          tokenEndpoint: https://192.168.1.10/oauth2/token
          clientID: client-3
          clientSecret:
            name: oauth2-client-secret
secrets:
- apiVersion: v1
  kind: Secret
  metadata:
    name: oauth2-client-secret
    namespace: default
  data:
    client-secret: Y2xpZW50LXNlY3JldA==
- apiVersion: v1
  kind: Secret
  metadata:
    name: secret-without-client-secret
    namespace: default
  data:
    credential: c2VjcmV0
