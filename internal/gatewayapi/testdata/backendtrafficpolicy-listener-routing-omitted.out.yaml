httpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: route-1
    namespace: default
  spec:
    parentRefs:
    - name: gateway-1
    rules:
    - backendRefs:
      - name: backend
        port: 8080
      name: rule-1
  status:
    parents:
    - conditions:
      - lastTransitionTime: null
        message: Route is accepted
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Resolved all the Object references for the Route
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
      parentRef:
        name: gateway-1
infraIR:
  default/gateway-1:
    proxy:
      listeners:
      - name: default/gateway-1/listener-1
        ports:
        - containerPort: 9081
          name: http-9081
          protocol: HTTP
          servicePort: 9081
      - name: default/gateway-1/listener-2
        ports:
        - containerPort: 9082
          name: http-9082
          protocol: HTTP
          servicePort: 9082
      metadata:
        labels:
          gateway.envoyproxy.io/owning-gateway-name: gateway-1
          gateway.envoyproxy.io/owning-gateway-namespace: default
        ownerReference:
          kind: GatewayClass
          name: envoy-gateway-class
      name: default/gateway-1
      namespace: envoy-gateway-system
