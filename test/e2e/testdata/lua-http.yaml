---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route-1-with-lua
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  hostnames: ["www.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /route1
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route-2-with-lua
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  hostnames: ["www.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /route2
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route-3-without-lua
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  hostnames: ["www.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /route3
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route-4-with-lua-filter-context
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  hostnames: ["www.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /route4
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-example-lua
  namespace: gateway-conformance-infra
data:  # not-lua key is used to test that the it fallbacks to first key
  not-lua: |
    function envoy_on_response(response_handle)
      response_handle:headers():add("X-Custom-Lua-Header", "lua_value_1")
    end
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-example-lua-filter-context
  namespace: gateway-conformance-infra
data:
  lua: |
    function envoy_on_response(response_handle)
      local ctx = response_handle:filterContext()
      if ctx ~= nil then
        local custom_value = ctx:get("custom_value")
        if custom_value ~= nil then
          response_handle:headers():add("X-Lua-Filter-Context", custom_value)
        end
      end
    end
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: example-lua-1
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: example-route-1-with-lua
  lua:
    - type: ValueRef
      valueRef:
        name: cm-example-lua
        kind: ConfigMap
        group: v1
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: example-lua-2
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: example-route-2-with-lua
  lua:
    - type: Inline
      inline: |
        function envoy_on_response(response_handle)
          response_handle:headers():add("X-Custom-Lua-Header", "lua_value_2")
          response_handle:headers():add("X-Custom-Lua-Another-Header", "lua_another_value")
        end
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: example-lua-3-filter-context
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: example-route-4-with-lua-filter-context
  lua:
    - type: ValueRef
      valueRef:
        name: cm-example-lua-filter-context
        kind: ConfigMap
        group: v1
      filterContext:
        custom_value: hello_from_filter_context
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lua-translation-error
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lua-invalid-child
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: lua-translation-error
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /invalid
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lua-inherited
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: lua-translation-error
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /inherited
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: lua-error-parent
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lua-translation-error
  lua:
    - type: Inline
      inline: |
        function envoy_on_response(handle)
          handle:headers():add("X-Parent-Lua", "true")
        end
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: lua-error-child
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: lua-invalid-child
  lua:
    - type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: missing-lua-translation-error
