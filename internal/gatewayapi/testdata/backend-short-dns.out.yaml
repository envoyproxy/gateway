    namespace: default
  spec:
    endpoints:
    - fqdn:
        hostname: localhost.
        port: 3000
  status:
    conditions:
    - lastTransitionTime: null
      message: 'The Backend was not accepted: hostname localhost. is only supported
        when using the Host infrastructure'
      reason: Accepted
      status: "False"
      type: Invalid
