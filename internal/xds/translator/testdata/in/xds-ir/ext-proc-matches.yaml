http:
  - address: 0.0.0.0
    hostnames:
      - '*'
    name: envoy-gateway/gateway-1/http
    path:
      escapedSlashesAction: UnescapeAndRedirect
      mergeSlashes: true
    port: 10080
    routes:
      - destination:
          name: httproute/default/route-target/rule/0
          settings:
            - addressType: IP
              endpoints:
                - host: 7.7.7.7
                  port: 8080
              protocol: HTTP
              weight: 1
              name: httproute/default/route-target/rule/0/backend/0
        envoyExtensions:
          extProcs:
            - name: envoyextensionpolicy/default/route-matches/extproc/0
              authority: route-extproc.default:9000
              matches:
                - headers:
                    - name: x-ai-eg-model
                      value: mock-server
              destination:
                name: envoyextensionpolicy/default/route-matches/0/route-extproc
                settings:
                  - protocol: GRPC
                    weight: 1
                    name: envoyextensionpolicy/default/route-matches/0/route-extproc/backend/0
        hostname: gateway.envoyproxy.io
        isHTTP2: false
        name: httproute/default/route-target/rule/0/match/0/gateway_envoyproxy_io
        pathMatch:
          distinct: false
          name: ""
          prefix: /route
      - destination:
          name: httproute/default/gateway-target/rule/0
          settings:
            - addressType: IP
              endpoints:
                - host: 7.7.7.7
                  port: 8080
              protocol: HTTP
              weight: 1
              name: httproute/default/gateway-target/rule/0/backend/0
        envoyExtensions:
          extProcs:
            - name: envoyextensionpolicy/default/gateway-matches/extproc/0
              authority: gateway-extproc.default:9000
              matchListenerScoped: true
              matches:
                - headers:
                    - name: x-ai-eg-model
                      value: mock-server
              destination:
                name: envoyextensionpolicy/default/gateway-matches/0/gateway-extproc
                settings:
                  - protocol: GRPC
                    weight: 1
                    name: envoyextensionpolicy/default/gateway-matches/0/gateway-extproc/backend/0
        hostname: gateway.envoyproxy.io
        isHTTP2: false
        name: httproute/default/gateway-target/rule/0/match/0/gateway_envoyproxy_io
        pathMatch:
          distinct: false
          name: ""
          prefix: /gateway
