rateLimitsByDomain:
  first-listener:
  - actions:
    - ActionSpecifier:
        GenericKey:
          descriptor_key: first-route
          descriptor_value: first-route
    - ActionSpecifier:
        RequestHeaders:
          descriptor_key: rule-0-match-0
          header_name: x-user-id
    - ActionSpecifier:
        HeaderValueMatch:
          descriptor_key: rule-0-method
          descriptor_value: rule-0-method
          expect_match:
            value: true
          headers:
          - HeaderMatchSpecifier:
              StringMatch:
                MatchPattern:
                  Exact: POST
            name: :method
    - ActionSpecifier:
        HeaderValueMatch:
          descriptor_key: rule-0-path
          descriptor_value: rule-0-path
          expect_match:
            value: true
          headers:
          - HeaderMatchSpecifier:
              StringMatch:
                MatchPattern:
                  Prefix: /admin
            name: :path
routeName: first-route
