http:
- address: 0.0.0.0
  hostnames:
  - '*'
  metadata:
    kind: Gateway
    name: gateway-1
    namespace: envoy-gateway
    sectionName: http
  name: envoy-gateway/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - destination:
      name: httproute/default/httproute-1/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        filters:
          credentialInjection:
            name: httproutefilter/default/oauth2-backend-filter
            oauth2:
              tokenEndpoint: https://oauth.example.com/oauth2/token
              clientID: client-1
              clientSecret: '[redacted]'
        name: httproute/default/httproute-1/rule/0/backend/0
        protocol: HTTP
        weight: 1
    hostname: '*'
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-1
      namespace: default
    name: httproute/default/httproute-1/rule/0/match/0/*
    pathMatch:
      distinct: false
      name: ""
      prefix: /foo
  - credentialInjection:
      name: httproutefilter/default/oauth2-backend-refs
      oauth2:
        destination:
          name: httproutefilter/default/oauth2-backend-refs/credentialinjection/0
          settings:
          - addressType: IP
            endpoints:
            - host: 10.0.0.5
              port: 8080
            name: httproutefilter/default/oauth2-backend-refs/credentialinjection/0/backend/0
            protocol: HTTP
            weight: 1
        traffic:
          timeout:
            http:
              requestTimeout: 5s
        tokenEndpoint: http://idp.internal/oauth2/token
        clientID: client-2
        clientSecret: '[redacted]'
    destination:
      name: httproute/default/httproute-1/rule/1
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        name: httproute/default/httproute-1/rule/1/backend/0
        protocol: HTTP
        weight: 1
    hostname: '*'
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-1
      namespace: default
    name: httproute/default/httproute-1/rule/1/match/0/*
    pathMatch:
      distinct: false
      name: ""
      prefix: /bar
