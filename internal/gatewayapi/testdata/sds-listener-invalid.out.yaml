gatewayClass:
  apiVersion: gateway.networking.k8s.io/v1
  kind: GatewayClass
  metadata:
    name: envoy-gateway-class
  spec:
    controllerName: gateway.envoyproxy.io/gatewayclass-controller
gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    name: gateway-1
    namespace: envoy-gateway
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - allowedRoutes:
        namespaces:
          from: All
      name: missing-url
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
        - name: sds-missing-url
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      name: missing-secret-name
      port: 8443
      protocol: HTTPS
      tls:
        certificateRefs:
        - name: sds-missing-secret-name
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      name: mixed-invalid-sds
      port: 9443
      protocol: HTTPS
      tls:
        certificateRefs:
        - name: envoy-valid
          namespace: envoy-gateway-system
        - name: sds-missing-url
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      name: cross-namespace-without-grant
      port: 10444
      protocol: HTTPS
      tls:
        certificateRefs:
        - name: sds-cross-without-grant
          namespace: sds-secrets
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      name: valid-sds-malformed-tls
      port: 11443
      protocol: HTTPS
      tls:
        certificateRefs:
        - name: sds-valid
        - name: malformed-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      name: malformed-sds-url
      port: 12443
      protocol: HTTPS
      tls:
        certificateRefs:
        - name: sds-malformed-url
        mode: Terminate
  status:
    listeners:
    - attachedRoutes: 0
      conditions:
      - lastTransitionTime: null
        message: 'No valid secrets exist: certificate refs 0: Secret envoy-gateway/sds-missing-url
          is not a valid SDS reference secret: no url found in SDS reference secret
          envoy-gateway/sds-missing-url.'
        reason: InvalidCertificateRef
        status: "False"
        type: ResolvedRefs
      - lastTransitionTime: null
        message: Listener has been successfully translated
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Listener is invalid, see other Conditions for details.
        reason: Invalid
        status: "False"
        type: Programmed
      name: missing-url
      supportedKinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      - group: gateway.networking.k8s.io
        kind: GRPCRoute
    - attachedRoutes: 0
      conditions:
      - lastTransitionTime: null
        message: 'No valid secrets exist: certificate refs 0: Secret envoy-gateway/sds-missing-secret-name
          is not a valid SDS reference secret: no secretName found in SDS reference
          secret envoy-gateway/sds-missing-secret-name.'
        reason: InvalidCertificateRef
        status: "False"
        type: ResolvedRefs
      - lastTransitionTime: null
        message: Listener has been successfully translated
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Listener is invalid, see other Conditions for details.
        reason: Invalid
        status: "False"
        type: Programmed
      name: missing-secret-name
      supportedKinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      - group: gateway.networking.k8s.io
        kind: GRPCRoute
    - attachedRoutes: 0
      conditions:
      - lastTransitionTime: null
        message: 'Some secrets are invalid: certificate refs 1: Secret envoy-gateway/sds-missing-url
          is not a valid SDS reference secret: no url found in SDS reference secret
          envoy-gateway/sds-missing-url.'
        reason: PartiallyInvalidCertificateRef
        status: "False"
        type: ResolvedRefs
      - lastTransitionTime: null
        message: Listener has been successfully translated
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Sending translated listener configuration to the data plane
        reason: Programmed
        status: "True"
        type: Programmed
      name: mixed-invalid-sds
      supportedKinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      - group: gateway.networking.k8s.io
        kind: GRPCRoute
    - attachedRoutes: 0
      conditions:
      - lastTransitionTime: null
        message: 'No valid secrets exist: certificate refs 0: Certificate ref to secret
          sds-secrets/sds-cross-without-grant not permitted by any ReferenceGrant.'
        reason: RefNotPermitted
        status: "False"
        type: ResolvedRefs
      - lastTransitionTime: null
        message: Listener is invalid, see other Conditions for details.
        reason: Invalid
        status: "False"
        type: Programmed
      name: cross-namespace-without-grant
      supportedKinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      - group: gateway.networking.k8s.io
        kind: GRPCRoute
    - attachedRoutes: 0
      conditions:
      - lastTransitionTime: null
        message: 'Some secrets are invalid: envoy-gateway/malformed-tls must contain
          valid tls.crt and tls.key, unable to validate certificate in tls.crt: unable
          to decode pem data for certificate'
        reason: PartiallyInvalidCertificateRef
        status: "False"
        type: ResolvedRefs
      - lastTransitionTime: null
        message: Listener has been successfully translated
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Sending translated listener configuration to the data plane
        reason: Programmed
        status: "True"
        type: Programmed
      name: valid-sds-malformed-tls
      supportedKinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      - group: gateway.networking.k8s.io
        kind: GRPCRoute
    - attachedRoutes: 0
      conditions:
      - lastTransitionTime: null
        message: 'No valid secrets exist: certificate refs 0: Secret envoy-gateway/sds-malformed-url
          is not a valid SDS reference secret: invalid URL in SDS reference secret
          envoy-gateway/sds-malformed-url: unsupported URL scheme: .'
        reason: InvalidCertificateRef
        status: "False"
        type: ResolvedRefs
      - lastTransitionTime: null
        message: Listener has been successfully translated
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Listener is invalid, see other Conditions for details.
        reason: Invalid
        status: "False"
        type: Programmed
      name: malformed-sds-url
      supportedKinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      - group: gateway.networking.k8s.io
        kind: GRPCRoute
infraIR:
  envoy-gateway/gateway-1:
    proxy:
      listeners:
      - name: envoy-gateway/gateway-1/mixed-invalid-sds
        ports:
        - containerPort: 9443
          name: https-9443
          protocol: HTTPS
          servicePort: 9443
      - name: envoy-gateway/gateway-1/valid-sds-malformed-tls
        ports:
        - containerPort: 11443
          name: https-11443
          protocol: HTTPS
          servicePort: 11443
      metadata:
        labels:
          gateway.envoyproxy.io/owning-gateway-name: gateway-1
          gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway
        ownerReference:
          kind: GatewayClass
          name: envoy-gateway-class
      name: envoy-gateway/gateway-1
      namespace: envoy-gateway-system
xdsIR:
  envoy-gateway/gateway-1:
    accessLog:
      json:
      - path: /dev/stdout
    globalResources:
      proxyServiceCluster:
        metadata:
          kind: Service
          name: envoy-envoy-gateway-gateway-1-196ae069
          namespace: envoy-gateway-system
          sectionName: "8080"
        name: envoy-gateway/gateway-1
        settings:
        - addressType: IP
          endpoints:
          - host: 7.6.5.4
            port: 8080
            zone: zone1
          metadata:
            kind: Service
            name: envoy-envoy-gateway-gateway-1-196ae069
            namespace: envoy-gateway-system
            sectionName: "8080"
          name: envoy-gateway/gateway-1
          protocol: TCP
    http:
    - address: 0.0.0.0
      externalPort: 9443
      hostnames:
      - '*'
      metadata:
        kind: Gateway
        name: gateway-1
        namespace: envoy-gateway
        sectionName: mixed-invalid-sds
      name: envoy-gateway/gateway-1/mixed-invalid-sds
      path:
        escapedSlashesAction: UnescapeAndRedirect
        mergeSlashes: true
      port: 9443
      tls:
        alpnProtocols: null
        certificates:
        - certificate: 
          name: envoy-gateway-system/envoy-valid
          privateKey: '[redacted]'
    - address: 0.0.0.0
      externalPort: 11443
      hostnames:
      - '*'
      metadata:
        kind: Gateway
        name: gateway-1
        namespace: envoy-gateway
        sectionName: valid-sds-malformed-tls
      name: envoy-gateway/gateway-1/valid-sds-malformed-tls
      path:
        escapedSlashesAction: UnescapeAndRedirect
        mergeSlashes: true
      port: 11443
      tls:
        alpnProtocols: null
        certificates:
        - name: envoy-gateway/sds-valid
          sds:
            address: /var/run/secrets/workload-spiffe-uds/socket
            scheme: unix
            secretName: valid
    readyListener:
      address: 0.0.0.0
      ipFamily: IPv4
      path: /ready
      port: 19003
