http:
- address: 0.0.0.0
  hostnames:
  - '*'
  name: envoy-gateway/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - destination:
      name: httproute/default/httproute-1/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-1/rule/0/backend/0
    hostname: www.example.com
    isHTTP2: false
    name: httproute/default/httproute-1/rule/0/match/0/www_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /foo
    envoyExtensions:
      dynamicModules:
      - config:
          maxTokensPerMinute: 10000
        doNotClose: true
        filterName: token-ratelimit
        loadGlobally: true
        path: /usr/lib/envoy/modules/ai_gateway.so
        name: envoyextensionpolicy/default/policy-for-http-route/dynamic-module/0
        terminalFilter: false
  - destination:
      name: httproute/default/httproute-2/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-2/rule/0/backend/0
    hostname: www.example.com
    isHTTP2: false
    name: httproute/default/httproute-2/rule/0/match/0/www_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /bar
    envoyExtensions:
      dynamicModules:
      - config:
          authEndpoint: https://auth.example.com
        doNotClose: false
        filterName: auth-check
        loadGlobally: false
        path: /usr/lib/envoy/modules/my_auth.so
        name: envoyextensionpolicy/envoy-gateway/policy-for-gateway/dynamic-module/0
        terminalFilter: false
      - config:
          authEndpoint: https://remote-auth.example.com
        doNotClose: false
        filterName: remote-auth-check
        loadGlobally: false
        name: envoyextensionpolicy/envoy-gateway/policy-for-gateway/dynamic-module/1
        remote:
          url: https://modules.example.com/libremote_auth.so
          sha256: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
        terminalFilter: false
  - destination:
      name: httproute/default/httproute-3/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-3/rule/0/backend/0
    hostname: www.example.com
    isHTTP2: false
    name: httproute/default/httproute-3/rule/0/match/0/www_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /terminal
    envoyExtensions:
      dynamicModules:
      - doNotClose: false
        filterName: handler
        loadGlobally: false
        path: /usr/lib/envoy/modules/my_handler.so
        name: envoyextensionpolicy/default/policy-terminal/dynamic-module/0
        terminalFilter: true
  - destination:
      name: httproute/default/httproute-4/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-4/rule/0/backend/0
    hostname: www.example.com
    isHTTP2: false
    name: httproute/default/httproute-4/rule/0/match/0/www_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /path-loaded
    envoyExtensions:
      dynamicModules:
      - doNotClose: false
        filterName: path-filter
        loadGlobally: false
        path: /opt/modules/my_module.so
        name: envoyextensionpolicy/default/policy-path/dynamic-module/0
        terminalFilter: false
# Listener-scoped DynamicModule (attached at Gateway/Listener scope, with a remote source to
# exercise cluster creation) with three routes:
# - httproute-5: no route-scoped policy, inherits the listener-scoped module via VirtualHost.
# - httproute-6: route-scoped policy with a different module, fully replacing the listener one.
# - httproute-7: route-scoped policy that targets the SAME module as the listener (a policy can
#   target both a Gateway and one of its HTTPRoutes via separate targetRefs), so the filter name
#   collides across scopes and must not be disabled then re-enabled.
- address: 0.0.0.0
  hostnames:
  - '*'
  name: envoy-gateway/gateway-1/http-listener-scope
  envoyExtensions:
    dynamicModules:
    - doNotClose: false
      filterName: listener-filter
      loadGlobally: false
      name: envoyextensionpolicy/envoy-gateway/policy-for-gateway-listener/dynamic-module/0
      remote:
        url: https://listener-modules.example.com/liblistener.so
        sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      terminalFilter: false
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10081
  routes:
  - destination:
      name: httproute/default/httproute-5/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-5/rule/0/backend/0
    hostname: listener-scope.example.com
    isHTTP2: false
    name: httproute/default/httproute-5/rule/0/match/0/listener_scope_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /inherit
  - destination:
      name: httproute/default/httproute-6/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-6/rule/0/backend/0
    envoyExtensions:
      dynamicModules:
      - doNotClose: false
        filterName: route-override-filter
        loadGlobally: false
        path: /usr/lib/envoy/modules/route_override.so
        name: envoyextensionpolicy/default/policy-for-route-6/dynamic-module/0
        terminalFilter: false
    hostname: listener-scope.example.com
    isHTTP2: false
    name: httproute/default/httproute-6/rule/0/match/0/listener_scope_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /override
  - destination:
      name: httproute/default/httproute-7/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-7/rule/0/backend/0
    envoyExtensions:
      dynamicModules:
      - doNotClose: false
        filterName: listener-filter
        loadGlobally: false
        name: envoyextensionpolicy/envoy-gateway/policy-for-gateway-listener/dynamic-module/0
        remote:
          url: https://listener-modules.example.com/liblistener.so
          sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        terminalFilter: false
    hostname: listener-scope.example.com
    isHTTP2: false
    name: httproute/default/httproute-7/rule/0/match/0/listener_scope_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /same-name
