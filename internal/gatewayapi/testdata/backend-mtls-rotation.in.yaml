# Rotating a Backend's mTLS client certificate: each path has two Backends with the same
# endpoint but different client certificates, so the old and new certs are in use side by side.
#
# Known issue: the /ip rule's two Backends share the same address (10.244.0.62:8443). Both end up
# as localities of one cluster, each with its own transport socket match, but Envoy merges
# endpoints with the same ip+port, so it keeps only the first one and the second client
# certificate is never used.
gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-1
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
httpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      namespace: default
      name: backend-tls-route
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /ip
          backendRefs:
            - group: gateway.envoyproxy.io
              kind: Backend
              name: backend-tls-1-ip
            - group: gateway.envoyproxy.io
              kind: Backend
              name: backend-tls-2-ip
        - matches:
            - path:
                type: PathPrefix
                value: /fqdn
          backendRefs:
            - group: gateway.envoyproxy.io
              kind: Backend
              name: backend-tls-1
            - group: gateway.envoyproxy.io
              kind: Backend
              name: backend-tls-2
backends:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-tls-1
      namespace: default
    spec:
      endpoints:
        - fqdn:
            hostname: tls-backend-1.default.svc.cluster.local
            port: 443
      tls:
        clientCertificateRef:
          kind: Secret
          name: example-client-cert1
        insecureSkipVerify: true
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-tls-1-ip
      namespace: default
    spec:
      endpoints:
        - ip:
            address: 10.244.0.62
            port: 8443
      tls:
        clientCertificateRef:
          kind: Secret
          name: example-client-cert1
        insecureSkipVerify: true
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-tls-2
      namespace: default
    spec:
      endpoints:
        - fqdn:
            hostname: tls-backend-2.default.svc.cluster.local
            port: 443
      tls:
        clientCertificateRef:
          kind: Secret
          name: example-client-cert2
        insecureSkipVerify: true
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-tls-2-ip
      namespace: default
    spec:
      endpoints:
        - ip:
            address: 10.244.0.62
            port: 8443
      tls:
        clientCertificateRef:
          kind: Secret
          name: example-client-cert2
        insecureSkipVerify: true
backendTLSPolicies:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: BackendTLSPolicy
    metadata:
      name: backend-tls-1
      namespace: default
    spec:
      targetRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: backend-tls-1
        - group: gateway.envoyproxy.io
          kind: Backend
          name: backend-tls-1-ip
      validation:
        caCertificateRefs:
          - name: ca-cmap
            group: ""
            kind: ConfigMap
        hostname: www.example.com
  - apiVersion: gateway.networking.k8s.io/v1
    kind: BackendTLSPolicy
    metadata:
      name: backend-tls-2
      namespace: default
    spec:
      targetRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: backend-tls-2
        - group: gateway.envoyproxy.io
          kind: Backend
          name: backend-tls-2-ip
      validation:
        caCertificateRefs:
          - name: ca-cmap
            group: ""
            kind: ConfigMap
        hostname: www.example.com
