        name: envoy-gateway/same-port-gateway
        settings:
        - addressType: IP
          endpoints:
          - host: 7.6.5.4
            port: 8080
            zone: zone1
          metadata:
            kind: Service
            name: envoy-envoy-gateway-same-port-gateway-dafdfcca
            namespace: envoy-gateway-system
            sectionName: "8080"
          name: envoy-gateway/same-port-gateway
          protocol: TCP
    http:
