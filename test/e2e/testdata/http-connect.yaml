# CONNECT routes use a connect matcher instead of a path match, so each route gets its own
# hostname to keep the two tunnels from shadowing each other on the shared Gateway.
#
# Terminate: the Gateway terminates the CONNECT request and tunnels raw TCP to the echo backend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-connect-terminate
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  hostnames:
    - connect-terminate.example.com
  rules:
    - backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: http-connect-terminate
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: http-connect-terminate
  httpUpgrade:
    - type: CONNECT
      connect:
        terminate: true
---
# Proxy: the Gateway forwards the CONNECT request unchanged to connect-proxy-backend, a
# standalone Envoy that terminates it and tunnels raw TCP to the echo backend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-connect-proxy
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  hostnames:
    - connect-proxy.example.com
  rules:
    - backendRefs:
        - name: connect-proxy-backend
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: http-connect-proxy
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: http-connect-proxy
  httpUpgrade:
    - type: CONNECT
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: connect-proxy-backend-envoy
  namespace: gateway-conformance-infra
# The listener binds "::" with ipv4_compat, so the backend answers on IPv4 and IPv6 pods.
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: connect
          address:
            socket_address:
              address: "::"
              ipv4_compat: true
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: connect
                    route_config:
                      virtual_hosts:
                        - name: connect
                          domains: ["*"]
                          routes:
                            - match:
                                connect_matcher: {}
                              route:
                                cluster: infra-backend-v1
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: infra-backend-v1
          type: STRICT_DNS
          dns_lookup_family: V4_PREFERRED
          load_assignment:
            cluster_name: infra-backend-v1
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: infra-backend-v1.gateway-conformance-infra.svc.cluster.local
                          port_value: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect-proxy-backend
  namespace: gateway-conformance-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: connect-proxy-backend
  template:
    metadata:
      labels:
        app: connect-proxy-backend
    spec:
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:distroless-v1.40.0
          imagePullPolicy: IfNotPresent
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
            - --log-level
            - warn
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            tcpSocket:
              port: 8080
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
      volumes:
        - name: envoy-config
          configMap:
            name: connect-proxy-backend-envoy
---
apiVersion: v1
kind: Service
metadata:
  name: connect-proxy-backend
  namespace: gateway-conformance-infra
spec:
  selector:
    app: connect-proxy-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
