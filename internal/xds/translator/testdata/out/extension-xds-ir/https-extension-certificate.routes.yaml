- ignorePortInHostMatching: true
  name: team-a/web/https
  virtualHosts:
  - domains:
    - app.example.com
    metadata:
      filterMetadata:
        envoy-gateway:
          resources:
          - kind: Gateway
            name: web
            namespace: team-a
            sectionName: https
    name: team-a/web/https/app_example_com
    routes:
    - match:
        prefix: /
      name: app-route
      route:
        cluster: app-route-dest
        upgradeConfigs:
        - upgradeType: websocket
