# Real IR extracted from gatewayapi's mergebackends-http-merge-gateway-consistent-hash.out.yaml:
# a gateway-level ConsistentHash BTP with a 60/40 split across two merged BackendClusters.
http:
- address: 0.0.0.0
  externalPort: 80
  hostnames:
  - '*'
  metadata:
    kind: Gateway
    name: gateway-1
    namespace: envoy-gateway
    sectionName: http
  name: envoy-gateway/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - destination:
      backendClusterRefs:
      - name: service/default/service-1/8080/http
        weight: 60
      - name: service/default/service-2/8080/http
        weight: 40
      metadata:
        kind: HTTPRoute
        name: http-route-1
        namespace: default
      name: httproute/default/http-route-1/rule/0
    hostname: '*'
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: http-route-1
      namespace: default
      policies:
      - kind: BackendTrafficPolicy
        name: btp-gateway-consistent-hash
        namespace: envoy-gateway
    name: httproute/default/http-route-1/rule/0/match/0/*
    pathMatch:
      distinct: false
      name: ''
      prefix: /split
    traffic:
      loadBalancer:
        consistentHash:
          sourceIP: true
backendClusters:
- metadata:
    kind: Service
    name: service-1
    namespace: default
    sectionName: '8080'
  name: service/default/service-1/8080/http
  setting:
    addressType: IP
    endpoints:
    - host: 7.7.7.7
      port: 8080
    metadata:
      kind: Service
      name: service-1
      namespace: default
      sectionName: '8080'
    name: service/default/service-1/8080/http
    protocol: HTTP
  traffic:
    loadBalancer:
      consistentHash:
        sourceIP: true
- metadata:
    kind: Service
    name: service-2
    namespace: default
    sectionName: '8080'
  name: service/default/service-2/8080/http
  setting:
    addressType: IP
    endpoints:
    - host: 7.7.7.7
      port: 8080
    metadata:
      kind: Service
      name: service-2
      namespace: default
      sectionName: '8080'
    name: service/default/service-2/8080/http
    protocol: HTTP
  traffic:
    loadBalancer:
      consistentHash:
        sourceIP: true
