backends:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-short-dns
      namespace: default
    spec:
      endpoints:
        - fqdn:
            hostname: 'ml-service'
            port: 3000
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-short-hostname
      namespace: default
    spec:
      endpoints:
        - hostname: 'ml-service'
          ip:
            address: '1.1.1.1'
            port: 3000
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-absolute-localhost
      namespace: default
    spec:
      endpoints:
        - fqdn:
            hostname: 'localhost.'
            port: 3000
