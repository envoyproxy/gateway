        - containerPort: 10080
          name: http-80
          protocol: HTTP
          servicePort: 80
      metadata:
        labels:
          gateway.envoyproxy.io/owning-gateway-name: gateway-grpc
          gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway
        ownerReference:
          kind: GatewayClass
          name: envoy-gateway-class
      name: envoy-gateway/gateway-grpc
      namespace: envoy-gateway-system
  envoy-gateway/gateway-tcp-udp:
    proxy:
      listeners:
      - name: envoy-gateway/gateway-tcp-udp/tcp
