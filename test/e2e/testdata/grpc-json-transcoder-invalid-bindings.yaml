# Each route below uses a proto descriptor that Envoy can't load. These routes should be
# rejected, and the listener should not be affected.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-json-transcoder-misordered
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  hostnames:
  - "misordered.transcoder.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/v1"
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: grpc-json-transcoder-misordered
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: grpc-infra-backend-v1
      port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: grpc-json-transcoder-misordered
  namespace: gateway-conformance-infra
spec:
  grpcJSONTranscoder:
    services:
    - transcoder.order.v1.Misordered
    protoDescriptor:
      valueRef:
        group: ""
        kind: ConfigMap
        name: grpc-json-transcoder-misordered
---
# b.proto is listed before a.proto, which it imports:
#
#   // a.proto
#   syntax = "proto3";
#   package transcoder.order.v1;
#   message PingRequest {}
#   message PingResponse {}
#
#   // b.proto
#   syntax = "proto3";
#   package transcoder.order.v1;
#   import "a.proto";
#   service Misordered { rpc Ping(PingRequest) returns (PingResponse); }
apiVersion: v1
kind: ConfigMap
metadata:
  name: grpc-json-transcoder-misordered
  namespace: gateway-conformance-infra
data:
  proto-descriptor: |
    CooBCgdiLnByb3RvEhN0cmFuc2NvZGVyLm9yZGVyLnYxGgdhLnByb3RvMlkKCk1pc29yZGVyZWQSSwoEUGluZxIgLnRyYW5zY29k
