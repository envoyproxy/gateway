accesslog:
  als:
  - name: als-http
    buffer:
      flushInterval: 5s
      sizeBytes: 4194304
    destination:
      name: accesslog/monitoring/envoy-als/port/9000
      settings:
      - addressType: IP
        endpoints:
        - host: 1.1.1.1
          port: 9000
        protocol: GRPC
        weight: 1
        name: accesslog/monitoring/envoy-als/port/9000/backend/0
    type: HTTP
  - name: als-tcp
    buffer:
      sizeBytes: 1048576
    destination:
      name: accesslog/monitoring/envoy-als-tcp/port/9000
      settings:
      - addressType: IP
        endpoints:
        - host: 2.2.2.2
          port: 9000
        protocol: GRPC
        weight: 1
        name: accesslog/monitoring/envoy-als-tcp/port/9000/backend/0
    type: TCP
  openTelemetry:
  - buffer:
      flushInterval: 10s
    attributes:
    - key: "response_code"
      value: "%RESPONSE_CODE%"
    authority: "otel-collector.default.svc.cluster.local"
    destination:
      name: "accesslog-otel-0"
      settings:
      - endpoints:
        - host: "otel-collector.default.svc.cluster.local"
          port: 4317
        protocol: "GRPC"
        addressType: FQDN
        name: "accesslog-otel-0/backend/0"
http:
- name: "first-listener"
  address: "::"
  port: 10080
  hostnames:
  - "*"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  - name: "direct-route"
    hostname: "*"
    destination:
      name: "direct-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "direct-route-dest/backend/0"
