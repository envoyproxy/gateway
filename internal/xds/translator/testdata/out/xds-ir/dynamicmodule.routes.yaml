              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamicModuleConfig:
                  module:
                    remote:
                      httpUri:
                        cluster: listener-modules_example_com_443
                        timeout: 10s
                        uri: https://listener-modules.example.com/liblistener.so
                      sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                filterName: listener-filter
    typedPerFilterConfig:
      envoy.filters.http.filter_chain.eep.listener:
        '@type': type.googleapis.com/envoy.extensions.filters.http.filter_chain.v3.FilterChainConfigPerRoute
        filterChain:
          filters:
          - name: envoy.filters.http.dynamic_modules/listener/0
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              dynamicModuleConfig:
                module:
                  remote:
                    httpUri:
                      cluster: listener-modules_example_com_443
                      timeout: 10s
                      uri: https://listener-modules.example.com/liblistener.so
                    sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              filterName: listener-filter
