# Every deprecated ClientTrafficPolicy field.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: all-deprecated
  namespace: default
spec:
  # Attach to the edge gateway.
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
  enableProxyProtocol: true  # behind an NLB
  headers:
    preserveXRequestID: true
  tls:
    clientValidation:
      optional: true
      caCertificateRefs:
      - name: ca
---
# False values are the defaults, so they're just dropped.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: false-values
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
  enableProxyProtocol: false
  headers:
    preserveXRequestID: false
---
# The new fields take precedence, so the old ones are dropped.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: new-fields-set
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
  enableProxyProtocol: true
  proxyProtocol:
    optional: true
  headers:
    preserveXRequestID: true
    requestID: Generate
  tls:
    clientValidation:
      optional: true
      mode: RequireAndVerify
---
# targetRef and targetRefs disagree: only targetRef is used today, so it's an error.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: target-conflict
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: other
---
# A null proxyProtocol is unset, so enableProxyProtocol is used today.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: null-replacements
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
  enableProxyProtocol: true
  proxyProtocol: null
  headers:
    preserveXRequestID: true
    requestID: null
  tls:
    clientValidation:
      optional: false
