backendTrafficPolicies:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: BackendTrafficPolicy
  metadata:
    name: udp-checker-on-udproute
    namespace: default
  spec:
    healthCheck:
      active:
        healthyThreshold: 1
        interval: 3s
        overrides:
          port: 9053
        timeout: 500ms
        type: UDP
        udp:
          receive:
            binary: cG9uZw==
            type: Binary
          send:
            text: ping
            type: Text
        unhealthyThreshold: 3
      panicThreshold: 30
    targetRef:
      group: gateway.networking.k8s.io
      kind: UDPRoute
      name: udp-app-1
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway-1
        namespace: default
        sectionName: udp-1
      conditions:
      - lastTransitionTime: null
        message: Policy has been accepted.
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: spec.targetRef is deprecated and will be removed in v1.11, use spec.targetRefs
          instead
        reason: DeprecatedField
        status: "True"
        type: Warning
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: BackendTrafficPolicy
  metadata:
    name: tcp-checker-on-udproute
    namespace: default
  spec:
    healthCheck:
      active:
        healthyThreshold: null
        interval: null
        tcp:
          receive:
            text: pong
            type: Text
          send:
            text: ping
            type: Text
        timeout: null
        type: TCP
        unhealthyThreshold: null
      passive:
        consecutiveLocalOriginFailures: 5
    targetRef:
      group: gateway.networking.k8s.io
      kind: UDPRoute
      name: udp-app-2
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway-1
        namespace: default
        sectionName: udp-2
      conditions:
      - lastTransitionTime: null
        message: only the UDP active health checker works with a UDPRoute, so the
          TCP health checker is ignored; passive health checks have no effect when
          targeting a UDPRoute; spec.targetRef is deprecated and will be removed in
          v1.11, use spec.targetRefs instead
        reason: Warnings
        status: "True"
        type: Warning
      - lastTransitionTime: null
        message: Policy has been accepted.
        reason: Accepted
        status: "True"
        type: Accepted
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: BackendTrafficPolicy
  metadata:
    name: udp-checker-on-tcproute
    namespace: default
  spec:
    healthCheck:
      active:
        healthyThreshold: null
        interval: null
        timeout: null
        type: UDP
        udp:
          receive:
            text: pong
            type: Text
          send:
            text: ping
            type: Text
        unhealthyThreshold: null
    targetRef:
      group: gateway.networking.k8s.io
      kind: TCPRoute
      name: tcp-app-1
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway-1
        namespace: default
        sectionName: tcp
      conditions:
      - lastTransitionTime: null
        message: the UDP active health checker only works with a UDPRoute, so it is
          ignored for a TCPRoute; spec.targetRef is deprecated and will be removed
          in v1.11, use spec.targetRefs instead
        reason: Warnings
        status: "True"
        type: Warning
      - lastTransitionTime: null
        message: Policy has been accepted.
        reason: Accepted
        status: "True"
        type: Accepted
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
