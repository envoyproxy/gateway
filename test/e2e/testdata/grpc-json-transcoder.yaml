---
apiVersion: v1
kind: Service
metadata:
  name: grpc-infra-backend-v1
  namespace: gateway-conformance-infra
spec:
  selector:
    app: grpc-infra-backend-v1
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 3000
    appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-infra-backend-v1
  namespace: gateway-conformance-infra
  labels:
    app: grpc-infra-backend-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-infra-backend-v1
  template:
    metadata:
      labels:
        app: grpc-infra-backend-v1
    spec:
      containers:
      - name: grpc-infra-backend-v1
        image: registry.k8s.io/gateway-api/conformance/echo-basic:v0.1.0
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GRPC_ECHO_SERVER
          value: "1"
        resources:
          requests:
            cpu: 10m
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: grpc-infra-backend-v1
  namespace: gateway-conformance-infra
spec:
  # The route is an HTTPRoute, so the backend protocol defaults to HTTP/1.1. The
  # transcoded request is gRPC and needs HTTP/2 upstream.
  appProtocols:
  - gateway.envoyproxy.io/h2c
  endpoints:
  - fqdn:
      hostname: grpc-infra-backend-v1.gateway-conformance-infra.svc.cluster.local
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-json-transcoder-httproute
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  hostnames:
  - "httproute.transcoder.example.com"
  rules:
  # The transcoder is attached to this rule only. After transcoding Envoy re-matches on the
  # rewritten gRPC method path, which lands on the rule below with no transcoder config of
  # its own -- the response is still transcoded back to JSON because Envoy resolves filter
  # enablement once, against the route matched at decodeHeaders.
  - matches:
    - path:
        type: PathPrefix
        value: "/v1/grpc-echo"
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: grpc-json-transcoder
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: grpc-infra-backend-v1
      port: 8080
  # This scenario serves the rewritten path with a second HTTPRoute rule; the GRPCRoute
  # below is the other way.
  - matches:
    - path:
        type: PathPrefix
        value: "/gateway_api_conformance.echo_basic.grpcecho.GrpcEcho"
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: grpc-infra-backend-v1
      port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: grpc-json-transcoder
  namespace: gateway-conformance-infra
spec:
  grpcJSONTranscoder:
    services:
    - gateway_api_conformance.echo_basic.grpcecho.GrpcEcho
    protoDescriptor:
      valueRef:
        group: ""
        kind: ConfigMap
        name: grpc-echo-proto-descriptor
---
# Same transcoding, but the rewritten gRPC method path is served by a GRPCRoute rather than
# a second HTTPRoute rule. The filter still attaches to the HTTPRoute rule, because that is
# where the JSON request arrives; the GRPCRoute carries no transcoder config at all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-json-transcoder-grpcroute-httproute
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  hostnames:
  - "grpcroute.transcoder.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/v1/grpc-echo"
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: grpc-json-transcoder-grpcroute
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: grpc-infra-backend-v1
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-json-transcoder-grpcroute
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  hostnames:
  - "grpcroute.transcoder.example.com"
  rules:
  - matches:
    - method:
        service: gateway_api_conformance.echo_basic.grpcecho.GrpcEcho
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: grpc-infra-backend-v1
      port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: grpc-json-transcoder-grpcroute
  namespace: gateway-conformance-infra
spec:
  grpcJSONTranscoder:
    services:
    - gateway_api_conformance.echo_basic.grpcecho.GrpcEcho
    protoDescriptor:
      valueRef:
        group: ""
        kind: ConfigMap
        name: grpc-echo-proto-descriptor
---
# The transcoder rewrites :path but matchIncomingRequestRoute keeps the route that already
# matched, so no route for the rewritten gRPC method path is needed at all -- one HTTPRoute
# with one rule is the whole configuration.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-json-transcoder-single-route
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  hostnames:
  - "single.transcoder.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/v1/grpc-echo"
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: grpc-json-transcoder-single-route
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: grpc-infra-backend-v1
      port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: grpc-json-transcoder-single-route
  namespace: gateway-conformance-infra
spec:
  grpcJSONTranscoder:
    matchIncomingRequestRoute: true
    services:
    - gateway_api_conformance.echo_basic.grpcecho.GrpcEcho
    protoDescriptor:
      valueRef:
        group: ""
        kind: ConfigMap
        name: grpc-echo-proto-descriptor
---
