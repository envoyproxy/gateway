# Merged clusters carry their own http3: the first route has no Traffic.HTTP3 yet reaches an
# Always and Auto clusters, so discovery must be enabled even though Always comes first.
# The second route carries a Gateway policy's Traffic.HTTP3 but only reaches a plaintext
# merged cluster that dropped it, so the route-level field must be ignored there.
http:
  - address: 0.0.0.0
    hostnames:
      - '*'
    name: envoy-gateway/gateway-http3/http
    path:
      escapedSlashesAction: UnescapeAndRedirect
      mergeSlashes: true
    port: 10080
    routes:
      - destination:
          backendClusterRefs:
            - name: service/default/h3-always/8080/http
              weight: 1
            - name: service/default/h3-backend/8080/http
              weight: 1
          name: httproute/default/http3-merged/rule/0
        hostname: '*'
        name: merged-h3-route
        pathMatch:
          exact: /merged-h3-route
          name: ""
      - destination:
          backendClusterRefs:
            - name: service/default/plain-backend/8080/http
              weight: 1
          name: httproute/default/plain-merged/rule/0
        hostname: '*'
        name: merged-plain-route
        pathMatch:
          exact: /merged-plain-route
          name: ""
        traffic:
          http3:
            mode: Auto
backendClusters:
  - metadata:
      kind: Service
      name: h3-always
      namespace: default
      sectionName: "8080"
    name: service/default/h3-always/8080/http
    setting:
      addressType: IP
      endpoints:
        - host: 10.244.0.11
          port: 8080
      metadata:
        kind: Service
        name: h3-always
        namespace: default
        sectionName: "8080"
      name: service/default/h3-always/8080/http
      protocol: HTTP
      tls:
        insecureSkipVerify: true
        SNI: example.com
    traffic:
      http3:
        mode: Always
  - metadata:
      kind: Service
      name: h3-backend
      namespace: default
      sectionName: "8080"
    name: service/default/h3-backend/8080/http
    setting:
      addressType: IP
      endpoints:
        - host: 10.244.0.11
          port: 8080
      metadata:
        kind: Service
        name: h3-backend
        namespace: default
        sectionName: "8080"
      name: service/default/h3-backend/8080/http
      protocol: HTTP
      tls:
        CACertificate:
          certificate: 
          name: policy-btls/policies-ca
        SNI: example.com
    traffic:
      http3:
        mode: Auto
  - metadata:
      kind: Service
      name: plain-backend
      namespace: default
      sectionName: "8080"
    name: service/default/plain-backend/8080/http
    setting:
      addressType: IP
      endpoints:
        - host: 10.244.0.12
          port: 8080
      metadata:
        kind: Service
        name: plain-backend
        namespace: default
        sectionName: "8080"
      name: service/default/plain-backend/8080/http
      protocol: HTTP
