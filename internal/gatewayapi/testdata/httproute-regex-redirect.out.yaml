gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    name: gateway-1
    namespace: envoy-gateway
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - allowedRoutes:
        namespaces:
          from: All
      name: http
      port: 80
      protocol: HTTP
  status:
    listeners:
    - attachedRoutes: 3
      conditions:
      - lastTransitionTime: null
        message: Sending translated listener configuration to the data plane
        reason: Programmed
        status: "True"
        type: Programmed
      - lastTransitionTime: null
        message: Listener has been successfully translated
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Listener references have been resolved
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      name: http
      supportedKinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      - group: gateway.networking.k8s.io
        kind: GRPCRoute
httpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: regex-redirect
    namespace: default
  spec:
    parentRefs:
    - name: gateway-1
      namespace: envoy-gateway
    rules:
    - filters:
      - requestRedirect:
          hostname: example.com
          scheme: https
          statusCode: 301
        type: RequestRedirect
      - extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: regex-redirect
        type: ExtensionRef
      matches:
      - path:
          type: RegularExpression
          value: ^/blogs/([0-9]+)$
    - filters:
      - extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: regex-redirect
        type: ExtensionRef
      - requestRedirect:
          hostname: example.com
          port: 8443
          scheme: https
          statusCode: 302
        type: RequestRedirect
      matches:
      - path:
          type: PathPrefix
          value: /reverse-order
  status:
    parents:
    - conditions:
      - lastTransitionTime: null
        message: Route is accepted
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Resolved all the Object references for the Route
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
      parentRef:
        name: gateway-1
        namespace: envoy-gateway
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: conflicting-redirect
    namespace: default
  spec:
    parentRefs:
    - name: gateway-1
      namespace: envoy-gateway
    rules:
    - filters:
      - requestRedirect:
          path:
            replaceFullPath: /landing
            type: ReplaceFullPath
        type: RequestRedirect
      - extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: regex-redirect
        type: ExtensionRef
      matches:
      - path:
          value: /conflict
  status:
    parents:
    - conditions:
      - lastTransitionTime: null
        message: 'HTTPRouteFilter default/regex-redirect: redirect path cannot be
          combined with RequestRedirect.path.'
        reason: IncompatibleFilters
        status: "False"
        type: Accepted
      - lastTransitionTime: null
        message: Resolved all the Object references for the Route
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
      parentRef:
        name: gateway-1
        namespace: envoy-gateway
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: missing-redirect-extension
    namespace: default
  spec:
    parentRefs:
    - name: gateway-1
      namespace: envoy-gateway
    rules:
    - filters:
      - requestRedirect:
          scheme: https
        type: RequestRedirect
      - extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: missing
        type: ExtensionRef
      matches:
      - path:
          value: /missing
  status:
    parents:
    - conditions:
      - lastTransitionTime: null
        message: Route is accepted
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: 'Unable to translate HTTPRouteFilter: default/missing.'
        reason: UnsupportedValue
        status: "False"
        type: ResolvedRefs
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
      parentRef:
        name: gateway-1
        namespace: envoy-gateway
infraIR:
  envoy-gateway/gateway-1:
    proxy:
      listeners:
      - name: envoy-gateway/gateway-1/http
        ports:
        - containerPort: 10080
          name: http-80
          protocol: HTTP
          servicePort: 80
      metadata:
        labels:
          gateway.envoyproxy.io/owning-gateway-name: gateway-1
          gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway
        ownerReference:
          kind: GatewayClass
          name: envoy-gateway-class
      name: envoy-gateway/gateway-1
      namespace: envoy-gateway-system
xdsIR:
  envoy-gateway/gateway-1:
    accessLog:
      json:
      - path: /dev/stdout
    globalResources:
      proxyServiceCluster:
        metadata:
          kind: Service
          name: envoy-envoy-gateway-gateway-1-196ae069
          namespace: envoy-gateway-system
          sectionName: "8080"
        name: envoy-gateway/gateway-1
        settings:
        - addressType: IP
          endpoints:
          - host: 7.6.5.4
            port: 8080
            zone: zone1
          metadata:
            kind: Service
            name: envoy-envoy-gateway-gateway-1-196ae069
            namespace: envoy-gateway-system
            sectionName: "8080"
          name: envoy-gateway/gateway-1
          protocol: TCP
    http:
    - address: 0.0.0.0
      externalPort: 80
      hostnames:
      - '*'
      metadata:
        kind: Gateway
        name: gateway-1
        namespace: envoy-gateway
        sectionName: http
      name: envoy-gateway/gateway-1/http
      path:
        escapedSlashesAction: UnescapeAndRedirect
        mergeSlashes: true
      port: 10080
      routes:
      - hostname: '*'
        isHTTP2: false
        metadata:
          kind: HTTPRoute
          name: regex-redirect
          namespace: default
        name: httproute/default/regex-redirect/rule/0/match/0/*
        pathMatch:
          distinct: false
          name: ""
          safeRegex: ^/blogs/([0-9]+)$
        redirect:
          hostname: example.com
          path:
            fullReplace: null
            prefixMatchReplace: null
            regexMatchReplace:
              pattern: ^/blogs/([0-9]+)$
              substitution: /post-\1
          port: 443
          scheme: https
          statusCode: 301
      - hostname: '*'
        isHTTP2: false
        metadata:
          kind: HTTPRoute
          name: regex-redirect
          namespace: default
        name: httproute/default/regex-redirect/rule/1/match/0/*
        pathMatch:
          distinct: false
          name: ""
          prefix: /reverse-order
        redirect:
          hostname: example.com
          path:
            fullReplace: null
            prefixMatchReplace: null
            regexMatchReplace:
              pattern: ^/blogs/([0-9]+)$
              substitution: /post-\1
          port: 8443
          scheme: https
          statusCode: 302
      - directResponse:
          statusCode: 500
        hostname: '*'
        isHTTP2: false
        metadata:
          kind: HTTPRoute
          name: conflicting-redirect
          namespace: default
        name: httproute/default/conflicting-redirect/rule/0/match/0/*
        pathMatch:
          distinct: false
          name: ""
          prefix: /conflict
      - directResponse:
          statusCode: 500
        hostname: '*'
        isHTTP2: false
        metadata:
          kind: HTTPRoute
          name: missing-redirect-extension
          namespace: default
        name: httproute/default/missing-redirect-extension/rule/0/match/0/*
        pathMatch:
          distinct: false
          name: ""
          prefix: /missing
        redirect:
          port: 443
          scheme: https
    readyListener:
      address: 0.0.0.0
      ipFamily: IPv4
      path: /ready
      port: 19003
