backends:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-short-dns
      namespace: default
    spec:
      endpoints:
        - fqdn:
            hostname: 'ml-service'
            port: 3000
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-short-hostname
      namespace: default
    spec:
      endpoints:
        - hostname: 'ml-service'
          ip:
            address: '1.1.1.1'
            port: 3000
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-absolute-localhost
      namespace: default
    spec:
      endpoints:
        - fqdn:
            hostname: 'localhost.'
            port: 3000
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-localhost-subdomain
      namespace: default
    spec:
      endpoints:
        - fqdn:
            hostname: 'api.localhost.'
            port: 3000
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-ip6-localhost
      namespace: default
    spec:
      endpoints:
        - fqdn:
            hostname: 'ip6-localhost'
            port: 3000
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-ip6-loopback
      namespace: default
    spec:
      endpoints:
        - hostname: 'ip6-loopback'
          ip:
            address: '1.1.1.1'
            port: 3000
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-localhost-localdomain
      namespace: default
    spec:
      endpoints:
        - fqdn:
            hostname: 'localhost.localdomain.'
            port: 3000
