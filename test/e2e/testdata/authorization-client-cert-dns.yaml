# CA, server cert, and client certs for DNS SAN authorization test
# Cert generation commands (for reference):
#   openssl genrsa -out ca.key 2048
#   openssl req -x509 -new -key ca.key -sha256 -days 3650 \
#     -subj "/O=Envoy Gateway Tests/CN=ClientCert DNS AuthZ Test CA" -out ca.crt
#
#   # Server cert (DNS SAN: authz-client-cert-dns.example.com)
#   openssl genrsa -out server.key 2048
#   openssl req -new -key server.key \
#     -subj "/CN=authz-client-cert-dns.example.com/O=Envoy Gateway Tests" -out server.csr
#   # ext: subjectAltName = DNS:authz-client-cert-dns.example.com, extendedKeyUsage = serverAuth
#   openssl x509 -req -days 3650 -CA ca.crt -CAkey ca.key -CAcreateserial \
#     -in server.csr -out server.crt -extfile server-ext.cnf -extensions v3_req
#
#   # Allowed client cert (DNS SAN: client.example.com)
#   openssl genrsa -out client-allowed.key 2048
#   openssl req -new -key client-allowed.key -subj "/CN=allowed-client/O=Envoy Gateway Tests" -out client-allowed.csr
#   # ext: subjectAltName = DNS:client.example.com, extendedKeyUsage = clientAuth
#   openssl x509 -req -days 3650 -CA ca.crt -CAkey ca.key -CAcreateserial \
#     -in client-allowed.csr -out client-allowed.crt -extfile client-allowed-ext.cnf -extensions v3_req
#
#   # Denied client cert (DNS SAN: attacker.example.com)
#   # (same shape, different DNS SAN)
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-dns-server-cert
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-dns-allowed
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-dns-denied
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: authz-client-cert-dns-gateway
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: mtls
      port: 443
      protocol: HTTPS
      hostname: authz-client-cert-dns.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: authz-client-cert-dns-server-cert
---
# ClientTrafficPolicy: require mTLS, validate client cert against the CA
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: authz-client-cert-dns-ctp
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: authz-client-cert-dns-gateway
      sectionName: mtls
  tls:
    clientValidation:
      caCertificateRefs:
        - kind: Secret
          group: ""
          name: authz-client-cert-dns-server-cert
---
# Route /allowed: SecurityPolicy permits only the allowed DNS SAN
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authz-client-cert-dns-allowed-route
  namespace: gateway-conformance-infra
spec:
  hostnames:
    - authz-client-cert-dns.example.com
  parentRefs:
    - name: authz-client-cert-dns-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /allowed
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authz-client-cert-dns-allow
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: authz-client-cert-dns-allowed-route
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-dns-san
        action: Allow
        principal:
          clientCert:
            subjectAltNames:
              dnsNames:
                - type: Exact
                  value: "client.example.com"
