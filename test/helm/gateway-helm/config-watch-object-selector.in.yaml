global:
  images:
    envoyGateway:
      image: "docker.io/envoyproxy/gateway-dev:latest"
      pullPolicy: Always
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
      kubernetes:
        watch:
          type: NamespaceSelector
          namespaceSelector:
            matchLabels:
              gateway: enabled
          objectSelector:
            matchLabels:
              gateway: internal
