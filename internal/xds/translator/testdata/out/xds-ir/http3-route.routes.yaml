- ignorePortInHostMatching: true
  name: envoy-gateway/gateway-http3/http
  virtualHosts:
  - domains:
    - '*'
    name: envoy-gateway/gateway-http3/http/*
    routes:
    - match:
        path: /auto-route
      name: auto-route
      route:
        cluster: httproute/default/http3-auto/rule/0
        upgradeConfigs:
        - upgradeType: websocket
      typedPerFilterConfig:
        envoy.filters.http.alternate_protocols_cache:
          '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
          config: {}
        envoy.filters.http.header_mutation/upstream_http3:
          '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
          mutations:
            responseMutations:
            - remove: alt-svc
    - match:
        path: /auto-route-2
      name: auto-route-2
      route:
        cluster: httproute/default/http3-auto-2/rule/0
        upgradeConfigs:
        - upgradeType: websocket
      typedPerFilterConfig:
        envoy.filters.http.alternate_protocols_cache:
          '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
          config: {}
        envoy.filters.http.header_mutation/upstream_http3:
          '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
          mutations:
            responseMutations:
            - remove: alt-svc
    - match:
        path: /always-route
      name: always-route
      route:
        cluster: httproute/default/http3-always/rule/0
        upgradeConfigs:
        - upgradeType: websocket
      typedPerFilterConfig:
        envoy.filters.http.header_mutation/upstream_http3:
          '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
          mutations:
            responseMutations:
            - remove: alt-svc
    - match:
        path: /alpn-route
      name: alpn-route
      route:
        cluster: httproute/default/http3-alpn/rule/0
        upgradeConfigs:
        - upgradeType: websocket
      typedPerFilterConfig:
        envoy.filters.http.header_mutation/upstream_http3:
          '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
          mutations:
            responseMutations:
            - remove: alt-svc
    - match:
        path: /no-tls-route
      name: no-tls-route
      route:
        cluster: httproute/default/http3-no-tls/rule/0
        upgradeConfigs:
        - upgradeType: websocket
- ignorePortInHostMatching: true
  name: envoy-gateway/gateway-http3/https
  virtualHosts:
  - domains:
    - '*'
    name: envoy-gateway/gateway-http3/https/*
    routes:
    - match:
        path: /https-auto-route
      name: https-auto-route
      route:
        cluster: httproute/default/https-http3-auto/rule/0
        upgradeConfigs:
        - upgradeType: websocket
      typedPerFilterConfig:
        envoy.filters.http.alternate_protocols_cache:
          '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
          config: {}
        envoy.filters.http.header_mutation/upstream_http3:
          '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
          mutations:
            responseMutations:
            - remove: alt-svc
            - append:
                header:
                  key: alt-svc
                  value: h3=":8443"; ma=86400
    - match:
        path: /https-plain-route
      name: https-plain-route
      responseHeadersToAdd:
      - append: true
        header:
          key: alt-svc
          value: h3=":8443"; ma=86400
      route:
        cluster: httproute/default/https-plain/rule/0
        upgradeConfigs:
        - upgradeType: websocket
