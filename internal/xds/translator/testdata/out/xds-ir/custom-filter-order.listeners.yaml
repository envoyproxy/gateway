- address:
    socketAddress:
      address: 0.0.0.0
      portValue: 10080
  defaultFilterChain:
    filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        commonHttpProtocolOptions:
          headersWithUnderscoresAction: REJECT_REQUEST
        http2ProtocolOptions:
          initialConnectionWindowSize: 1048576
          initialStreamWindowSize: 65536
          maxConcurrentStreams: 100
        httpFilters:
        - disabled: true
          name: envoy.filters.http.basic_auth/securitypolicy/envoy-gateway/policy-for-gateway
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuth
            users:
              inlineBytes: dXNlcjE6e1NIQX10RVNzQm1FL3lOWTNsYjZhMEw2dlZRRVpOcXc9CnVzZXIyOntTSEF9RUo5TFBGRFhzTjl5blNtYnh2anA3NUJtbHg4PQo=
        - name: envoy.filters.http.cors
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
        - disabled: true
          name: envoy.filters.http.filter_chain.eep.listener
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.filter_chain.v3.FilterChainConfig
        - disabled: true
          name: envoy.filters.http.filter_chain.eep.route
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.filter_chain.v3.FilterChainConfig
        - name: envoy.filters.http.jwt_authn
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
            providers:
              example1_324018c9eaae726a:
                audiences:
                - one.foo.com
                claimToHeaders:
                - claimName: claim1
                  headerName: one-route-example-key
                forward: true
                issuer: https://one.example.com
                normalizePayloadInMetadata:
                  spaceDelimitedClaims:
                  - scope
                  - scp
                payloadInMetadata: example1
                remoteJwks:
                  asyncFetch: {}
                  cacheDuration: 300s
                  httpUri:
                    cluster: one_example_com_443
                    timeout: 10s
                    uri: https://one.example.com/jwt/public-key/jwks.json
              example2_b2e71814e87a6562:
                audiences:
                - two.foo.com
                claimToHeaders:
                - claimName: claim2
                  headerName: two-route-example-key
                forward: true
                issuer: http://two.example.com
                normalizePayloadInMetadata:
                  spaceDelimitedClaims:
                  - scope
                  - scp
                payloadInMetadata: example2
                remoteJwks:
                  asyncFetch: {}
                  cacheDuration: 300s
                  httpUri:
                    cluster: two_example_com_80
                    timeout: 10s
                    uri: http://two.example.com/jwt/public-key/jwks.json
            requirementMap:
              example1-or-example2_73a070ef6c8ee8ea:
                requiresAny:
                  requirements:
                  - providerName: example1_324018c9eaae726a
                  - providerName: example2_b2e71814e87a6562
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            suppressEnvoyHeaders: true
        mergeSlashes: true
        normalizePath: true
        pathWithEscapedSlashesAction: UNESCAPE_AND_REDIRECT
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: envoy-gateway/gateway-1/http
        serverHeaderTransformation: PASS_THROUGH
        statPrefix: http-10080
        useRemoteAddress: true
    name: envoy-gateway/gateway-1/http
  maxConnectionsToAcceptPerSocketEvent: 1
  name: envoy-gateway/gateway-1/http
  perConnectionBufferLimitBytes: 32768
