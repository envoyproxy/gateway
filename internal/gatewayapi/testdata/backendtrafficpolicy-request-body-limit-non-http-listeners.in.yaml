gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-mixed
    spec:
      gatewayClassName: envoy-gateway-class
      allowedListeners:
        namespaces:
          from: All
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
        - name: tcp
          protocol: TCP
          port: 8089
          allowedRoutes:
            kinds:
              - kind: TCPRoute
                group: gateway.networking.k8s.io
        - name: udp
          protocol: UDP
          port: 8162
          allowedRoutes:
            kinds:
              - kind: UDPRoute
                group: gateway.networking.k8s.io
        - name: tls
          protocol: TLS
          port: 8443
          tls:
            mode: Passthrough
          allowedRoutes:
            namespaces:
              from: All
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-tcp-only
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: tcp
          protocol: TCP
          port: 8089
          allowedRoutes:
            kinds:
              - kind: TCPRoute
                group: gateway.networking.k8s.io
listenerSets:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: ListenerSet
    metadata:
      namespace: envoy-gateway
      name: ext-listeners
    spec:
      parentRef:
        name: gateway-mixed
      listeners:
        - name: ext-http
          protocol: HTTP
          port: 8081
          allowedRoutes:
            namespaces:
              from: All
        - name: ext-tcp
          protocol: TCP
          port: 9000
          allowedRoutes:
            kinds:
              - kind: TCPRoute
                group: gateway.networking.k8s.io
backendTrafficPolicies:
  # Warning: requestBodyLimit has no effect on TCP listeners
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: policy-gateway-tcp
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-mixed
          sectionName: tcp
      requestBodyLimit:
        maxSize: 1Mi
  # Warning: requestBodyLimit has no effect on UDP listeners
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: policy-gateway-udp
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-mixed
          sectionName: udp
      requestBodyLimit:
        maxSize: 1Mi
  # Warning: requestBodyLimit has no effect on TLS listeners
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: policy-gateway-tls
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-mixed
          sectionName: tls
      requestBodyLimit:
        maxSize: 1Mi
  # No warning: the limit applies to the HTTP listener
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: policy-gateway-http
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-mixed
          sectionName: http
      requestBodyLimit:
        maxSize: 1Mi
  # Warning: the whole Gateway has no HTTP listener
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: policy-gateway-tcp-only
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-tcp-only
      requestBodyLimit:
        maxSize: 1Mi
  # Warning: requestBodyLimit has no effect on TCP listeners
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: policy-listenerset-tcp
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: ext-listeners
          sectionName: ext-tcp
      requestBodyLimit:
        maxSize: 1Mi
  # No warning: the ListenerSet has an HTTP listener
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: policy-listenerset
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: ext-listeners
      requestBodyLimit:
        maxSize: 1Mi
