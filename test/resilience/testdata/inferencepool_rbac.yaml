# Grant envoy-gateway permission to list/watch InferencePools, which the InferencePool test
# registers under extensionManager.backendResources. Without this, envoy-gateway cannot see
# the pools and reports "custom backend InferencePool ... not found".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envoy-gateway-resilience-inferencepools
rules:
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: envoy-gateway-resilience-inferencepools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: envoy-gateway-resilience-inferencepools
subjects:
  - kind: ServiceAccount
    name: envoy-gateway
    namespace: envoy-gateway-system
