envoyProxyForGatewayClass:
  apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    namespace: envoy-gateway-system
    name: test
  spec:
    telemetry:
      accessLog:
        settings:
        - sinks:
          - type: OpenTelemetry
            openTelemetry:
              backendRefs:
              - Name: backend-otel
                Namespace: envoy-gateway
                Kind: Backend
                Group: gateway.envoyproxy.io
                port: 4317
              buffer:
                # Above the 32-bit unsigned integer Envoy carries buffer_size_bytes in,
                # so this is rejected at translation rather than at admission.
                sizeBytes: 5Gi
backends:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: Backend
  metadata:
    name: backend-otel
    namespace: envoy-gateway
  spec:
    endpoints:
    - ip:
        address: 2.2.2.2
        port: 4317
gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: gateway-1
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
