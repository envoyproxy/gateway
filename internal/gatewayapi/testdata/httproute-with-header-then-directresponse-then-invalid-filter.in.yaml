gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: gateway-1
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.envoyproxy.io"
      allowedRoutes:
        namespaces:
          from: All
httpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: httproute-header-then-directresponse-then-invalid
  spec:
    hostnames:
    - gateway.envoyproxy.io
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
      sectionName: http
    rules:
    # ResponseHeaderModifier Set-Cookie must survive when the later DirectResponse
    # (same header name) is replaced with a 500 because of an invalid filter.
    - matches:
      - path:
          value: "/header-then-direct-response-then-invalid"
      filters:
      - type: ResponseHeaderModifier
        responseHeaderModifier:
          set:
          - name: Set-Cookie
            value: keep=1
      - type: ExtensionRef
        extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: direct-response-inline
      - type: URLRewrite
        urlRewrite:
          hostname: "192.168.1.1"
httpFilters:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: HTTPRouteFilter
  metadata:
    name: direct-response-inline
    namespace: default
  spec:
    directResponse:
      contentType: text/plain
      statusCode: 418
      header:
        set:
        - name: Set-Cookie
          value: dropped=1
      body:
        type: Inline
        inline: "OK"
