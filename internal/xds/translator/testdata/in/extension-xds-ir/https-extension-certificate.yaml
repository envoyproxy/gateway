# HTTPS listeners whose certificates are resolved by the extension server.
http:
# Resolved to a name only: the name on the filter chain is exactly what the extension returned,
# with no sds_config, and no Secret is emitted for it.
- name: "team-a/web/https"
  address: "::"
  port: 10443
  hostnames:
  - "app.example.com"
  metadata:
    kind: Gateway
    namespace: team-a
    name: web
    sectionName: https
  tls:
    certificates:
    - name: app-cert
      extensionRef:
        object:
          apiVersion: cert.example.io/v1alpha1
          kind: ExampleCertificate
          metadata:
            namespace: team-a
            name: app-cert
  routes:
  - name: "app-route"
    hostname: "app.example.com"
    destination:
      name: "app-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "app-route-dest/backend/0"
# A Secret certificate next to an extension certificate resolved over SDS: the Secret is emitted
# as before, and the extension certificate keeps the sds_config the extension returned.
- name: "team-a/web/mixed"
  address: "::"
  port: 10444
  hostnames:
  - "mixed.example.com"
  metadata:
    kind: Gateway
    namespace: team-a
    name: web
    sectionName: mixed
  tls:
    certificates:
    - name: secret-1
      # byte slice representation of "cert-data"
      certificate: [99, 101, 114, 116, 45, 100, 97, 116, 97]
      # byte slice representation of "key-data"
      privateKey: [107, 101, 121, 45, 100, 97, 116, 97]
    - name: sds-cert
      extensionRef:
        object:
          apiVersion: cert.example.io/v1alpha1
          kind: ExampleCertificate
          metadata:
            namespace: team-a
            name: sds-cert
  routes:
  - name: "mixed-route"
    hostname: "mixed.example.com"
    destination:
      name: "mixed-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "mixed-route-dest/backend/0"
# Two listeners sharing a port. The refused one is left out, and the other keeps serving.
