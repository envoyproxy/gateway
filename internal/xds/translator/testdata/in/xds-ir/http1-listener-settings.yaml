# Tests CTP http1 listener settings (preserveHeaderCase, enableTrailers, http10).
# Each listener exercises one field. With the flag off, all three seed the upstream cluster.
# With the flag on (ctp-client-scope variant), none seed the cluster — HCM retains them.
http:
- name: "preserve-case-listener"
  address: "::"
  port: 10080
  hostnames:
  - "*"
  http1:
    preserveHeaderCase: true
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  - name: "preserve-case-route"
    hostname: "*"
    destination:
      name: "preserve-case-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "preserve-case-dest/backend/0"
- name: "trailers-listener"
  address: "::"
  port: 10081
  hostnames:
  - "*"
  http1:
    enableTrailers: true
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  - name: "trailers-route"
    hostname: "*"
    destination:
      name: "trailers-dest"
      settings:
      - endpoints:
        - host: "1.2.3.5"
          port: 50000
        name: "trailers-dest/backend/0"
- name: "http10-listener"
  address: "::"
  port: 10082
  hostnames:
  - "foo.com"
  http1:
    http10:
      defaultHost: "foo.com"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  - name: "http10-route"
    hostname: "*"
    destination:
      name: "http10-dest"
      settings:
      - endpoints:
        - host: "1.2.3.6"
          port: 50000
        name: "http10-dest/backend/0"
