apiVersion: v1
kind: ConfigMap
metadata:
  name: h3-backend-caddyfile
  namespace: gateway-conformance-infra
data:
  Caddyfile: |
    {
      auto_https off
    }
    :8443 {
      tls /etc/tls/tls.crt /etc/tls/tls.key
      respond "{http.request.proto}"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: h3-backend
  namespace: gateway-conformance-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: h3-backend
      version: v1
  template:
    metadata:
      labels:
        app: h3-backend
        version: v1
    spec:
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: quic
              containerPort: 8443
              protocol: UDP
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            tcpSocket:
              port: 8443
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
            - name: tls
              mountPath: /etc/tls
              readOnly: true
      volumes:
        - name: caddyfile
          configMap:
            name: h3-backend-caddyfile
        - name: tls
          secret:
            secretName: h3-backend-tls
---
apiVersion: v1
kind: Service
metadata:
  name: h3-backend
  namespace: gateway-conformance-infra
spec:
  selector:
    app: h3-backend
    version: v1
  ports:
    # QUIC is UDP, so the Service has to expose the port for both protocols:
    # the TCP one carries the HTTP/1.1 and HTTP/2 fallback in Auto mode.
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: quic
      port: 8443
      targetPort: 8443
      protocol: UDP
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: h3-backend
  namespace: gateway-conformance-infra
spec:
  endpoints:
    - fqdn:
        hostname: h3-backend.gateway-conformance-infra.svc.cluster.local
        port: 8443
  tls:
    autoSNIFromEndpointHostname: true
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: h3-backend-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: upstream-http3
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /upstream-http3
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: h3-backend
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: upstream-http3
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: upstream-http3
  # Always, so the test does not depend on the backend advertising alt-svc first:
  # Envoy goes straight to QUIC and there is no TCP fallback to mask a failure.
  http3:
    mode: Always
---
# Same Backend, a second BackendTrafficPolicy: only the mode differs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: upstream-http3-auto
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /upstream-http3-auto
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: h3-backend
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: upstream-http3-auto
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: upstream-http3-auto
  # Auto reaches HTTP/3 the long way round: the first request goes over TCP, Caddy's
  # response advertises h3 through alt-svc, and only then does Envoy race QUIC. Early
  # requests are therefore expected to be HTTP/1.1 or HTTP/2.
  http3:
    mode: Auto
