http:
- address: 0.0.0.0
  hostnames:
  - "*"
  metadata:
    kind: Gateway
    name: gateway-1
    namespace: envoy-gateway
    sectionName: http
  name: envoy-gateway/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - destination:
      name: httproute/default/httproute-1/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-1/rule/0/backend/0
    hostname: gateway.envoyproxy.io
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-1
      namespace: default
    name: httproute/default/httproute-1/rule/0/match/0/gateway_envoyproxy_io
    pathMatch:
      distinct: false
      name: ""
      prefix: /static
    traffic:
      compression:
      - type: Brotli
        chooseFirst: true
        minContentLength: 100
        contentTypes:
        - value: image/svg+xml
        - type: Prefix
          value: text/
        - type: Suffix
          value: +json
        - type: RegularExpression
          value: ^application/(javascript|wasm)$
      - type: Gzip
        contentTypes:
        - value: image/svg+xml
        - type: Prefix
          value: text/
        - type: Suffix
          value: +json
        - type: RegularExpression
          value: ^application/(javascript|wasm)$
  - destination:
      name: httproute/default/httproute-2/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 8.8.8.8
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-2/rule/0/backend/0
    hostname: gateway.envoyproxy.io
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-2
      namespace: default
    name: httproute/default/httproute-2/rule/0/match/0/gateway_envoyproxy_io
    pathMatch:
      distinct: false
      name: ""
      prefix: /assets
    traffic:
      compression:
      - type: Brotli
        chooseFirst: true
        minContentLength: 100
        contentTypes:
        - value: image/svg+xml
        - type: Prefix
          value: text/
        - type: Suffix
          value: +json
        - type: RegularExpression
          value: ^application/(javascript|wasm)$
        brotli:
          quality: 11
  - destination:
      name: httproute/default/httproute-3/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 9.9.9.9
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-3/rule/0/backend/0
    hostname: gateway.envoyproxy.io
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-3
      namespace: default
    name: httproute/default/httproute-3/rule/0/match/0/gateway_envoyproxy_io
    pathMatch:
      distinct: false
      name: ""
      prefix: /api
    traffic:
      compression:
      - type: Brotli
        chooseFirst: true
  - destination:
      name: httproute/default/httproute-4/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 10.10.10.10
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-4/rule/0/backend/0
    hostname: gateway.envoyproxy.io
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-4
      namespace: default
    name: httproute/default/httproute-4/rule/0/match/0/gateway_envoyproxy_io
    pathMatch:
      distinct: false
      name: ""
      prefix: /feeds
    traffic:
      compression:
      - type: Gzip
        chooseFirst: true
        contentTypes:
        - value: application/rss+xml
        - value: application/atom+xml
  - destination:
      name: httproute/default/httproute-5/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 11.11.11.11
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-5/rule/0/backend/0
    hostname: gateway.envoyproxy.io
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-5
      namespace: default
    name: httproute/default/httproute-5/rule/0/match/0/gateway_envoyproxy_io
    pathMatch:
      distinct: false
      name: ""
      prefix: /downloads
    traffic:
      compression:
      - type: Brotli
        chooseFirst: true
        contentTypes:
        - value: image/svg+xml
        - type: Prefix
          value: text/
        - type: Suffix
          value: +json
        - type: RegularExpression
          value: ^application/(javascript|wasm)$
