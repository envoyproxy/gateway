gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: gateway-1
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.envoyproxy.io"
      allowedRoutes:
        namespaces:
          from: All
httpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: httproute-1
  spec:
    hostnames:
    - gateway.envoyproxy.io
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
      sectionName: http
    rules:
    - matches:
      - path:
          value: "/foo"
      backendRefs:
      - name: service-1
        port: 8080
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: oauth2-backendcluster
backends:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: Backend
  metadata:
    name: idp
    namespace: default
  spec:
    endpoints:
    - fqdn:
        hostname: idp.example.com
        port: 443
httpFilters:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: HTTPRouteFilter
  metadata:
    name: oauth2-backendcluster
    namespace: default
  spec:
    credentialInjection:
      credential:
        oauth2:
          tokenEndpoint: https://idp.example.com/oauth2/token
          clientID: client-1
          clientSecret:
            name: oauth2-client-secret
          backendRefs:
          - group: gateway.envoyproxy.io
            kind: Backend
            name: idp
            port: 443
          backendSettings:
            timeout:
              http:
                requestTimeout: 5s
secrets:
- apiVersion: v1
  kind: Secret
  metadata:
    name: oauth2-client-secret
    namespace: default
  data:
    client-secret: Y2xpZW50LXNlY3JldA==
