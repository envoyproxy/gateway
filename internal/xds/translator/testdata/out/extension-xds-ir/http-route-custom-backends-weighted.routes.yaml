- ignorePortInHostMatching: true
  name: custom-backends-weighted-listener
  virtualHosts:
  - domains:
    - '*'
    name: custom-backends-weighted-listener/*
    routes:
    - match:
        pathSeparatedPrefix: /mixed
      name: mixed-route
      responseHeadersToAdd:
      - header:
          key: mock-extension-was-here-route-name
          value: mixed-route
      - header:
          key: mock-extension-was-here-route-hostnames
          value: '*'
      - header:
          key: mock-extension-was-here-extensionRef-name
          value: inference-pool
      - header:
          key: mock-extension-was-here-extensionRef-namespace
          value: default
      - header:
          key: mock-extension-was-here-extensionRef-kind
          value: InferencePool
      - header:
          key: mock-extension-was-here-extensionRef-apiversion
          value: inference.networking.x-k8s.io/v1alpha2
      route:
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        upgradeConfigs:
        - upgradeType: websocket
        weightedClusters:
          clusters:
          - name: mixed-route-dest/backend/0
            weight: 1
          - name: mixed-route-dest/backend/1
            weight: 1
    - match:
        pathSeparatedPrefix: /pools
      name: pools-route
      responseHeadersToAdd:
      - header:
          key: mock-extension-was-here-route-name
          value: pools-route
      - header:
          key: mock-extension-was-here-route-hostnames
          value: '*'
      - header:
          key: mock-extension-was-here-extensionRef-name
          value: inference-pool
      - header:
          key: mock-extension-was-here-extensionRef-namespace
          value: default
      - header:
          key: mock-extension-was-here-extensionRef-kind
          value: InferencePool
      - header:
          key: mock-extension-was-here-extensionRef-apiversion
          value: inference.networking.x-k8s.io/v1alpha2
      - header:
          key: mock-extension-was-here-route-name
          value: pools-route
      - header:
          key: mock-extension-was-here-route-hostnames
          value: '*'
      - header:
          key: mock-extension-was-here-extensionRef-name
          value: inference-pool-2
      - header:
          key: mock-extension-was-here-extensionRef-namespace
          value: default
      - header:
          key: mock-extension-was-here-extensionRef-kind
          value: InferencePool
      - header:
          key: mock-extension-was-here-extensionRef-apiversion
          value: inference.networking.x-k8s.io/v1alpha2
      route:
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        upgradeConfigs:
        - upgradeType: websocket
        weightedClusters:
          clusters:
          - name: pools-route-dest/backend/0
            weight: 3
          - name: pools-route-dest/backend/1
            weight: 1
