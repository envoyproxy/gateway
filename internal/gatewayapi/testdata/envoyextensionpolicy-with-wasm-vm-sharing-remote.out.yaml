envoyExtensionPolicies:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyExtensionPolicy
  metadata:
    name: policy-for-http-route-1
    namespace: default
  spec:
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: httproute-1
    wasm:
    - code:
        http:
          sha256: null
          url: https://www.example.com/shared-filter.wasm
        type: HTTP
      name: shared-http-filter
      vmSharingScope: Namespace
    - code:
        image:
          sha256: null
          url: oci://www.example.com/shared-filter:v1.0.0
        type: Image
      name: shared-image-filter
      vmSharingScope: Namespace
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway-1
        namespace: envoy-gateway
        sectionName: http
      conditions:
      - lastTransitionTime: null
        message: Policy has been accepted.
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: spec.wasm.code is deprecated, use EnvoyProxy spec.wasmModules instead
        reason: DeprecatedField
        status: "True"
        type: Warning
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
