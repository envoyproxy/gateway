# grpc-health-backend rejects requests whose :authority is not a valid
# authority, like the Envoy cluster name (grpcroute/<ns>/<name>/rule/0) Envoy
# falls back to when a gRPC health check has no authority.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-health-backend
  namespace: gateway-conformance-infra
  labels:
    app: grpc-health-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-health-backend
  template:
    metadata:
      labels:
        app: grpc-health-backend
    spec:
      containers:
        - name: grpc-health-backend
          image: envoyproxy/gateway-grpc-health-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          # The test applies the health checked routes once this pod is Ready,
          # so Ready must mean that the gRPC server already serves.
          readinessProbe:
            grpc:
              port: 9000
            periodSeconds: 1
          resources:
            requests:
              cpu: 10m
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-health-backend
  namespace: gateway-conformance-infra
spec:
  selector:
    app: grpc-health-backend
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
      appProtocol: kubernetes.io/h2c
