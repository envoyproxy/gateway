backendTLSPolicies:
  # Gives the merged service-1 cluster the TLS that HTTP/3 requires.
  - apiVersion: gateway.networking.k8s.io/v1alpha2
    kind: BackendTLSPolicy
    metadata:
      name: policy-btls
      namespace: default
    spec:
      targetRefs:
        - group: ""
          kind: Service
          name: service-1
      validation:
        caCertificateRefs:
          - name: ca-cert
            group: ""
            kind: ConfigMap
        hostname: example.com
# HTTP/3 is judged per merged cluster, not per route: service-1 keeps it, service-2 drops it
# and is named in the Warning, and the route itself is not reported as having lost HTTP/3.
backendTrafficPolicies:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: btp-gateway-http3
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-1
      http3:
        mode: Always
