- address:
    socketAddress:
      address: 0.0.0.0
      portValue: 10080
  defaultFilterChain:
    filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        commonHttpProtocolOptions:
          headersWithUnderscoresAction: REJECT_REQUEST
        http2ProtocolOptions:
          initialConnectionWindowSize: 1048576
          initialStreamWindowSize: 65536
          maxConcurrentStreams: 100
        httpFilters:
        - disabled: true
          name: envoy.filters.http.compressor.brotli
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            chooseFirst: true
            compressorLibrary:
              name: envoy.compression.brotli.compressor
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.brotli.compressor.v3.Brotli
        - disabled: true
          name: envoy.filters.http.compressor.brotli/284c9323f703b5bc
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            chooseFirst: true
            compressorLibrary:
              name: envoy.compression.brotli.compressor
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.brotli.compressor.v3.Brotli
            responseDirectionConfig:
              commonConfig:
                contentTypeMatcher:
                - exact: image/svg+xml
                  ignoreCase: true
                - ignoreCase: true
                  prefix: text/
                - ignoreCase: true
                  suffix: +json
                - safeRegex:
                    regex: ^application/(javascript|wasm)$
        - disabled: true
          name: envoy.filters.http.compressor.brotli/640b2d04f28edf39
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            chooseFirst: true
            compressorLibrary:
              name: envoy.compression.brotli.compressor
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.brotli.compressor.v3.Brotli
            responseDirectionConfig:
              commonConfig:
                contentTypeMatcher:
                - exact: image/svg+xml
                  ignoreCase: true
                - ignoreCase: true
                  prefix: text/
                - ignoreCase: true
                  suffix: +json
                - safeRegex:
                    regex: ^application/(javascript|wasm)$
                minContentLength: 100
        - disabled: true
          name: envoy.filters.http.compressor.gzip/2752867186dfa5aa
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            chooseFirst: true
            compressorLibrary:
              name: envoy.compression.gzip.compressor
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
            responseDirectionConfig:
              commonConfig:
                contentTypeMatcher:
                - exact: application/rss+xml
                  ignoreCase: true
                - exact: application/atom+xml
                  ignoreCase: true
        - disabled: true
          name: envoy.filters.http.compressor.gzip/5044b9161fc5ad19
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            compressorLibrary:
              name: envoy.compression.gzip.compressor
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
            responseDirectionConfig:
              commonConfig:
                contentTypeMatcher:
                - exact: image/svg+xml
                  ignoreCase: true
                - ignoreCase: true
                  prefix: text/
                - ignoreCase: true
                  suffix: +json
                - safeRegex:
                    regex: ^application/(javascript|wasm)$
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            suppressEnvoyHeaders: true
        mergeSlashes: true
        normalizePath: true
        pathWithEscapedSlashesAction: UNESCAPE_AND_REDIRECT
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: envoy-gateway/gateway-1/http
        serverHeaderTransformation: PASS_THROUGH
        statPrefix: http-10080
        useRemoteAddress: true
    name: envoy-gateway/gateway-1/http
  maxConnectionsToAcceptPerSocketEvent: 1
  name: envoy-gateway/gateway-1/http
  perConnectionBufferLimitBytes: 32768
