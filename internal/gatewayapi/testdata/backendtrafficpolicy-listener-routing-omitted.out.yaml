  metadata:
    name: gateway-1
    namespace: default
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: listener-1
      port: 9081
      protocol: HTTP
    - name: listener-2
      port: 9082
      protocol: HTTP
