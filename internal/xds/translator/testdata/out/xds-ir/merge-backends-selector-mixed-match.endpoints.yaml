- clusterName: httproute/default/http-route-1/rule/1
  endpoints:
  - lbEndpoints:
    - endpoint:
        address:
          socketAddress:
            address: 7.7.7.11
            portValue: 8080
      loadBalancingWeight: 1
    loadBalancingWeight: 1
    locality:
      region: httproute/default/http-route-1/rule/1/backend/0
    metadata:
      filterMetadata:
        envoy-gateway:
          resources:
          - kind: Service
            name: service-not-selected
            namespace: default
            sectionName: "8080"
- clusterName: service/default/service-selected/8080/http
  endpoints:
  - lbEndpoints:
    - endpoint:
        address:
          socketAddress:
            address: 7.7.7.10
            portValue: 8080
      loadBalancingWeight: 1
    loadBalancingWeight: 1
    locality:
      region: service/default/service-selected/8080/http
    metadata:
      filterMetadata:
        envoy-gateway:
          resources:
          - kind: Service
            name: service-selected
            namespace: default
            sectionName: "8080"
