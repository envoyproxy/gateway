apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: route-priority-proxy-config
  namespace: gateway-conformance-infra
spec:
  enableRoutePriority: true
  ipFamily: IPv4
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: route-priority-gateway
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: route-priority-proxy-config
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-priority-catch-all
  namespace: gateway-conformance-infra
  annotations:
    gateway.envoyproxy.io/route-priority: "100"
spec:
  parentRefs:
    - name: route-priority-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: matched-route
                value: catch-all
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-priority-specific
  namespace: gateway-conformance-infra
  annotations:
    gateway.envoyproxy.io/route-priority: "1"
spec:
  parentRefs:
    - name: route-priority-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /specific
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: matched-route
                value: specific
      backendRefs:
        - name: infra-backend-v1
          port: 8080
