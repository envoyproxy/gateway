apiVersion: v1
kind: Secret
metadata:
  namespace: gateway-conformance-infra
  name: authentication-any-users
data:
  .htpasswd: "dXNlcjE6e1NIQX10RVNzQm1FL3lOWTNsYjZhMEw2dlZRRVpOcXc9CnVzZXIyOntTSEF9RUo5TFBGRFhzTjl5blNtYnh2anA3NUJtbHg4PQo="
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentication-any
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /authentication-any
    backendRefs:
    - name: infra-backend-v1
      port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authentication-any
  namespace: gateway-conformance-infra
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: authentication-any
  authentication:
    mode: Any
  jwt:
    providers:
    - name: example
      remoteJWKS:
        uri: http://static-file-server.gateway-conformance-infra/jwt/jwks.json
  basicAuth:
    users:
      name: authentication-any-users
