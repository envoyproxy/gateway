http:
- name: "first-listener"
  address: "::"
  port: 10080
  hostnames:
  - "*"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  # A user-pinned cookie suffix: every OAuth2 cookie is named "<Purpose>-checkout".
  - name: "first-route"
    hostname: "*"
    pathMatch:
      exact: "foo"
    destination:
      name: "first-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "first-route-dest/backend/0"
    security:
      oidc:
        name: securitypolicy/default/policy-for-first-route
        clientID: client.oauth.foo.com
        clientSecret: Y2xpZW50MTpzZWNyZXQK
        hmacSecret: qrOYACHXoe7UEDI/raOjNSx+Z9ufXSc/22C3T6X/zPY=
        provider:
          authorizationEndpoint: https://oauth.foo.com/oauth2/v2/auth
          tokenEndpoint: https://oauth.foo.com/token
        scopes:
        - openid
        redirectURL: "https://www.example.com/foo/oauth2/callback"
        redirectPath: "/foo/oauth2/callback"
        logoutPath: "/foo/logout"
        cookieSuffix: checkout
        # The gatewayapi layer copies the whole cookieNames struct into the IR, so
        # the suffix it resolved into cookieSuffix is echoed here and ignored.
        cookieNameOverrides:
          suffix: checkout
        refreshToken: true
  # The same suffix with two cookies named outright: the overrides win, the rest
  # keep the suffix.
  - name: "second-route"
    hostname: "*"
    pathMatch:
      exact: "bar"
    destination:
      name: "second-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "second-route-dest/backend/0"
    security:
      oidc:
        name: securitypolicy/default/policy-for-second-route
        clientID: client.oauth.bar.com
        clientSecret: Y2xpZW50MTpzZWNyZXQK
        hmacSecret: qrOYACHXoe7UEDI/raOjNSx+Z9ufXSc/22C3T6X/zPY=
        provider:
          authorizationEndpoint: https://oauth.bar.com/oauth2/v2/auth
          tokenEndpoint: https://oauth.bar.com/token
        scopes:
        - openid
        redirectURL: "https://www.example.com/bar/oauth2/callback"
        redirectPath: "/bar/oauth2/callback"
        logoutPath: "/bar/logout"
        cookieSuffix: checkout
        cookieNameOverrides:
          suffix: checkout
          accessToken: "myapp_access_token"
          idToken: "myapp_id_token"
        cookieDomain: "example.com"
        refreshToken: true
