                      appended to the X-Forwarded-Host header when hostname rewriting is configured.
                      Defaults to true for backward compatibility.
                    type: boolean
                  hostname:
                    description: |-
                      Hostname is the value to be used to replace the Host header value during
                      forwarding.
                    properties:
                      header:
