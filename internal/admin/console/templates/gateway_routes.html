{{template "base.html" .}}

{{define "gateway-routes-content"}}
<div class="card">
    <div class="card-header">
        <h1 class="card-title">{{.Title}}</h1>
        <button class="btn btn-secondary" onclick="GatewayRoutes.load()">Refresh</button>
    </div>
    <div class="card-body">
        <p>Manage path matches (route table). Each route becomes one match entry inside its service's generated HTTPRoute.</p>
        <div id="gw-auth" style="margin: 1rem 0;">
            <label>Bearer token:
                <input type="password" id="gw-token" placeholder="paste token" style="min-width: 320px;">
            </label>
            <label style="margin-left: 1rem;">Tenant:
                <input type="text" id="gw-tenant" placeholder="tenant" style="min-width: 160px;">
            </label>
            <button class="btn btn-secondary" onclick="GatewayAuth.save()">Save</button>
            <span id="gw-token-status"></span>
        </div>
        <div id="gw-message"></div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h2 class="card-title">Create / Update Route</h2>
    </div>
    <div class="card-body">
        <form id="gw-route-form" onsubmit="GatewayRoutes.submit(event)">
            <input type="hidden" id="route-id">
            <div class="gw-form-grid">
                <label>Service<select id="route-service" required></select></label>
                <label>Path<input type="text" id="route-path" required placeholder="/v1/parking/parkingById"></label>
                <label>Match type<select id="route-match">
                    <option value="Exact">Exact</option>
                    <option value="PathPrefix">PathPrefix</option>
                </select></label>
            </div>
            <div style="margin-top: 1rem;">
                <button type="submit" class="btn">Save</button>
                <button type="button" class="btn btn-secondary" onclick="GatewayRoutes.resetForm()">Clear</button>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h2 class="card-title">Routes</h2>
        <label>Filter by service:
            <select id="route-filter" onchange="GatewayRoutes.load()">
                <option value="">All</option>
            </select>
        </label>
    </div>
    <div class="card-body">
        <table class="data-table" id="gw-routes-table">
            <thead>
                <tr><th>ID</th><th>Service</th><th>Path</th><th>Match type</th><th>Actions</th></tr>
            </thead>
            <tbody id="gw-routes-body">
                <tr><td colspan="5">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
window.GatewayAuth = {
    key: 'gatewayToken',
    tenantKey: 'gatewayTenant',
    get: function() { return sessionStorage.getItem(this.key) || ''; },
    getTenant: function() { return sessionStorage.getItem(this.tenantKey) || ''; },
    save: function() {
        const v = document.getElementById('gw-token').value.trim();
        if (v) { sessionStorage.setItem(this.key, v); }
        const t = document.getElementById('gw-tenant');
        if (t) { sessionStorage.setItem(this.tenantKey, t.value.trim()); }
        this.refreshStatus();
    },
    refreshStatus: function() {
        const el = document.getElementById('gw-token-status');
        if (el) { el.textContent = this.get() ? ' token set' : ' no token'; }
        const t = document.getElementById('gw-tenant');
        if (t && !t.value) { t.value = this.getTenant(); }
    },
    headers: function(extra) {
        const h = Object.assign({
            'Authorization': 'Bearer ' + this.get(),
            'x_auth_request_type': 'jwt_operator'
        }, extra || {});
        const tenant = this.getTenant();
        if (tenant) { h['x_gmp_tenant'] = tenant; }
        return h;
    }
};

window.GatewayUtil = {
    icons: {
        edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>',
        trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>'
    },
    message: function(text, isError) {
        const el = document.getElementById('gw-message');
        if (!el) { return; }
        el.textContent = text;
        el.style.color = isError ? '#c0392b' : '#27ae60';
    },
    async handle(resp) {
        if (resp.status === 204) { return null; }
        const body = await resp.json().catch(() => ({}));
        if (!resp.ok) {
            throw new Error((body && body.message) ? body.message : ('HTTP ' + resp.status));
        }
        return body;
    }
};

window.GatewayRoutes = {
    services: {},
    async loadServices() {
        const resp = await fetch('/api/gateway/services', { headers: GatewayAuth.headers() });
        const data = await GatewayUtil.handle(resp) || [];
        this.services = {};
        data.forEach(s => { this.services[s.id] = s; });
        const formSel = document.getElementById('route-service');
        const filterSel = document.getElementById('route-filter');
        const opts = data.map(s => '<option value="' + s.id + '">' + s.name + ' (' + s.cluster + ')</option>').join('');
        formSel.innerHTML = opts;
        filterSel.innerHTML = '<option value="">All</option>' + opts;
    },
    async load() {
        try {
            if (!Object.keys(this.services).length) { await this.loadServices(); }
            const filter = document.getElementById('route-filter').value;
            const url = '/api/gateway/routes' + (filter ? ('?service_id=' + filter) : '');
            const resp = await fetch(url, { headers: GatewayAuth.headers() });
            const data = await GatewayUtil.handle(resp);
            this.render(data || []);
        } catch (e) { GatewayUtil.message('Failed to load routes: ' + e.message, true); }
    },
    serviceName(id) {
        const s = this.services[id];
        return s ? (s.name + ' (' + s.cluster + ')') : id;
    },
    render(routes) {
        const body = document.getElementById('gw-routes-body');
        if (!routes.length) { body.innerHTML = '<tr><td colspan="5">No routes</td></tr>'; return; }
        body.innerHTML = routes.map(r =>
            '<tr>' +
            '<td>' + r.id + '</td>' +
            '<td>' + this.serviceName(r.service_id) + '</td>' +
            '<td>' + r.path + '</td>' +
            '<td>' + r.match_type + '</td>' +
            '<td>' +
            '<button class="btn-icon" title="Edit" aria-label="Edit" onclick=\'GatewayRoutes.edit(' + JSON.stringify(r) + ')\'>' + GatewayUtil.icons.edit + '</button> ' +
            '<button class="btn-icon btn-icon-danger" title="Delete" aria-label="Delete" onclick="GatewayRoutes.remove(' + r.id + ')">' + GatewayUtil.icons.trash + '</button>' +
            '</td></tr>'
        ).join('');
    },
    edit(r) {
        document.getElementById('route-id').value = r.id;
        document.getElementById('route-service').value = r.service_id;
        document.getElementById('route-path').value = r.path;
        document.getElementById('route-match').value = r.match_type;
    },
    resetForm() {
        document.getElementById('gw-route-form').reset();
        document.getElementById('route-id').value = '';
    },
    async submit(event) {
        event.preventDefault();
        const id = document.getElementById('route-id').value;
        const payload = {
            service_id: parseInt(document.getElementById('route-service').value, 10),
            path: document.getElementById('route-path').value.trim(),
            match_type: document.getElementById('route-match').value
        };
        const url = id ? '/api/gateway/routes?id=' + id : '/api/gateway/routes';
        const method = id ? 'PUT' : 'POST';
        try {
            const resp = await fetch(url, {
                method: method,
                headers: GatewayAuth.headers({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(payload)
            });
            await GatewayUtil.handle(resp);
            GatewayUtil.message('Route saved', false);
            this.resetForm();
            this.load();
        } catch (e) { GatewayUtil.message('Save failed: ' + e.message, true); }
    },
    async remove(id) {
        if (!confirm('Delete route ' + id + '?')) { return; }
        try {
            const resp = await fetch('/api/gateway/routes?id=' + id, { method: 'DELETE', headers: GatewayAuth.headers() });
            await GatewayUtil.handle(resp);
            GatewayUtil.message('Route deleted', false);
            this.load();
        } catch (e) { GatewayUtil.message('Delete failed: ' + e.message, true); }
    }
};

document.addEventListener('DOMContentLoaded', function() {
    GatewayAuth.refreshStatus();
    GatewayRoutes.load();
});
</script>
{{end}}
