# The Gateways below are named for this test alone. The suite deletes a test's
# resources when it finishes, so a Gateway name shared with another test is deleted
# and recreated back to back, and the recreated Gateway can end up without status.
# xref https://github.com/envoyproxy/gateway/issues/8677
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internet-gateway-for-pol-status
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: internet
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private-gateway-for-pol-status
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: private
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: multiple-gc-btp
  namespace: gateway-conformance-infra
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internet-gateway-for-pol-status
    sectionName: http
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: private-gateway-for-pol-status
    sectionName: http
  responseOverride:
  - match:
      statusCodes:
      - type: Value
        value: 418
    response:
      statusCode: 500
