        name: httproute/default/httproute-1/rule/4/match/0/*
        pathMatch:
          distinct: false
          name: ""
          prefix: /append-x-forwarded-host
      - destination:
          metadata:
            kind: HTTPRoute
            name: httproute-1
            namespace: default
          name: httproute/default/httproute-1/rule/5
          settings:
          - addressType: IP
            endpoints:
            - host: 7.7.7.7
              port: 8080
            filters:
              urlRewrite:
                appendXForwardedHost: false
                host:
                  name: rewritten.example.com
            metadata:
              kind: Service
              name: service-1
              namespace: default
              sectionName: "8080"
            name: httproute/default/httproute-1/rule/5/backend/0
            protocol: HTTP
            weight: 1
        hostname: '*'
        isHTTP2: false
        metadata:
          kind: HTTPRoute
          name: httproute-1
          namespace: default
        name: httproute/default/httproute-1/rule/5/match/0/*
        pathMatch:
          distinct: false
          name: ""
          prefix: /no-x-forwarded-host
      - directResponse:
          statusCode: 500
        hostname: '*'
        isHTTP2: false
        metadata:
          kind: HTTPRoute
          name: httproute-1
          namespace: default
        name: httproute/default/httproute-1/rule/2/match/0/*
        pathMatch:
          distinct: false
          name: ""
          prefix: /path-regex
      - directResponse:
          statusCode: 500
        hostname: '*'
        isHTTP2: false
        metadata:
          kind: HTTPRoute
          name: httproute-1
          namespace: default
        name: httproute/default/httproute-1/rule/3/match/0/*
        pathMatch:
          distinct: false
          name: ""
          prefix: /regex-path
      - directResponse:
          statusCode: 500
        hostname: '*'
        isHTTP2: false
        metadata:
          kind: HTTPRoute
          name: httproute-1
          namespace: default
        name: httproute/default/httproute-1/rule/1/match/0/*
        pathMatch:
          distinct: false
          name: ""
          prefix: /backend
      - directResponse:
          statusCode: 500
        hostname: '*'
        isHTTP2: false
        metadata:
          kind: HTTPRoute
          name: httproute-1
          namespace: default
        name: httproute/default/httproute-1/rule/0/match/0/*
        pathMatch:
          distinct: false
          name: ""
          prefix: /header
    readyListener:
      address: 0.0.0.0
      ipFamily: IPv4
      path: /ready
      port: 19003
