envoyProxyForGatewayClass:
  apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    namespace: envoy-gateway-system
    name: test
  spec:
    mergeBackends: {}
gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-1
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
httpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      namespace: default
      name: route-a
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
      rules:
        - matches:
            - path:
                value: /a
          backendRefs:
            - name: service-1
              port: 8080
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      namespace: default
      name: route-b
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
      rules:
        - matches:
            - path:
                value: /b
          backendRefs:
            - name: service-1
              port: 8080
backendTrafficPolicies:
  # Gateway-level BTP: cluster-scoped settings (circuitBreaker, healthCheck, loadBalancer) that
  # would normally apply uniformly to every route sharing a merged cluster.
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: btp-gw
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-1
      circuitBreaker:
        maxConnections: 10
      healthCheck:
        active:
          type: HTTP
          http:
            path: /healthz
          interval: 3s
      loadBalancer:
        type: LeastRequest
  # Route-level BTP for route-a: sets only a non-cluster-scoped field (faultInjection) and leaves
  # mergeType unset. envoyproxy/gateway#9588: mergeType unset means this policy fully replaces the
  # gateway policy for route-a, so route-a must be demerged from route-b's shared cluster and must
  # not inherit btp-gw's circuitBreaker/healthCheck/loadBalancer, even though faultInjection alone
  # isn't a cluster-scoped field.
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: default
      name: btp-a
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: route-a
      faultInjection:
        abort:
          httpStatus: 503
          percentage: 10
