# Tests that a BackendTrafficPolicy with active health check on a ListenerSet-attached
# route still applies correctly. The BTP takes effect (HC config is set on the cluster)
# but the HC event logger from EnvoyProxy.spec.telemetry.healthCheckLog is NOT propagated
# because the gateway-level context is not currently threaded through for ListenerSet parents.
# TODO: support ListenerSet-attached routes in BTP telemetry propagation
#       (see https://github.com/envoyproxy/gateway/issues/XXXX)
envoyProxyForGatewayClass:
  apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    namespace: envoy-gateway-system
    name: test
  spec:
    telemetry:
      healthCheckLog: {}
backendTrafficPolicies:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: BackendTrafficPolicy
  metadata:
    namespace: default
    name: btp-listenerset-route-hc
  spec:
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: route-extra-http-one
    healthCheck:
      active:
        type: HTTP
        http:
          path: /healthz
        interval: 5s
        timeout: 500ms
        unhealthyThreshold: 3
        healthyThreshold: 1
namespaces:
- apiVersion: v1
  kind: Namespace
  metadata:
    name: gateway-xls
    labels:
      allow-xls: "true"
gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: gateway-xls
    name: composite-gateway
  spec:
    gatewayClassName: envoy-gateway-class
    allowedListeners:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            allow-xls: "true"
    listeners:
    - name: core-http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
listenerSets:
- apiVersion: gateway.networking.k8s.io/v1
  kind: ListenerSet
  metadata:
    namespace: gateway-xls
    name: same-namespace-valid
  spec:
    parentRef:
      name: composite-gateway
    listeners:
    - name: extra-http-one
      protocol: HTTP
      port: 8081
      allowedRoutes:
        namespaces:
          from: All
    - name: extra-http-two
      protocol: HTTP
      port: 8082
      allowedRoutes:
        namespaces:
          from: All
httpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: route-core-listener
  spec:
    parentRefs:
    - namespace: gateway-xls
      name: composite-gateway
      sectionName: core-http
    rules:
    - backendRefs:
      - name: service-1
        port: 8080
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: route-extra-http-one
  spec:
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      namespace: gateway-xls
      name: same-namespace-valid
      sectionName: extra-http-one
    rules:
    - backendRefs:
      - name: service-1
        port: 8080
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: route-extra-http-two
  spec:
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      namespace: gateway-xls
      name: same-namespace-valid
      sectionName: extra-http-two
    rules:
    - backendRefs:
      - name: service-1
        port: 8080
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: route-entire-xls
  spec:
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      namespace: gateway-xls
      name: same-namespace-valid
    rules:
    - backendRefs:
      - name: service-1
        port: 8080
