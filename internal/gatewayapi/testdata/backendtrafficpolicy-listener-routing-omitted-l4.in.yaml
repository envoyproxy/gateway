gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: gateway-1
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: tcp-1
      protocol: TCP
      port: 91
      allowedRoutes:
        namespaces:
          from: All
    - name: tcp-2
      protocol: TCP
      port: 92
      allowedRoutes:
        namespaces:
          from: All
    - name: udp-1
      protocol: UDP
      port: 93
      allowedRoutes:
        namespaces:
          from: All
    - name: udp-2
      protocol: UDP
      port: 94
      allowedRoutes:
        namespaces:
          from: All
    - name: tls-1
      protocol: TLS
      port: 95
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
    - name: tls-2
      protocol: TLS
      port: 96
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
backendTrafficPolicies:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: BackendTrafficPolicy
  metadata:
    namespace: envoy-gateway
    name: gateway-routing
  spec:
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-1
    routingType: Endpoint
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: BackendTrafficPolicy
  metadata:
    namespace: envoy-gateway
    name: listener-routing
  spec:
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-1
      sectionName: tcp-1
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-1
      sectionName: udp-1
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-1
      sectionName: tls-1
    routingType: Service
tcpRoutes:
- apiVersion: gateway.networking.k8s.io/v1alpha2
  kind: TCPRoute
  metadata:
    namespace: default
    name: tcproute-1
  spec:
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
    rules:
    - backendRefs:
      - name: service-1
        port: 8163
udpRoutes:
- apiVersion: gateway.networking.k8s.io/v1alpha2
  kind: UDPRoute
  metadata:
    namespace: default
    name: udproute-1
  spec:
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
    rules:
    - backendRefs:
      - name: service-1
        port: 8162
# Both rules pool into one destination per listener.
tlsRoutes:
- apiVersion: gateway.networking.k8s.io/v1alpha2
  kind: TLSRoute
  metadata:
    namespace: default
    name: tlsroute-1
  spec:
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
    hostnames:
    - foo.com
    rules:
    - name: rule-1
      backendRefs:
      - name: service-1
        port: 8163
    - name: rule-2
      backendRefs:
      - name: service-2
        port: 8163
