http:
- address: 0.0.0.0
  externalPort: 80
  grpc:
    enableGRPCStats: true
    enableGRPCWeb: true
  hostnames:
  - '*'
  metadata:
    kind: Gateway
    name: gateway-1
    namespace: envoy-gateway
    sectionName: http
  name: envoy-gateway/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - destination:
      metadata:
        kind: GRPCRoute
        name: grpcroute-1
        namespace: default
      name: grpcroute/default/grpcroute-1/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        metadata:
          kind: Service
          name: service-1
          namespace: default
          sectionName: '8080'
        name: grpcroute/default/grpcroute-1/rule/0/backend/0
        protocol: GRPC
        weight: 1
    hostname: '*'
    isHTTP2: true
    metadata:
      kind: GRPCRoute
      name: grpcroute-1
      namespace: default
    name: grpcroute/default/grpcroute-1/rule/0/match/0/*
    pathMatch:
      distinct: false
      exact: /com.example/Example
      name: ''
  - destination:
      metadata:
        kind: HTTPRoute
        name: httproute-1
        namespace: default
      name: httproute/default/httproute-1/rule/1
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        metadata:
          kind: Service
          name: service-1
          namespace: default
          sectionName: '8080'
        name: httproute/default/httproute-1/rule/1/backend/0
        protocol: HTTP
        weight: 1
      - invalid: true
        name: httproute/default/httproute-1/rule/1/backend/2
        weight: 1
    hostname: '*'
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-1
      namespace: default
    name: httproute/default/httproute-1/rule/1/match/0/*
    pathMatch:
      distinct: false
      name: ''
      prefix: /mixed-invalid-and-without-endpoints
  - destination:
      metadata:
        kind: HTTPRoute
        name: httproute-1
        namespace: default
      name: httproute/default/httproute-1/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        metadata:
          kind: Service
          name: service-1
          namespace: default
          sectionName: '8080'
        name: httproute/default/httproute-1/rule/0/backend/0
        protocol: HTTP
        weight: 1
    hostname: '*'
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-1
      namespace: default
    name: httproute/default/httproute-1/rule/0/match/0/*
    pathMatch:
      distinct: false
      name: ''
      prefix: /some-without-endpoints
  - directResponse:
      statusCode: 503
    hostname: '*'
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-1
      namespace: default
    name: httproute/default/httproute-1/rule/2/match/0/*
    pathMatch:
      distinct: false
      name: ''
      prefix: /all-without-endpoints
