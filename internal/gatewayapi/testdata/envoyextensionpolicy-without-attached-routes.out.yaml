envoyExtensionPolicies:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyExtensionPolicy
  metadata:
    name: target-listenerset-without-routes
    namespace: envoy-gateway
  spec:
    lua:
    - inline: |
        function envoy_on_request(request_handle)
          request_handle:logInfo("listenerset")
        end
      type: Inline
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: ext-listeners
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: ListenerSet
        name: ext-listeners
        namespace: envoy-gateway
      conditions:
      - lastTransitionTime: null
        message: Policy has been accepted.
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: This policy is not reflected in the generated configuration because
          none of the listeners it targets has a route that this policy can be applied
          to.
        reason: NoAttachedRoutes
        status: "True"
        type: Warning
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyExtensionPolicy
  metadata:
    name: target-gw-section-with-routes
    namespace: envoy-gateway
  spec:
    lua:
    - inline: |
        function envoy_on_request(request_handle)
          request_handle:logInfo("gateway-section")
        end
      type: Inline
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: composite-gateway
      sectionName: http
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: composite-gateway
        namespace: envoy-gateway
        sectionName: http
      conditions:
      - lastTransitionTime: null
        message: Policy has been accepted.
        reason: Accepted
        status: "True"
        type: Accepted
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyExtensionPolicy
  metadata:
    name: target-gw-tcp-section
    namespace: envoy-gateway
  spec:
    lua:
    - inline: |
        function envoy_on_request(request_handle)
          request_handle:logInfo("tcp")
        end
      type: Inline
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: composite-gateway
