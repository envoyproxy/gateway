http:
- address: 0.0.0.0
  hostnames:
  - '*'
  name: default/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - name: httproute/default/httproute-1/rule/0/match/0/www_foo_com
    hostname: www.foo.com
    isHTTP2: false
    pathMatch:
      distinct: false
      name: ""
      prefix: /any
    destination:
      name: httproute/default/httproute-1/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-1/rule/0/backend/0
    security:
      authenticationAny: true
      basicAuth:
        name: securitypolicy/default/policy-for-http-route-1/authentication-any
        allowMissing: true
        emitDynamicMetadata: true
        users: dXNlcjE6e1NIQX10RVNzQm1FL3lOWTNsYjZhMEw2dlZRRVpOcXc9CnVzZXIyOntTSEF9RUo5TFBGRFhzTjl5blNtYnh2anA3NUJtbHg4PQo=
      jwt:
        name: default/policy-for-http-route-1/authentication-any
        allowMissing: true
        providers:
        - name: example
          issuer: https://www.example.com
          audiences:
          - foo.com
          remoteJWKS:
            uri: https://localhost/jwt/public-key/jwks.json
            cacheDuration: 300s
        - name: other
          issuer: https://other.example.com
          audiences:
          - foo.com
          remoteJWKS:
            uri: https://localhost/jwt/other/jwks.json
            cacheDuration: 300s
  - name: httproute/default/httproute-2/rule/0/match/0/www_bar_com
    hostname: www.bar.com
    isHTTP2: false
    pathMatch:
      distinct: false
      name: ""
      prefix: /basic
    destination:
      name: httproute/default/httproute-2/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-2/rule/0/backend/0
    security:
      basicAuth:
        name: securitypolicy/default/policy-for-http-route-1
        users: dXNlcjE6e1NIQX10RVNzQm1FL3lOWTNsYjZhMEw2dlZRRVpOcXc9CnVzZXIyOntTSEF9RUo5TFBGRFhzTjl5blNtYnh2anA3NUJtbHg4PQo=
  - name: httproute/default/httproute-3/rule/0/match/0/www_baz_com
    hostname: www.baz.com
    isHTTP2: false
    pathMatch:
      distinct: false
      name: ""
      prefix: /public
    destination:
      name: httproute/default/httproute-3/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-3/rule/0/backend/0
