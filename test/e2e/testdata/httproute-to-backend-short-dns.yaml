apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-short-dns
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: short-dns
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: short-dns
  namespace: gateway-conformance-infra
spec:
  ipFamily: IPv4
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  dnsConfig:
                    searches:
                      - gateway-conformance-infra.svc.cluster.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-backend-short-dns
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: gateway-short-dns
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /backend-short-dns
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: backend-short-dns
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: backend-short-dns
  namespace: gateway-conformance-infra
spec:
  endpoints:
    - fqdn:
        hostname: infra-backend-v1
        port: 8080
