---
# The dynamic module from the OCI image is added to this EnvoyProxy in the test code
# because we can't get the OCI registry's LB address in advance.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: dynamic-module-oci-proxy
  namespace: gateway-conformance-infra
spec:
  ipFamily: IPv4
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          env:
            # The test module is written in Go.
            - name: GODEBUG
              value: cgocheck=0
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dynamic-module-oci-gateway
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: dynamic-module-oci-proxy
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-with-oci-dynamic-module
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: dynamic-module-oci-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dynamic-module-oci
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: oci-dynamic-module-test
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: http-with-oci-dynamic-module
  dynamicModule:
    - name: header-mutation
      filterName: header_mutation
