# An HTTP/3 capable backend. Caddy enables HTTP/3 by default for TLS-enabled sites,
# so it listens for QUIC on the same port it serves HTTPS on. The site is a catch-all
# rather than a named one because the request still carries the client's Host header,
# not the backend's hostname.
#
# openssl req -x509 -sha256 -nodes -days 36500 -newkey rsa:2048 \
#   -subj '/O=example Inc./CN=h3-backend.gateway-conformance-infra.svc.cluster.local' \
#   -addext "subjectAltName=DNS:h3-backend.gateway-conformance-infra.svc.cluster.local,DNS:h3-backend" \
#   -keyout tls.key -out tls.crt
apiVersion: v1
kind: Secret
metadata:
  name: h3-backend-tls
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
# The certificate is self-signed, so it is its own CA. HTTP/3 needs a verified backend: Envoy's
# QUIC client checks the certificate against the SNI even with insecureSkipVerify, see
# https://github.com/envoyproxy/envoy/issues/48215.
