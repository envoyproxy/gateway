http:
- name: "first-listener"
  address: "::"
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  hostnames:
  - "foo.com"
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
    compliancePolicies:
    - FIPS_202205
    alpnProtocols:
    - h2
    - http/1.1
    certificates:
    - name: secret-1
      # byte slice representation of "cert-data"
      certificate: [99, 101, 114, 116, 45, 100, 97, 116, 97]
      # byte slice representation of "key-data"
      privateKey: [107, 101, 121, 45, 100, 97, 116, 97]
  routes:
  - name: "first-route"
    hostname: "*"
    destination:
      name: "first-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "first-route-dest/backend/0"
        tls:
          insecureSkipVerify: true
          compliancePolicies:
          - CNSA1_202603
