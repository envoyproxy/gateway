# Two IR listeners on one port, so they collapse into a single xDS filter chain and
# share one HCM. The Lua slots belong to that HCM: the listener needs as many slots as
# the deepest route chain across both listeners, and each listener's scripts merge into
# the slots already there rather than adding a bucket of their own.
http:
- address: 0.0.0.0
  hostnames:
  - foo.example.com
  name: envoy-gateway/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - destination:
      name: httproute/default/httproute-1/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-1/rule/0/backend/0
    hostname: foo.example.com
    isHTTP2: false
    name: httproute/default/httproute-1/rule/0/match/0/foo_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /foo
    envoyExtensions:
      luas:
      - code: function envoy_on_request(request_handle)
          request_handle:logInfo('foo')
          end
        name: envoyextensionpolicy/default/policy-for-foo/lua/0
- address: 0.0.0.0
  hostnames:
  - bar.example.com
  name: envoy-gateway/gateway-1/http2
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - destination:
      name: httproute/default/httproute-2/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-2/rule/0/backend/0
    hostname: bar.example.com
    isHTTP2: false
    name: httproute/default/httproute-2/rule/0/match/0/bar_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /bar
    envoyExtensions:
      luas:
      - code: function envoy_on_request(request_handle)
          request_handle:logInfo('bar')
          end
        name: envoyextensionpolicy/default/policy-for-bar/lua/0
      - code: function envoy_on_response(response_handle)
          response_handle:logInfo('bar-2')
          end
        name: envoyextensionpolicy/default/policy-for-bar/lua/1
