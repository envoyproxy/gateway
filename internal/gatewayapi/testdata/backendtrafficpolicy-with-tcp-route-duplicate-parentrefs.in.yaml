# The TCPRoute reaches the bar listener through both parentRefs, so the policy is applied to
# its IR route twice. The route must still carry a single policy metadata entry.
gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: tcp-gateway
      namespace: default
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: bar
          protocol: TCP
          port: 8089
          allowedRoutes:
            kinds:
              - kind: TCPRoute
                group: gateway.networking.k8s.io
tcpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: TCPRoute
    metadata:
      namespace: default
      name: tcp-app-1
    spec:
      parentRefs:
        - name: tcp-gateway
        - name: tcp-gateway
          sectionName: bar
      rules:
        - backendRefs:
            - name: service-1
              port: 8163
              namespace: default
backendTrafficPolicies:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: default
      name: policy-for-route
    spec:
      targetRef:
        group: gateway.networking.k8s.io
        kind: TCPRoute
        name: tcp-app-1
      loadBalancer:
        type: LeastRequest
