- address:
    socketAddress:
      address: 0.0.0.0
      portValue: 10443
  filterChains:
  - filterChainMatch:
      serverNames:
      - foo.com
    filters:
    - name: envoy.filters.network.tcp_proxy
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
        cluster: tls-route-passthrough-dest
        statPrefix: tls-passthrough-10443
    name: tls-route-passthrough
  listenerFilters:
  - name: envoy.filters.listener.set_filter_state
    typedConfig:
      '@type': type.googleapis.com/envoy.extensions.filters.listener.set_filter_state.v3.Config
      onAccept:
      - formatString:
