http:
- name: "first-listener"
  address: "0.0.0.0"
  port: 10080
  hostnames:
  - "*"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  - name: "first-route"
    traffic:
      rateLimit:
        global:
          rules:
          - name: "test-namespace/test-policy-1/rule/0"
            headerMatches:
            - name: "x-user-id"
              distinct: true
            methodMatches:
            - exact: "POST"
            pathMatch:
              prefix: "/admin"
            limit:
              requests: 10
              unit: second
            overrides:
            - value: client-a
              limit:
                requests: 15
                unit: second
            - value: client-b
              limit:
                requests: 20
                unit: second
    pathMatch:
      exact: "foo/bar"
    destination:
      name: "first-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
