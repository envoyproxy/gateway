http:
- address: 0.0.0.0
  hostnames:
  - '*.envoyproxy.io'
  metadata:
    kind: Gateway
    name: gateway-1
    namespace: envoy-gateway
    sectionName: http
  name: envoy-gateway/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - credentialInjection:
      name: httproutefilter/default/credential-injection-1
      oauth2:
        tokenEndpoint: https://oauth.example.com/oauth2/token
        clientID: client-1
        clientSecret: '[redacted]'
        scopes:
        - read
        - write
      overwrite: true
    destination:
      name: httproute/default/httproute-1/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        name: httproute/default/httproute-1/rule/0/backend/0
        protocol: HTTP
        weight: 1
    hostname: gateway.envoyproxy.io
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-1
      namespace: default
    name: httproute/default/httproute-1/rule/0/match/0/gateway_envoyproxy_io
    pathMatch:
      distinct: false
      name: ""
      prefix: /foo
  - credentialInjection:
      name: httproutefilter/default/credential-injection-2
      oauth2:
        tokenEndpoint: https://oauth.example.com/oauth2/token
        clientID: client-2
        clientSecret: '[redacted]'
    destination:
      name: httproute/default/httproute-1/rule/1
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        name: httproute/default/httproute-1/rule/1/backend/0
        protocol: HTTP
        weight: 1
    hostname: gateway.envoyproxy.io
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-1
      namespace: default
    name: httproute/default/httproute-1/rule/1/match/0/gateway_envoyproxy_io
    pathMatch:
      distinct: false
      name: ""
      prefix: /bar
  - credentialInjection:
      name: httproutefilter/default/credential-injection-3
      credential: '[redacted]'
    destination:
      name: httproute/default/httproute-1/rule/2
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        name: httproute/default/httproute-1/rule/2/backend/0
        protocol: HTTP
        weight: 1
    hostname: gateway.envoyproxy.io
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: httproute-1
      namespace: default
    name: httproute/default/httproute-1/rule/2/match/0/gateway_envoyproxy_io
    pathMatch:
      distinct: false
      name: ""
      prefix: /baz
