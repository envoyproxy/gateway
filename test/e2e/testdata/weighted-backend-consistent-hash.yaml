apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: weighted-consistent-hash-policy
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: weighted-consistent-hash-route
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Header
      header:
        name: "Lb-Test-Header"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weighted-consistent-hash-route
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /weighted-consistent-hash
      # No per-backendRef filters: the split collapses into a single cluster
      # expressed as weighted localities, which is what silently dropped the
      # configured weights before this fix.
      backendRefs:
        - name: infra-backend-v1
          port: 8080
          weight: 5
        - name: infra-backend-v2
          port: 8080
          weight: 95
