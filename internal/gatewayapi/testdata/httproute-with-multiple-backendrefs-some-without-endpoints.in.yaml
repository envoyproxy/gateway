gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: gateway-1
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
httpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: httproute-1
  spec:
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
    rules:
    # the backendRef without endpoints is dropped, service-1 receives all the traffic
    - matches:
      - path:
          type: PathPrefix
          value: "/some-without-endpoints"
      backendRefs:
      - name: service-1
        port: 8080
      - name: service-with-no-endpoints
        port: 8080
    # the backendRef without endpoints is kept to preserve the invalid fraction, the invalid and no endpoints share returns 503
    - matches:
      - path:
          type: PathPrefix
          value: "/mixed-invalid-and-without-endpoints"
      backendRefs:
      - name: service-1
        port: 8080
      - name: service-with-no-endpoints
        port: 8080
      - name: service-not-exist
        port: 8080
    # all backendRefs have no endpoints, 503 direct response is returned
    - matches:
      - path:
          type: PathPrefix
          value: "/all-without-endpoints"
      backendRefs:
      - name: service-with-no-endpoints
        port: 8080
      - name: service-with-no-endpoints
        port: 8080
grpcRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: GRPCRoute
  metadata:
    namespace: default
    name: grpcroute-1
  spec:
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
    rules:
    # the backendRef without endpoints is dropped, service-1 receives all the traffic
    - matches:
      - method:
          service: com.example
          method: Example
      backendRefs:
      - name: service-1
        port: 8080
      - name: service-with-no-endpoints
        port: 8080
services:
- apiVersion: v1
  kind: Service
  metadata:
    namespace: default
    name: service-with-no-endpoints
  spec:
    clusterIP: 1.1.1.1
    ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
endpointSlices:
- apiVersion: discovery.k8s.io/v1
  kind: EndpointSlice
  metadata:
    namespace: default
    name: endpointslice-service-with-no-endpoints
    labels:
      kubernetes.io/service-name: service-with-no-endpoints
  addressType: IPv4
  ports:
  - name: http
    port: 8080
    protocol: TCP
