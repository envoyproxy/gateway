- address:
    socketAddress:
      address: '::'
      portValue: 10080
      protocol: UDP
  listenerFilters:
  - name: envoy.filters.udp_listener.udp_proxy
    typedConfig:
      '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.UdpProxyConfig
      matcher:
        matcherList:
          matchers:
          - onMatch:
              action:
                name: route
                typedConfig:
                  '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.Route
                  cluster: udp-route-allowlist-dest
            predicate:
              singlePredicate:
                customMatch:
                  name: ip_matcher
                  typedConfig:
                    '@type': type.googleapis.com/envoy.extensions.matching.input_matchers.ip.v3.Ip
                    cidrRanges:
                    - addressPrefix: 192.168.100.0
                      prefixLen: 24
                    statPrefix: client_ip
                input:
                  name: client_ip
                  typedConfig:
                    '@type': type.googleapis.com/envoy.extensions.matching.common_inputs.network.v3.SourceIPInput
          - onMatch:
              action:
                name: route
                typedConfig:
                  '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.Route
                  cluster: udp-route-allowlist-dest
            predicate:
              singlePredicate:
                customMatch:
                  name: ip_matcher
                  typedConfig:
                    '@type': type.googleapis.com/envoy.extensions.matching.input_matchers.ip.v3.Ip
                    cidrRanges:
                    - addressPrefix: 10.1.0.0
                      prefixLen: 16
                    - addressPrefix: '2001:db8::'
                      prefixLen: 64
                    statPrefix: client_ip
                input:
                  name: client_ip
                  typedConfig:
                    '@type': type.googleapis.com/envoy.extensions.matching.common_inputs.network.v3.SourceIPInput
      statPrefix: service
  name: udp-listener-allowlist
