globalResources:
  envoyClientCertificate:
    name: envoy-gateway-system/envoy
    privateKey: [107, 101, 121, 45, 100, 97, 116, 97]
    certificate: [99, 101, 114, 116, 45, 100, 97, 116, 97]
http:
- address: 0.0.0.0
  hostnames:
  - '*'
  name: envoy-gateway/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  # The two routes below are configured by two different EnvoyExtensionPolicies
  # that reference the same Wasm module and set the same vmID, so both generated
  # filters must report the same vm_id and share a single Envoy Wasm VM.
  - destination:
      name: httproute/default/httproute-1/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-1/rule/0/backend/0
    hostname: www.example.com
    isHTTP2: false
    name: httproute/default/httproute-1/rule/0/match/0/www_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /foo
    envoyExtensions:
      wasms:
      - config: null
        failOpen: false
        httpWasmCode:
          servingURL: https://envoy-gateway.envoy-gateway-system.svc.cluster.local:18002/3af467e0c5215bb84dc7f85e0a1b5f9d9b8340f610d760f17e024f447c2da9bf.wasm
          originalDownloadingURL: https://www.example.com/auth-filter.wasm
          sha256: f5173e637a258751276b55f1f9ca6ec3b2f21ea8e6cc34216bba899cac96e9da
        name: envoyextensionpolicy/default/policy-for-http-route-1/wasm/0
        vmID: shared-auth-filter
        wasmName: auth-filter
  - destination:
      name: httproute/default/httproute-2/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-2/rule/0/backend/0
    hostname: www.example.com
    isHTTP2: false
    name: httproute/default/httproute-2/rule/0/match/0/www_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /bar
    envoyExtensions:
      wasms:
      - config: null
        failOpen: false
        httpWasmCode:
          servingURL: https://envoy-gateway.envoy-gateway-system.svc.cluster.local:18002/3af467e0c5215bb84dc7f85e0a1b5f9d9b8340f610d760f17e024f447c2da9bf.wasm
          originalDownloadingURL: https://www.example.com/auth-filter.wasm
          sha256: f5173e637a258751276b55f1f9ca6ec3b2f21ea8e6cc34216bba899cac96e9da
        name: envoyextensionpolicy/default/policy-for-http-route-2/wasm/0
        vmID: shared-auth-filter
        wasmName: auth-filter
  # This route uses the same Wasm module but does not set a vmID, so it must keep
  # the default per-extension VM ID and stay isolated from the shared VM above.
  - destination:
      name: httproute/default/httproute-3/rule/0
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        protocol: HTTP
        weight: 1
        name: httproute/default/httproute-3/rule/0/backend/0
    hostname: www.example.com
    isHTTP2: false
    name: httproute/default/httproute-3/rule/0/match/0/www_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /baz
    envoyExtensions:
      wasms:
      - config: null
        failOpen: false
        httpWasmCode:
          servingURL: https://envoy-gateway.envoy-gateway-system.svc.cluster.local:18002/3af467e0c5215bb84dc7f85e0a1b5f9d9b8340f610d760f17e024f447c2da9bf.wasm
          originalDownloadingURL: https://www.example.com/auth-filter.wasm
          sha256: f5173e637a258751276b55f1f9ca6ec3b2f21ea8e6cc34216bba899cac96e9da
        name: envoyextensionpolicy/default/policy-for-http-route-3/wasm/0
        wasmName: auth-filter
