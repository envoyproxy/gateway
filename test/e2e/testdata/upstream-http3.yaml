apiVersion: v1
kind: ConfigMap
metadata:
  name: h3-backend-envoy
  namespace: gateway-conformance-infra
# Both listeners bind "::" with ipv4_compat, so the backend answers on IPv4 and IPv6 pods.
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: https
          address:
            socket_address:
              address: "::"
              ipv4_compat: true
              port_value: 8443
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    alpn_protocols: [h2, http/1.1]
                    tls_certificates:
                      - certificate_chain:
                          filename: /etc/tls/tls.crt
                        private_key:
                          filename: /etc/tls/tls.key
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: https
                    codec_type: AUTO
                    route_config:
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          response_headers_to_add:
                            - header:
                                key: alt-svc
                                value: h3=":8443"; ma=86400
                            - header:
                                key: x-protocol
                                value: "%PROTOCOL%"
                          routes:
                            - match:
                                prefix: /
                              direct_response:
                                status: 200
                                body:
                                  inline_string: ok
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: quic
          address:
            socket_address:
              protocol: UDP
              address: "::"
              ipv4_compat: true
              port_value: 8443
          udp_listener_config:
            quic_options: {}
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.quic
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.quic.v3.QuicDownstreamTransport
                  downstream_tls_context:
                    common_tls_context:
                      tls_certificates:
                        - certificate_chain:
                            filename: /etc/tls/tls.crt
                          private_key:
                            filename: /etc/tls/tls.key
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: quic
                    codec_type: HTTP3
                    http3_protocol_options: {}
                    route_config:
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          response_headers_to_add:
                            - header:
                                key: alt-svc
                                value: h3=":8443"; ma=86400
                            - header:
                                key: x-protocol
                                value: "%PROTOCOL%"
                          routes:
                            - match:
                                prefix: /
                              direct_response:
                                status: 200
                                body:
                                  inline_string: ok
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: h3-backend
  namespace: gateway-conformance-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: h3-backend
      version: v1
  template:
    metadata:
      labels:
        app: h3-backend
        version: v1
    spec:
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:distroless-v1.40.0
          imagePullPolicy: IfNotPresent
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
            - --log-level
            - warn
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: quic
              containerPort: 8443
              protocol: UDP
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            tcpSocket:
              port: 8443
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: tls
              mountPath: /etc/tls
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: h3-backend-envoy
        - name: tls
          secret:
            secretName: h3-backend-tls
---
apiVersion: v1
kind: Service
metadata:
  name: h3-backend
  namespace: gateway-conformance-infra
spec:
  selector:
    app: h3-backend
    version: v1
  ports:
    # QUIC is UDP, so the Service has to expose the port for both protocols:
    # the TCP one carries the HTTP/1.1 and HTTP/2 fallback in Auto mode.
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: quic
      port: 8443
      targetPort: 8443
      protocol: UDP
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: h3-backend
  namespace: gateway-conformance-infra
spec:
  endpoints:
    - fqdn:
        hostname: h3-backend.gateway-conformance-infra.svc.cluster.local
        port: 8443
  tls:
    autoSNIFromEndpointHostname: true
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: h3-backend-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: upstream-http3
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /upstream-http3
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: h3-backend
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: upstream-http3
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: upstream-http3
  # Always, so the test does not depend on the backend advertising alt-svc first:
  # Envoy goes straight to QUIC and there is no TCP fallback to mask a failure.
  http3:
    mode: Always
---
# Same Backend, a second BackendTrafficPolicy: only the mode differs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: upstream-http3-auto
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /upstream-http3-auto
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: h3-backend
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: upstream-http3-auto
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: upstream-http3-auto
  # Auto reaches HTTP/3 the long way round: the first request goes over TCP, the backend's
  # response advertises h3 through alt-svc, and only then does Envoy race QUIC. Early
  # requests are therefore expected to be HTTP/1.1 or HTTP/2.
  http3:
    mode: Auto
