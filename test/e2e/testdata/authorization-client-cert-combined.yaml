# Server and client certs for combined Subject+URI SAN test
# CA and server cert
# Cert generation commands (for reference):
#   See STEP 1 shell script above

---
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-combined-server-cert
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-combined-allowed
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-combined-wrong-uri
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-combined-wrong-subject
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: authz-client-cert-combined-gateway
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: mtls
      port: 443
      protocol: HTTPS
      hostname: authz-client-cert-combined.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: authz-client-cert-combined-server-cert
---
# ClientTrafficPolicy: require mTLS, validate client cert against the CA
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: authz-client-cert-combined-ctp
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: authz-client-cert-combined-gateway
      sectionName: mtls
  tls:
    clientValidation:
      caCertificateRefs:
        - kind: Secret
          group: ""
          name: authz-client-cert-combined-server-cert
---
# HTTPRoute for combined test
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authz-client-cert-combined-route
  namespace: gateway-conformance-infra
spec:
  hostnames:
    - authz-client-cert-combined.example.com
  parentRefs:
    - name: authz-client-cert-combined-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
# SecurityPolicy: permit only certs with BOTH matching subject AND matching URI SAN
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authz-client-cert-combined-policy
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: authz-client-cert-combined-route
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-combined-subject-and-uri
        action: Allow
        principal:
          clientCert:
            subject:
              type: RegularExpression
              value: ".*CN=combined-client.*"
            subjectAltNames:
              uris:
                - type: Exact
                  value: "spiffe://envoy-gateway/tests/combined/client"

