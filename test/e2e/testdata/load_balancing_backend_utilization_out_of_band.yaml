apiVersion: v1
kind: Service
metadata:
  name: lb-backend-utilization-oob
  namespace: gateway-conformance-infra
spec:
  selector:
    app: lb-backend-utilization-oob
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lb-backend-oob-low-util
  namespace: gateway-conformance-infra
  labels:
    app: lb-backend-utilization-oob
    util: low
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lb-backend-utilization-oob
      util: low
  template:
    metadata:
      labels:
        app: lb-backend-utilization-oob
        util: low
    spec:
      containers:
      - name: backend
        image: envoyproxy/gateway-backend-utilization:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        - name: orca-grpc
          containerPort: 3001
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SERVICE_NAME
          value: lb-backend-utilization-oob
        - name: ORCA_CPU_UTILIZATION
          value: "0.1"
        # Report only out-of-band, so the weighting below can only come from the
        # OpenRcaService stream.
        - name: ORCA_INBAND
          value: "false"
        resources:
          requests:
            cpu: 10m
        readinessProbe:
          httpGet:
            path: /
            port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lb-backend-oob-high-util
  namespace: gateway-conformance-infra
  labels:
    app: lb-backend-utilization-oob
    util: high
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lb-backend-utilization-oob
      util: high
  template:
    metadata:
      labels:
        app: lb-backend-utilization-oob
        util: high
    spec:
      containers:
      - name: backend
        image: envoyproxy/gateway-backend-utilization:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        - name: orca-grpc
          containerPort: 3001
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SERVICE_NAME
          value: lb-backend-utilization-oob
        - name: ORCA_CPU_UTILIZATION
          value: "0.9"
        - name: ORCA_INBAND
          value: "false"
        resources:
          requests:
            cpu: 10m
        readinessProbe:
          httpGet:
            path: /
            port: http
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: backend-utilization-oob-policy
  namespace: gateway-conformance-infra
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: backend-utilization-oob-route
  loadBalancer:
    type: BackendUtilization
    backendUtilization:
      blackoutPeriod: 1ms
      weightUpdatePeriod: 100ms
      outOfBand:
        reportingPeriod: 1s
        # The example backend serves OpenRcaService on its own port.
        port: 3001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-utilization-oob-route
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /backend-utilization-oob
    backendRefs:
    - name: lb-backend-utilization-oob
      port: 8080
