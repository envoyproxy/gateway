    - match:
        pathSeparatedPrefix: /same-name
      name: httproute/default/httproute-6/rule/0/match/0/listener_scope_envoyproxy_io
      route:
        cluster: httproute/default/httproute-6/rule/0
        upgradeConfigs:
        - upgradeType: websocket
      typedPerFilterConfig:
        envoy.filters.http.filter_chain.eep.listener:
          '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
          disabled: true
        envoy.filters.http.filter_chain.eep.route:
          '@type': type.googleapis.com/envoy.extensions.filters.http.filter_chain.v3.FilterChainConfigPerRoute
          filterChain:
            filters:
            - name: envoy.filters.http.ext_proc/0
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                grpcService:
                  envoyGrpc:
                    authority: grpc-backend-listener.envoy-gateway:9000
                    clusterName: envoyextensionpolicy/envoy-gateway/policy-for-gateway-listener/0/grpc-backend-listener
                  timeout: 10s
                processingMode:
                  requestHeaderMode: SKIP
                  requestTrailerMode: SKIP
                  responseHeaderMode: SKIP
                  responseTrailerMode: SKIP
    typedPerFilterConfig:
      envoy.filters.http.filter_chain.eep.listener:
        '@type': type.googleapis.com/envoy.extensions.filters.http.filter_chain.v3.FilterChainConfigPerRoute
        filterChain:
          filters:
          - name: envoy.filters.http.ext_proc/listener/0
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpcService:
                envoyGrpc:
                  authority: grpc-backend-listener.envoy-gateway:9000
                  clusterName: envoyextensionpolicy/envoy-gateway/policy-for-gateway-listener/0/grpc-backend-listener
                timeout: 10s
              processingMode:
                requestHeaderMode: SKIP
                requestTrailerMode: SKIP
                responseHeaderMode: SKIP
                responseTrailerMode: SKIP
