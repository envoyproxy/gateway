envoyProxyForGatewayClass:
  apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    namespace: envoy-gateway-system
    name: test
  spec:
    mergeBackends: {}
gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-1
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
backendTrafficPolicies:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: default
      name: btp-backend-target
    spec:
      targetRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: be-fallback
      mergeType: StrategicMerge
      circuitBreaker:
        maxConnections: 100
grpcRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: GRPCRoute
    metadata:
      namespace: default
      name: grpc-route-1
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
      rules:
        - matches:
            - method:
                service: com.example.Service
                type: Exact
          backendRefs:
            - name: service-1
              port: 8080
            - group: gateway.envoyproxy.io
              kind: Backend
              name: be-fallback
backends:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      namespace: default
      name: be-fallback
    spec:
      fallback: true
      endpoints:
        - ip:
            address: 2.2.2.2
            port: 3001
