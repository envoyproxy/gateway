apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: grpc-json-transcoder-vendored-any
  namespace: gateway-conformance-infra
spec:
  grpcJSONTranscoder:
    services:
    - transcoder.status.v1.VendoredAny
    convertGRPCStatus: true
    protoDescriptor:
      valueRef:
        group: ""
        kind: ConfigMap
        name: grpc-json-transcoder-vendored-any
---
# google/protobuf/any.proto is vendored under third_party/. With convertGRPCStatus, Envoy adds
# its own google/rpc/status.proto, which imports google/protobuf/any.proto:
#
#   // third_party/google/protobuf/any.proto
#   syntax = "proto3";
#   package google.protobuf;
#   message Any { string type_url = 1; bytes value = 2; }
#
#   // svc.proto
#   syntax = "proto3";
#   package transcoder.status.v1;
#   import "third_party/google/protobuf/any.proto";
#   message PingRequest { google.protobuf.Any detail = 1; }
#   message PingResponse {}
#   service VendoredAny { rpc Ping(PingRequest) returns (PingResponse); }
