- address:
    socketAddress:
      address: 0.0.0.0
      portValue: 10443
      protocol: UDP
  drainType: MODIFY_ONLY
  filterChains:
  - filterChainMatch:
      serverNames:
      - '*.example.com'
    filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        codecType: HTTP3
        commonHttpProtocolOptions:
          headersWithUnderscoresAction: REJECT_REQUEST
        http2ProtocolOptions:
          initialConnectionWindowSize: 1048576
          initialStreamWindowSize: 65536
          maxConcurrentStreams: 100
        http3ProtocolOptions: {}
        httpFilters:
        - name: envoy.filters.http.rbac.quic_client_validation
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
            rules:
              action: DENY
              policies:
                client-validation-required:
                  permissions:
                  - requestedServerName:
                      safeRegex:
                        googleRe2:
                          maxProgramSize: 2048
                        regex: (?i)^[^:]+\.secure\.example\.com\.?$
                  - orRules:
                      rules:
                      - header:
                          name: :authority
                          safeRegexMatch:
                            googleRe2:
                              maxProgramSize: 2048
                            regex: (?i)^(?:[^:]+|.*:[^:]*\][^:]*)\.secure\.example\.com\.?$
                      - header:
                          name: :authority
                          safeRegexMatch:
                            googleRe2:
                              maxProgramSize: 2048
                            regex: (?i)^.+\.secure\.example\.com\.?:[^:\]]*$
                  - requestedServerName:
                      safeRegex:
                        googleRe2:
                          maxProgramSize: 2048
                        regex: (?i)^foo\.example\.com\.?$
                  - header:
                      name: :authority
                      safeRegexMatch:
                        googleRe2:
                          maxProgramSize: 2048
                        regex: (?i)^foo\.example\.com\.?(?::[^:\]]*)?$
                  principals:
                  - any: true
        - name: envoy.filters.http.rbac.quic_client_validation_before_router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
            rules:
