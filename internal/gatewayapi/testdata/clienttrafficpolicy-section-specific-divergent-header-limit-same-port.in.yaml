clientTrafficPolicies:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: ClientTrafficPolicy
  metadata:
    namespace: envoy-gateway
    name: ctp-section-a-header-limit
  spec:
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: same-port-gateway
      sectionName: http-a
    headers:
      maxRequestHeaderLimit: 64Ki
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: ClientTrafficPolicy
  metadata:
    namespace: envoy-gateway
    name: ctp-section-b-header-limit
  spec:
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: same-port-gateway
      sectionName: http-b
    headers:
      maxRequestHeaderLimit: 256Ki
gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: same-port-gateway
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: http-a
      hostname: a.example.com
      protocol: HTTP
      port: 8081
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-b
      hostname: b.example.com
      protocol: HTTP
      port: 8081
      allowedRoutes:
        namespaces:
          from: Same
