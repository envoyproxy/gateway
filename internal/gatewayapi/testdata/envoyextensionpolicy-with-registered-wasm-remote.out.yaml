envoyExtensionPolicies:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyExtensionPolicy
  metadata:
    name: policy-for-http-route-1
    namespace: default
  spec:
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: httproute-1
    wasm:
    - name: http-filter-with-ca
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway-1
        namespace: envoy-gateway
        sectionName: http
      conditions:
      - lastTransitionTime: null
        message: Policy has been accepted.
        reason: Accepted
        status: "True"
        type: Accepted
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyExtensionPolicy
  metadata:
    name: policy-for-http-route-2
    namespace: default
  spec:
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: httproute-2
    wasm:
    - name: image-filter-cross-namespace-secret
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway-1
        namespace: envoy-gateway
        sectionName: http
      conditions:
      - lastTransitionTime: null
        message: 'Wasm: wasm module "image-filter-cross-namespace-secret": secret
          ref namespace must be unspecified/empty or envoy-gateway.'
        reason: Invalid
        status: "False"
        type: Accepted
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyExtensionPolicy
  metadata:
    name: policy-for-gateway
    namespace: envoy-gateway
  spec:
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-1
    wasm:
    - name: http-filter
    - name: image-filter
      rootID: my-root-id
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway-1
        namespace: envoy-gateway
      conditions:
      - lastTransitionTime: null
        message: Policy has been accepted.
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: 'This policy is being overridden by other envoyExtensionPolicies
          for these routes: [default/httproute-1 default/httproute-2]'
        reason: Overridden
        status: "True"
        type: Overridden
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
envoyProxiesForGateways:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    name: proxy-config
    namespace: envoy-gateway
    resourceVersion: "42"
  spec:
    logging: {}
    wasmModules:
    - name: http-filter
      source:
        http:
          sha256: null
          url: https://www.example.com/wasm-filter-1.wasm
        type: HTTP
    - name: http-filter-with-ca
      source:
        http:
          sha256: null
          tls:
            caCertificateRef:
              kind: ConfigMap
              name: wasm-ca
          url: https://www.example.com/wasm-filter-2.wasm
        type: HTTP
    - name: image-filter
      source:
        image:
          pullSecretRef:
            name: registry-pull-secret
          sha256: null
          url: www.example.com/wasm-filter-3:v1.0.0
        pullPolicy: Always
        type: Image
    - name: image-filter-cross-namespace-secret
      source:
        image:
          pullSecretRef:
            name: other-pull-secret
            namespace: default
          sha256: null
          url: www.example.com/wasm-filter-4:v1.0.0
        type: Image
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway-1
        namespace: envoy-gateway
      conditions:
      - lastTransitionTime: null
        message: EnvoyProxy has been accepted.
        reason: Accepted
        status: "True"
        type: Accepted
gateways:
- apiVersion: gateway.networking.k8s.io/v1
