# Nothing to migrate: the output is the input, byte for byte.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: modern
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io # the route below
    kind: HTTPRoute
    name: backend
  compressor:
  - type: Gzip
    gzip: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  ports:
  - port: 3000
