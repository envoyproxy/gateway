- ignorePortInHostMatching: true
  name: custom-backends-mixed-no-merge-backends-listener
  virtualHosts:
  - domains:
    - '*'
    name: custom-backends-mixed-no-merge-backends-listener/*
    routes:
    - match:
        pathSeparatedPrefix: /mixed
      name: mixed-route
      route:
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        upgradeConfigs:
        - upgradeType: websocket
        weightedClusters:
          clusters:
          - name: mixed-route-dest/backend/0
            weight: 1
          - name: mixed-route-dest/backend/1
            weight: 1
