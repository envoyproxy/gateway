---
gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-1
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: http-1
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: Same
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-2
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: http-2
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: Same
clientTrafficPolicies:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: ClientTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: target-gateway-1
    spec:
      headers:
        serverHeaderTransformation: Overwrite
        serverName: envoy-gateway
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-1
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: ClientTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: target-gateway-2
    spec:
      headers:
        serverHeaderTransformation: PassThrough
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-2
