    hostname: listener-scope.example.com
    isHTTP2: false
    name: httproute/default/httproute-4/rule/0/match/0/listener_scope_example_com
    pathMatch:
      distinct: false
      name: ""
      prefix: /override
  - destination:
      name: httproute/default/httproute-5/rule/0
      settings:
      - addressType: IP
