extensionServerPolicies:
- apiVersion: foo.example.io/v1alpha1
  kind: Bar
  metadata:
    name: test2
    namespace: envoy-gateway
  spec:
    data: listener-scoped Gateway targets are rejected too while mergeGateways is
      enabled
    targetRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-2
      sectionName: http3
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway-2
        namespace: envoy-gateway
        sectionName: http3
