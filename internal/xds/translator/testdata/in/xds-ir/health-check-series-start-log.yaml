http:
- name: "first-listener"
  address: "::"
  port: 10080
  hostnames:
  - "*"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  - name: "first-route"
    hostname: "*"
    traffic:
      healthCheck:
        active:
          timeout: "500ms"
          interval: "3s"
          unhealthyThreshold: 3
          healthyThreshold: 1
          http:
            host: "*"
            path: "/healthz"
            expectedStatuses:
            - 200
          backendHealthCheckLog:
            fileSinks:
            - path: "/dev/stdout"
            alwaysLogHealthCheckFailures: false
            alwaysLogHealthCheckSuccess: false
    destination:
      name: "first-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "first-route-dest/backend/0"
