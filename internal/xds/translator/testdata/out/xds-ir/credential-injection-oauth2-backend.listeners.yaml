- address:
    socketAddress:
      address: 0.0.0.0
      portValue: 10080
  defaultFilterChain:
    filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        commonHttpProtocolOptions:
          headersWithUnderscoresAction: REJECT_REQUEST
        http2ProtocolOptions:
          initialConnectionWindowSize: 1048576
          initialStreamWindowSize: 65536
          maxConcurrentStreams: 100
        httpFilters:
        - disabled: true
          name: envoy.filters.http.credential_injector/httproutefilter/default/oauth2-backend-refs
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
            credential:
              name: envoy.http.injected_credentials.oauth2
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.http.injected_credentials.oauth2.v3.OAuth2
                clientCredentials:
                  clientId: client-2
                  clientSecret:
                    name: credential_injector/oauth2_client_secret/httproutefilter/default/oauth2-backend-refs
                    sdsConfig:
                      ads: {}
                      resourceApiVersion: V3
                tokenEndpoint:
                  cluster: httproutefilter/default/oauth2-backend-refs/credentialinjection/0
                  timeout: 5s
                  uri: http://idp.internal/oauth2/token
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            suppressEnvoyHeaders: true
        mergeSlashes: true
        normalizePath: true
        pathWithEscapedSlashesAction: UNESCAPE_AND_REDIRECT
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: envoy-gateway/gateway-1/http
        serverHeaderTransformation: PASS_THROUGH
        statPrefix: http-10080
        useRemoteAddress: true
    name: envoy-gateway/gateway-1/http
  maxConnectionsToAcceptPerSocketEvent: 1
  name: envoy-gateway/gateway-1/http
  perConnectionBufferLimitBytes: 32768
