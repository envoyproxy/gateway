---
# Fronts the gRPC server. appProtocol is what makes Envoy speak HTTP/2 upstream; an
# `gateway.envoyproxy.io/h2c` entry on a Backend's appProtocols does the same job.
apiVersion: v1
kind: Service
metadata:
  name: grpc-service
  namespace: default
spec:
  selector:
    app: grpc-service
  ports:
  - name: grpc
    protocol: TCP
    port: 9000
    targetPort: 9000
    appProtocol: kubernetes.io/h2c
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-route
  namespace: default
spec:
  parentRefs:
  - name: eg
  hostnames:
  - "grpc.example.com"
  rules:
  # The JSON path clients call, taken from the google.api.http option on SayHello.
  # One rule is enough because matchIncomingRequestRoute keeps the request here after
  # the transcoder rewrites :path.
  - matches:
    - path:
        type: PathPrefix
        value: /v1/hello
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: grpc-transcoder
    backendRefs:
    - name: grpc-service
      port: 9000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: grpc-transcoder
  namespace: default
spec:
  grpcJSONTranscoder:
    protoDescriptor:
      valueRef:
        group: ""
        kind: ConfigMap
        name: greeter-proto-descriptor
    services:
    - example.Greeter
    # Without this the rewritten :path is matched against the route table again, and
    # /example.Greeter/SayHello needs a route of its own.
    matchIncomingRequestRoute: true
    printOptions:
      addWhitespace: true
      preserveProtoFieldNames: true
    autoMapping: true
    ignoreUnknownQueryParameters: true
    convertGRPCStatus: true
