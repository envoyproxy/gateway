envoyProxyForGatewayClass:
  apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    namespace: envoy-gateway-system
    name: grpc-buffer
  spec:
    telemetry:
      accessLog:
        settings:
          - sinks:
              - type: ALS
                als:
                  logName: accesslog
                  backendRefs:
                    - Name: backend-als
                      Namespace: envoy-gateway
                      Kind: Backend
                      Group: gateway.envoyproxy.io
                      port: 9000
                  type: HTTP
                  buffer:
                    flushInterval: 5s
                    sizeBytes: 4Mi
          - sinks:
              - type: OpenTelemetry
                openTelemetry:
                  backendRefs:
                    - Name: backend-otel
                      Namespace: envoy-gateway
                      Kind: Backend
                      Group: gateway.envoyproxy.io
                      port: 4317
                  buffer:
                    sizeBytes: 1Mi
gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-1
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: Same
backends:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-als
      namespace: envoy-gateway
    spec:
      endpoints:
        - ip:
            address: 1.1.1.1
            port: 9000
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: Backend
    metadata:
      name: backend-otel
      namespace: envoy-gateway
    spec:
      endpoints:
        - ip:
            address: 2.2.2.2
            port: 4317
