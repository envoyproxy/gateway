# The Selector-matched backend (service-selected) gets an identity-scoped merged Cluster, while
# the Selector-excluded backend (service-not-selected) keeps its own route-scoped Cluster. The two
# backends must render as two distinct Envoy Clusters, not collapse into one.
backends:
- merged: true
  metadata:
    kind: Service
    name: service-selected
    namespace: default
    sectionName: "8080"
  name: backend/service/default/service-selected/8080/http
  settings:
  - addressType: IP
    endpoints:
    - host: 7.7.7.10
      port: 8080
    metadata:
      kind: Service
      name: service-selected
      namespace: default
      sectionName: "8080"
    name: backend/service/default/service-selected/8080/http
    protocol: HTTP
- metadata:
    kind: HTTPRoute
    name: http-route-1
    namespace: default
  name: httproute/default/http-route-1/rule/1
  settings:
  - addressType: IP
    endpoints:
    - host: 7.7.7.11
      port: 8080
    metadata:
      kind: Service
      name: service-not-selected
      namespace: default
      sectionName: "8080"
    name: httproute/default/http-route-1/rule/1/backend/0
    protocol: HTTP
    weight: 1
http:
- address: 0.0.0.0
  externalPort: 80
  hostnames:
  - '*'
  metadata:
    kind: Gateway
    name: gateway-1
    namespace: envoy-gateway
    sectionName: http
  name: envoy-gateway/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - destination:
      backendClusterRefs:
      - name: httproute/default/http-route-1/rule/1
        weight: 1
      metadata:
        kind: HTTPRoute
        name: http-route-1
        namespace: default
      name: httproute/default/http-route-1/rule/1
    hostname: '*'
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: http-route-1
      namespace: default
    name: httproute/default/http-route-1/rule/1/match/0/*
    pathMatch:
      distinct: false
      name: ""
      prefix: /not-selected
  - destination:
      backendClusterRefs:
      - name: backend/service/default/service-selected/8080/http
        weight: 1
      metadata:
        kind: HTTPRoute
        name: http-route-1
        namespace: default
      name: httproute/default/http-route-1/rule/0
    hostname: '*'
    isHTTP2: false
    metadata:
      kind: HTTPRoute
      name: http-route-1
      namespace: default
    name: httproute/default/http-route-1/rule/0/match/0/*
    pathMatch:
      distinct: false
      name: ""
      prefix: /selected
