gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: gateway-1
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.envoyproxy.io"
      allowedRoutes:
        namespaces:
          from: All
httpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: httproute-1
  spec:
    hostnames:
    - gateway.envoyproxy.io
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
      sectionName: http
    rules:
    - matches:
      - path:
          value: "/foo"
      backendRefs:
      - name: service-1
        port: 8080
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: credential-injection-1
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: httproute-2
  spec:
    hostnames:
    - gateway.envoyproxy.io
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
      sectionName: http
    rules:
    - matches:
      - path:
          value: "/bar"
      backendRefs:
      - name: service-1
        port: 8080
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: credential-injection-2
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: httproute-3
  spec:
    hostnames:
    - gateway.envoyproxy.io
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
      sectionName: http
    rules:
    - matches:
      - path:
          value: "/baz"
      backendRefs:
      - name: service-1
        port: 8080
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: credential-injection-3
httpFilters:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: HTTPRouteFilter
  metadata:
    name: credential-injection-1
    namespace: default
  spec:
    credentialInjection:
      credential:
        valueRef:
          name: credential-1
          namespace: secrets-granted
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: HTTPRouteFilter
  metadata:
    name: credential-injection-2
    namespace: default
  spec:
    credentialInjection:
      credential:
        valueRef:
          name: credential-2
          namespace: secrets-not-granted
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: HTTPRouteFilter
  metadata:
    name: credential-injection-3
    namespace: default
  spec:
    credentialInjection:
      credential:
        valueRef:
          name: credential-3
          namespace: secrets-wrong-group
secrets:
- apiVersion: v1
  kind: Secret
  metadata:
    name: credential-1
    namespace: secrets-granted
  data:
    credential: c2VjcmV0
- apiVersion: v1
  kind: Secret
  metadata:
    name: credential-2
    namespace: secrets-not-granted
  data:
    credential: c2VjcmV0Mg==
- apiVersion: v1
  kind: Secret
  metadata:
    name: credential-3
    namespace: secrets-wrong-group
  data:
    credential: c2VjcmV0Mw==
referenceGrants:
- apiVersion: gateway.networking.k8s.io/v1beta1
  kind: ReferenceGrant
  metadata:
    name: allow-credential-injection
    namespace: secrets-granted
  spec:
    from:
    - group: gateway.envoyproxy.io
      kind: HTTPRouteFilter
      namespace: default
    to:
    - group: ""
      kind: Secret
- apiVersion: gateway.networking.k8s.io/v1beta1
  kind: ReferenceGrant
  metadata:
    name: allow-other-group
    namespace: secrets-wrong-group
  spec:
    from:
    - group: gateway.networking.k8s.io
      kind: HTTPRouteFilter
      namespace: default
    to:
    - group: ""
      kind: Secret
