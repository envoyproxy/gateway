name: setup-deps
description: Install host system dependencies

runs:
  using: composite
  steps:
    - shell: bash
      run: sudo apt-get install libbtrfs-dev -y
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v6.0.2
      with:
        go-version-file: go.mod
        cache: true
