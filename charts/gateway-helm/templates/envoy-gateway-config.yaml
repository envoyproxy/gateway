apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-config
  namespace: {{ include "eg.namespace" . }}
  labels:
  {{- include "eg.labels" . | nindent 4 }}
data:
  envoy-gateway.yaml: |
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: EnvoyGateway
    {{- $baseEnvoyGatewayConfig := include "eg.default-envoy-gateway-config" . | fromYaml }}
    {{- $userEnvoyGatewayConfig := .Values.config.envoyGateway }}
    {{- $mergedEnvoyGatewayConfig := merge $userEnvoyGatewayConfig $baseEnvoyGatewayConfig }}
    {{- if .Values.extensionManagersByName }}
    {{- if or $mergedEnvoyGatewayConfig.extensionManagers $mergedEnvoyGatewayConfig.extensionManager }}
    {{- fail "set extension managers in either extensionManagersByName or config.envoyGateway, not both" }}
    {{- end }}
    {{- $extensionManagers := (include "eg.extensionManagersFromMap" . | fromYaml).items }}
    {{- if $extensionManagers }}
    {{- $_ := set $mergedEnvoyGatewayConfig "extensionManagers" $extensionManagers }}
    {{- end }}
    {{- end }}
    {{- toYaml $mergedEnvoyGatewayConfig | nindent 4 }}
