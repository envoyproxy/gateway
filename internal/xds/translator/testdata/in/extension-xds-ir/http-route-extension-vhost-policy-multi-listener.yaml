http:
- name: "listener-foo"
  address: "0.0.0.0"
  port: 10080
  hostnames:
  - "foo.example.io"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  extensionRefs:
  - object:
      apiVersion: bar.example.io/v1alpha1
      kind: ExtensionPolicy
      metadata:
        name: policy-foo
        namespace: envoy-gateway
      spec:
        data: from-foo-policy
        targetRef:
          group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-1
  routes:
  - name: "foo-route"
    hostname: "foo.example.io"
    destination:
      name: "foo-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "foo-route-dest/backend/0"
- name: "listener-bar"
  address: "0.0.0.0"
  port: 10080
  hostnames:
  - "bar.example.io"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  extensionRefs:
  - object:
      apiVersion: bar.example.io/v1alpha1
      kind: ExtensionPolicy
      metadata:
        name: policy-bar
        namespace: envoy-gateway
      spec:
        data: from-bar-policy
        targetRef:
          group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-1
  routes:
  - name: "bar-route"
    hostname: "bar.example.io"
    destination:
      name: "bar-route-dest"
      settings:
      - endpoints:
        - host: "5.6.7.8"
          port: 50000
        name: "bar-route-dest/backend/0"
