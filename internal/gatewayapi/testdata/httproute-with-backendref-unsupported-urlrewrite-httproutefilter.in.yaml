gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-1
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
httpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      namespace: default
      name: httproute-1
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
      rules:
        - matches:
            - path:
                value: "/header"
          backendRefs:
            - name: service-1
              port: 8080
              filters:
                - type: ExtensionRef
                  extensionRef:
                    group: gateway.envoyproxy.io
                    kind: HTTPRouteFilter
                    name: rewrite-host-from-header
        - matches:
            - path:
                value: "/backend"
          backendRefs:
            - name: service-1
              port: 8080
              filters:
                - type: ExtensionRef
                  extensionRef:
                    group: gateway.envoyproxy.io
                    kind: HTTPRouteFilter
                    name: rewrite-host-from-backend
        - matches:
            - path:
                value: "/path-regex"
          backendRefs:
            - name: service-1
              port: 8080
              filters:
                - type: ExtensionRef
                  extensionRef:
                    group: gateway.envoyproxy.io
                    kind: HTTPRouteFilter
                    name: rewrite-host-from-path-regex
        - matches:
            - path:
                value: "/regex-path"
          backendRefs:
            - name: service-1
              port: 8080
              filters:
                - type: ExtensionRef
                  extensionRef:
                    group: gateway.envoyproxy.io
                    kind: HTTPRouteFilter
                    name: rewrite-path-regex
httpFilters:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: HTTPRouteFilter
    metadata:
      namespace: default
      name: rewrite-host-from-header
    spec:
      urlRewrite:
        hostname:
          type: Header
          header: my-host
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: HTTPRouteFilter
    metadata:
      namespace: default
      name: rewrite-host-from-backend
    spec:
      urlRewrite:
        hostname:
          type: Backend
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: HTTPRouteFilter
    metadata:
      namespace: default
      name: rewrite-host-from-path-regex
    spec:
      urlRewrite:
        hostname:
          type: PathRegex
          pathRegex:
            pattern: "^/path-regex/([^/]+).*"
            substitution: "\\1.example.com"
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: HTTPRouteFilter
    metadata:
      namespace: default
      name: rewrite-path-regex
    spec:
      urlRewrite:
        path:
          type: ReplaceRegexMatch
          replaceRegexMatch:
            pattern: "^/regex-path"
            substitution: "/rewritten"
