envoyProxyForGatewayClass:
  apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    name: test
    namespace: envoy-gateway-system
  spec:
    mergeGateways: true
gateways:
  # An HTTPS listener and a TLS listener on the same port with the same hostname cannot both
  # be served: they are distinguished by SNI, and here the SNI is identical. Both must be
  # marked Conflicted, the same as when they belong to a single Gateway.
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: gateway-https
      namespace: envoy-gateway
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: https
          port: 443
          protocol: HTTPS
          hostname: "foo.example.com"
          allowedRoutes:
            namespaces:
              from: All
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: tls-secret-1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: gateway-tls
      namespace: envoy-gateway
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: tls
          port: 443
          protocol: TLS
          hostname: "foo.example.com"
          allowedRoutes:
            namespaces:
              from: All
          tls:
            mode: Passthrough
  # A different hostname on the same port stays valid -- SNI can still tell them apart.
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: gateway-tls-distinct-hostname
      namespace: envoy-gateway
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: tls
          port: 443
          protocol: TLS
          hostname: "bar.example.com"
          allowedRoutes:
            namespaces:
              from: All
          tls:
            mode: Passthrough
  # The same collision, but the TLS listener comes from a ListenerSet attached to another
  # Gateway. Its status must carry Accepted=False and Programmed=False alongside Conflicted,
  # which only setConflictedConditions sets for ListenerSet listeners.
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: gateway-with-listenerset
      namespace: envoy-gateway
    spec:
      gatewayClassName: envoy-gateway-class
      allowedListeners:
        namespaces:
          from: Same
      listeners:
        - name: http
          port: 80
          protocol: HTTP
          allowedRoutes:
            namespaces:
              from: All
listenerSets:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: ListenerSet
    metadata:
      name: listenerset-tls
      namespace: envoy-gateway
    spec:
      parentRef:
        kind: Gateway
        group: gateway.networking.k8s.io
        name: gateway-with-listenerset
        namespace: envoy-gateway
      listeners:
        - name: tls
          port: 443
          protocol: TLS
          hostname: "foo.example.com"
          tls:
            mode: Passthrough
secrets:
  - apiVersion: v1
    kind: Secret
    metadata:
      namespace: envoy-gateway
      name: tls-secret-1
    type: kubernetes.io/tls
    data:
      tls.crt: 
      tls.key: 
