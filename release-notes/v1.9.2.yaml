date: September 28, 2026

# Changes that are expected to cause an incompatibility with previous versions, such as deletions or modifications to existing APIs.
breaking changes: |
  Lua scripts that use the `getfenv`, `setfenv`, `newproxy`, or `module` globals now fail `Strict` Lua validation, which is the default mode. Rewrite the script without them, or set `EnvoyProxy.spec.lua.validationType` to `InsecureSyntax` or `Disabled`.

# Updates addressing vulnerabilities, security flaws, or compliance requirements.
security updates: |
  Hardened the Lua validation sandbox by blocking the `getfenv`, `setfenv`, `newproxy`, and `module` globals.

# New features or capabilities added in this release.
new features: |

bug fixes: |
  Fixed a duplicate filter chain matcher error when a TLS listener with no attached routes shares a port with an HTTPS listener, which caused Envoy to reject every subsequent xDS update to that listener.
  Fixed HTTPS and TLS listeners from different merged Gateways sharing a port and a hostname being accepted, which produced two Envoy filter chains with the same SNI match and caused Envoy to reject the listener.
  Fixed `mergeBackends` applying a whole-Gateway `BackendTrafficPolicy`'s entire cluster-scoped feature set to merged UDP and TCP clusters regardless of the backend's protocol. Without `mergeBackends` those settings can never reach such a cluster - `ir.UDPRoute`, for instance, only carries load balancing and DNS - so enabling cluster deduplication could put `healthCheck`, `circuitBreaker`, `tcpKeepalive`, `proxyProtocol`, `http2`, `useClientProtocol` and `HttpProtocolOptions` on the cluster `udp_proxy` routes to, most damagingly running TCP/HTTP health checks against a UDP-only port. A merged cluster now receives only what the same policy would produce for that protocol without `mergeBackends`.
  Fixed the xDS translator emitting equivalent-but-byte-different resources on every reconcile: filter typed_config was marshaled non-deterministically, so proto map fields (such as an access log's `json_format`) re-ordered their keys each translation and caused repeated no-op xDS pushes. Typed configs are now marshaled deterministically.
  Fixed `ClientTrafficPolicy` rejecting BoringSSL equal-preference cipher groups such as `[ECDHE-ECDSA-AES128-GCM-SHA256|ECDHE-ECDSA-CHACHA20-POLY1305]` as an unsupported cipher suite. Each member of a group is now validated on its own.
  Fixed MergeBackends being unnecessarily disabled for HTTP and gRPC rules using gateway-level ConsistentHash load balancing.
  Fixed the shutdown manager exiting after the minimum drain period while UDP proxy sessions were still active. The drain now also waits for `udp.*.downstream_sess_active` to reach the exit threshold. UDP sessions only close on their idle timeout (60s by default), so a proxy that has handled UDP traffic recently may wait until the drain timeout before exiting.
  Fixed `rateLimitDeployment.pod.priorityClassName` being ignored when rendering the rate limit Deployment, so the configured PriorityClass is now applied to the rate limit pod the same way it is for the Envoy Proxy deployment.
  Fixed local rate limiting for Distinct client selectors to retain up to 10,000 per-value token buckets per wildcard descriptor by applying the cache limit to each route's filter configuration instead of relying on Envoy's default of 20.

# Enhancements that improve performance.
performance improvements: |
  Reduced control-plane memory on gateways where many backends validate against the same CA by storing each upstream CA bundle once per gateway and referencing it by a digest of its content, instead of carrying a copy on every route destination.
  Reduced xDS translation work for listeners with many routes by computing GeoIP header removals once per listener.
  Reduced repeated JSON decoding and encoding when JSONPath patches match multiple locations.

