- ignorePortInHostMatching: true
  name: envoy-gateway/gateway-1/http
  virtualHosts:
  - domains:
    - www.example.com
    name: envoy-gateway/gateway-1/http/www_example_com
    routes:
    - match:
        pathSeparatedPrefix: /foo
      name: httproute/default/httproute-1/rule/0/match/0/www_example_com
      route:
        cluster: httproute/default/httproute-1/rule/0
        upgradeConfigs:
        - upgradeType: websocket
      typedPerFilterConfig:
        envoy.filters.http.filter_chain.eep.listener:
          '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
          disabled: true
        envoy.filters.http.filter_chain.eep.route:
          '@type': type.googleapis.com/envoy.extensions.filters.http.filter_chain.v3.FilterChainConfigPerRoute
          filterChain:
            filters:
            - name: envoy.filters.http.dynamic_modules/0
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamicModuleConfig:
                  doNotClose: true
                  loadGlobally: true
                  module:
                    local:
                      filename: /usr/lib/envoy/modules/ai_gateway.so
                filterConfig:
                  '@type': type.googleapis.com/google.protobuf.StringValue
                  value: '{"maxTokensPerMinute":10000}'
                filterName: token-ratelimit
    - match:
        pathSeparatedPrefix: /bar
      name: httproute/default/httproute-2/rule/0/match/0/www_example_com
      route:
        cluster: httproute/default/httproute-2/rule/0
        upgradeConfigs:
        - upgradeType: websocket
      typedPerFilterConfig:
        envoy.filters.http.filter_chain.eep.listener:
          '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
          disabled: true
        envoy.filters.http.filter_chain.eep.route:
          '@type': type.googleapis.com/envoy.extensions.filters.http.filter_chain.v3.FilterChainConfigPerRoute
          filterChain:
            filters:
            - name: envoy.filters.http.dynamic_modules/0
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamicModuleConfig:
                  module:
                    local:
                      filename: /usr/lib/envoy/modules/my_auth.so
                filterConfig:
                  '@type': type.googleapis.com/google.protobuf.StringValue
                  value: '{"authEndpoint":"https://auth.example.com"}'
                filterName: auth-check
            - name: envoy.filters.http.dynamic_modules/1
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamicModuleConfig:
                  module:
                    remote:
                      httpUri:
                        cluster: modules_example_com_443
                        timeout: 10s
                        uri: https://modules.example.com/libremote_auth.so
                      sha256: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
                filterConfig:
                  '@type': type.googleapis.com/google.protobuf.StringValue
                  value: '{"authEndpoint":"https://remote-auth.example.com"}'
                filterName: remote-auth-check
    - match:
        pathSeparatedPrefix: /terminal
      name: httproute/default/httproute-3/rule/0/match/0/www_example_com
      route:
        cluster: httproute/default/httproute-3/rule/0
        upgradeConfigs:
        - upgradeType: websocket
      typedPerFilterConfig:
        envoy.filters.http.filter_chain.eep.listener:
          '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
          disabled: true
        envoy.filters.http.filter_chain.eep.route:
          '@type': type.googleapis.com/envoy.extensions.filters.http.filter_chain.v3.FilterChainConfigPerRoute
          filterChain:
            filters:
            - name: envoy.filters.http.dynamic_modules/0
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamicModuleConfig:
                  module:
                    local:
                      filename: /usr/lib/envoy/modules/my_handler.so
                filterName: handler
                terminalFilter: true
    - match:
        pathSeparatedPrefix: /path-loaded
      name: httproute/default/httproute-4/rule/0/match/0/www_example_com
      route:
        cluster: httproute/default/httproute-4/rule/0
        upgradeConfigs:
        - upgradeType: websocket
      typedPerFilterConfig:
        envoy.filters.http.filter_chain.eep.listener:
          '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
          disabled: true
        envoy.filters.http.filter_chain.eep.route:
          '@type': type.googleapis.com/envoy.extensions.filters.http.filter_chain.v3.FilterChainConfigPerRoute
          filterChain:
            filters:
            - name: envoy.filters.http.dynamic_modules/0
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamicModuleConfig:
                  module:
                    local:
                      filename: /opt/modules/my_module.so
                filterName: path-filter
- ignorePortInHostMatching: true
  name: envoy-gateway/gateway-1/http-listener-scope
  virtualHosts:
  - domains:
    - listener-scope.example.com
    name: envoy-gateway/gateway-1/http-listener-scope/listener-scope_example_com
    routes:
    - match:
        pathSeparatedPrefix: /inherit
      name: httproute/default/httproute-5/rule/0/match/0/listener_scope_example_com
      route:
        cluster: httproute/default/httproute-5/rule/0
        upgradeConfigs:
        - upgradeType: websocket
    - match:
        pathSeparatedPrefix: /override
      name: httproute/default/httproute-6/rule/0/match/0/listener_scope_example_com
      route:
        cluster: httproute/default/httproute-6/rule/0
