gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-tcp-udp
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: tcp
          protocol: TCP
          port: 8089
          allowedRoutes:
            kinds:
              - kind: TCPRoute
                group: gateway.networking.k8s.io
        - name: udp
          protocol: UDP
          port: 8162
          allowedRoutes:
            kinds:
              - kind: UDPRoute
                group: gateway.networking.k8s.io
        - name: tls
          protocol: TLS
          port: 8443
          tls:
            mode: Passthrough
          allowedRoutes:
            namespaces:
              from: All
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-grpc
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
tcpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1alpha2
    kind: TCPRoute
    metadata:
      namespace: default
      name: tcp-app-1
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-tcp-udp
          sectionName: tcp
      rules:
        - backendRefs:
            - name: service-1
              port: 8089
udpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1alpha2
    kind: UDPRoute
    metadata:
      namespace: default
      name: udp-app-1
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-tcp-udp
          sectionName: udp
      rules:
        - backendRefs:
            - name: service-1
              port: 8162
tlsRoutes:
  - apiVersion: gateway.networking.k8s.io/v1alpha2
    kind: TLSRoute
    metadata:
      namespace: default
      name: tls-app-1
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-tcp-udp
          sectionName: tls
      hostnames:
        - "foo.com"
      rules:
        - backendRefs:
            - name: service-1
              port: 8443
grpcRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: GRPCRoute
    metadata:
      namespace: default
      name: grpc-app-1
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-grpc
          sectionName: http
      rules:
        - backendRefs:
            - name: service-1
              port: 8080
backendTrafficPolicies:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: default
      name: policy-tcp
    spec:
      targetRef:
        group: gateway.networking.k8s.io
        kind: TCPRoute
        name: tcp-app-1
      http1:
        enableTrailers: true
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: default
      name: policy-udp
    spec:
      targetRef:
        group: gateway.networking.k8s.io
        kind: UDPRoute
        name: udp-app-1
      http1:
        enableTrailers: true
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: default
      name: policy-tls
    spec:
      targetRef:
        group: gateway.networking.k8s.io
        kind: TLSRoute
        name: tls-app-1
      http1:
        enableTrailers: true
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: default
      name: policy-grpc
    spec:
      targetRef:
        group: gateway.networking.k8s.io
        kind: GRPCRoute
        name: grpc-app-1
      http1:
        enableTrailers: true
