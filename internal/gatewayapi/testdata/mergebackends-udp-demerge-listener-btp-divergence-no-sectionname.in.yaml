envoyProxyForGatewayClass:
  apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    namespace: envoy-gateway-system
    name: test
  spec:
    mergeBackends: {}
gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-1
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: udp-1
          protocol: UDP
          port: 8080
          allowedRoutes:
            namespaces:
              from: All
            kinds:
              - kind: UDPRoute
        - name: udp-2
          protocol: UDP
          port: 8081
          allowedRoutes:
            namespaces:
              from: All
            kinds:
              - kind: UDPRoute
backendTrafficPolicies:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: envoy-gateway
      name: btp-udp-1-circuit-breaker
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-1
          sectionName: udp-1
      circuitBreaker:
        maxConnections: 1024
udpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1alpha2
    kind: UDPRoute
    metadata:
      namespace: default
      name: udproute-1
    spec:
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
      rules:
        - backendRefs:
            - name: service-3
              port: 8162
endpointSlices:
  - apiVersion: discovery.k8s.io/v1
    kind: EndpointSlice
    metadata:
      name: endpointslice-service-3
      namespace: default
      labels:
        kubernetes.io/service-name: service-3
    addressType: IPv4
    ports:
      - name: udp
        protocol: UDP
        port: 8162
    endpoints:
      - addresses:
          - "7.7.7.8"
        conditions:
          ready: true
