clientTrafficPolicies:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: ClientTrafficPolicy
  metadata:
    namespace: envoy-gateway
    name: target-gateway-1
    generation: 10
  spec:
    headers:
      # One KiB over the 8192Ki maximum Envoy supports for max_request_headers_kb.
      maxRequestHeaderLimit: 8193Ki
    targetRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-1
gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: gateway-1
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: http-1
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
