healthCheckLog:
  fileSinks:
  - path: "/dev/stdout"
  alwaysLogHealthCheckFailures: true
  alwaysLogHealthCheckSuccess: true
http:
- address: 0.0.0.0
  hostnames:
  - '*'
  name: envoy-gateway/gateway-1/http
  path:
    escapedSlashesAction: UnescapeAndRedirect
    mergeSlashes: true
  port: 10080
  routes:
  - destination:
      backendClusterRefs:
      - name: service/default/service-1/8080/http
      name: httproute/default/http-route-1/rule/0
      settings: []
    hostname: '*'
    isHTTP2: false
    name: httproute/default/http-route-1/rule/0/match/0/*
    pathMatch:
      distinct: false
      name: ""
      prefix: /
    traffic:
      healthCheck:
        active:
          timeout: "500ms"
          interval: "3s"
          unhealthyThreshold: 3
          healthyThreshold: 1
          tcp: {}
backendClusters:
- metadata:
    kind: HTTPRoute
    name: http-route-1
    namespace: default
  name: service/default/service-1/8080/http
  setting:
    addressType: IP
    endpoints:
    - host: 7.7.7.8
      port: 8080
    - host: 7.7.7.7
      port: 8080
    metadata:
      kind: Service
      name: service-1
      namespace: default
      sectionName: "8080"
    name: service/default/service-1/8080/http
    protocol: HTTP
    weight: 1
  traffic:
    healthCheck:
      active:
        timeout: "500ms"
        interval: "3s"
        unhealthyThreshold: 3
        healthyThreshold: 1
        tcp: {}
