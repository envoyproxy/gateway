    - ActionSpecifier:
        GenericKey:
          descriptor_key: test-namespace/test-policy-2/rule/0
          descriptor_value: test-namespace/test-policy-2/rule/0
    - ActionSpecifier:
        RemoteAddressMatch:
          address_matcher:
            ranges:
            - address_prefix: 192.168.0.10
              prefix_len:
                value: 32
          descriptor_key: masked_remote_address
          descriptor_value: 192.168.0.10/32
routeName: second-route
