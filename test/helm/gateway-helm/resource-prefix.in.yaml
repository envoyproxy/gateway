global:
  images:
    envoyGateway:
      image: "docker.io/envoyproxy/gateway-dev:latest"
      pullPolicy: Always
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/tenant-a
    provider:
      type: Kubernetes
      kubernetes:
        watch:
          objectSelector:
            matchLabels:
              gateway: internal
resourcePrefix: tenant-a
