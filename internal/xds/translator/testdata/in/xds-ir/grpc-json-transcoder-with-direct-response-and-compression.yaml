http:
- name: "first-listener"
  address: "::"
  port: 10080
  hostnames:
  - "*"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  # Shares its transcoder with compressed-route and comes first, so the HCM must still get
  # the filter from the later, active route.
  - name: "rejected-route"
    hostname: "*"
    pathMatch:
      prefix: "/rejected"
    directResponse:
      statusCode: 500
    grpcJSONTranscoder:
      name: "httproutefilter/default/transcode"
      protoDescriptorBin: "CrsBChNleGFtcGxlL2hlbGxvLnByb3RvEgdleGFtcGxlIiIKDEhlbGxvUmVxdWVzdBISCgRuYW1lGAEgASgJUgRuYW1lIikKDUhlbGxvUmVzcG9uc2USGAoHbWVzc2FnZRgBIAEoCVIHbWVzc2FnZTJECgdHcmVldGVyEjkKCFNheUhlbGxvEhUuZXhhbXBsZS5IZWxsb1JlcXVlc3QaFi5leGFtcGxlLkhlbGxvUmVzcG9uc2ViBnByb3RvMw=="
      services:
      - "example.Greeter"
  - name: "compressed-route"
    hostname: "*"
    pathMatch:
      prefix: "/compressed"
    destination:
      name: "compressed-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50051
        name: "compressed-route-dest/backend/0"
    traffic:
      compression:
      - type: Gzip
    grpcJSONTranscoder:
      name: "httproutefilter/default/transcode"
      protoDescriptorBin: "CrsBChNleGFtcGxlL2hlbGxvLnByb3RvEgdleGFtcGxlIiIKDEhlbGxvUmVxdWVzdBISCgRuYW1lGAEgASgJUgRuYW1lIikKDUhlbGxvUmVzcG9uc2USGAoHbWVzc2FnZRgBIAEoCVIHbWVzc2FnZTJECgdHcmVldGVyEjkKCFNheUhlbGxvEhUuZXhhbXBsZS5IZWxsb1JlcXVlc3QaFi5leGFtcGxlLkhlbGxvUmVzcG9uc2ViBnByb3RvMw=="
      services:
      - "example.Greeter"
  - name: "redirected-route"
    hostname: "*"
    pathMatch:
      prefix: "/redirected"
    redirect:
      scheme: https
      statusCode: 302
    grpcJSONTranscoder:
      name: "httproutefilter/default/transcode-redirected"
      protoDescriptorBin: "CrsBChNleGFtcGxlL2hlbGxvLnByb3RvEgdleGFtcGxlIiIKDEhlbGxvUmVxdWVzdBISCgRuYW1lGAEgASgJUgRuYW1lIikKDUhlbGxvUmVzcG9uc2USGAoHbWVzc2FnZRgBIAEoCVIHbWVzc2FnZTJECgdHcmVldGVyEjkKCFNheUhlbGxvEhUuZXhhbXBsZS5IZWxsb1JlcXVlc3QaFi5leGFtcGxlLkhlbGxvUmVzcG9uc2ViBnByb3RvMw=="
      services:
      - "example.Greeter"
