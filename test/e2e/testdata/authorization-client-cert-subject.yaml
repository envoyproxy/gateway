# CA and server cert
# Cert generation commands (for reference):
#   openssl genrsa -out ca.key 2048
#   openssl req -x509 -new -key ca.key -sha256 -days 3650 \
#     -subj "/O=Envoy Gateway Tests/CN=ClientCert Subject AuthZ Test CA" -out ca.crt
#
#   # Server cert (DNS SAN: authz-client-cert-subject.example.com)
#   openssl genrsa -out server.key 2048
#   openssl req -new -key server.key \
#     -subj "/CN=authz-client-cert-subject.example.com/O=Envoy Gateway Tests" -out server.csr
#   # ext: subjectAltName = DNS:authz-client-cert-subject.example.com, extendedKeyUsage = serverAuth
#   openssl x509 -req -days 3650 -CA ca.crt -CAkey ca.key -CAcreateserial \
#     -in server.csr -out server.crt -extfile server-ext.cnf -extensions v3_req
#
#   # Allowed client cert (Subject DN: CN=allowed-client,O=Envoy Gateway Tests)
#   openssl genrsa -out client-allowed.key 2048
#   openssl req -new -key client-allowed.key -subj "/CN=allowed-client/O=Envoy Gateway Tests" -out client-allowed.csr
#   # ext: extendedKeyUsage = clientAuth
#   openssl x509 -req -days 3650 -CA ca.crt -CAkey ca.key -CAcreateserial \
#     -in client-allowed.csr -out client-allowed.crt -extfile client-allowed-ext.cnf -extensions v3_req
#
#   # Denied client cert (Subject DN: CN=denied-client,O=Envoy Gateway Tests)
#   # (same shape, different CN)
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-subject-server-cert
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-subject-allowed
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-subject-denied
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: authz-client-cert-subject-gateway
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: mtls
      port: 443
      protocol: HTTPS
      hostname: authz-client-cert-subject.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: authz-client-cert-subject-server-cert
---
# ClientTrafficPolicy: require mTLS, validate client cert against the CA
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: authz-client-cert-subject-ctp
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: authz-client-cert-subject-gateway
      sectionName: mtls
  tls:
    clientValidation:
      caCertificateRefs:
        - kind: Secret
          group: ""
          name: authz-client-cert-subject-server-cert
---
# HTTPRoute: send all traffic to the infra backend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authz-client-cert-subject-route
  namespace: gateway-conformance-infra
spec:
  hostnames:
    - authz-client-cert-subject.example.com
  parentRefs:
    - name: authz-client-cert-subject-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /allowed
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
# SecurityPolicy: allow only requests where Subject DN contains CN=allowed-client
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authz-client-cert-subject-allow
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: authz-client-cert-subject-route
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-subject-dn
        action: Allow
        principal:
          clientCert:
            subject:
              type: RegularExpression
              value: ".*CN=allowed-client.*"
---
# HTTPRoute: exact-match sub-test
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authz-client-cert-subject-exact-route
  namespace: gateway-conformance-infra
spec:
  hostnames:
    - authz-client-cert-subject.example.com
  parentRefs:
    - name: authz-client-cert-subject-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /exact-allowed
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
# SecurityPolicy: allow only requests whose Subject DN is exactly CN=allowed-client,O=Envoy Gateway Tests
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authz-client-cert-subject-exact-allow
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: authz-client-cert-subject-exact-route
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-exact-subject-dn
        action: Allow
        principal:
          clientCert:
            subject:
              type: Exact
              value: "O=Envoy Gateway Tests,CN=allowed-client"
