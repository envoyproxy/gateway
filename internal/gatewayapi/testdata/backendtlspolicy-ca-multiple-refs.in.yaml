backendTLSPolicies:
  - apiVersion: gateway.networking.k8s.io/v1alpha2
    kind: BackendTLSPolicy
    metadata:
      name: policy-btls
      namespace: backends
    spec:
      targetRefs:
        - group: ""
          kind: Service
          name: http-backend
          sectionName: http
      validation:
        caCertificateRefs:
          - name: ca-cmap
            group: ""
            kind: ConfigMap
          - name: ca-cluster-trust-bundle
            group: ""
            kind: ClusterTrustBundle
        hostname: example.com
  - apiVersion: gateway.networking.k8s.io/v1alpha2
    kind: BackendTLSPolicy
    metadata:
      name: policy-btls-reversed
      namespace: backends
    spec:
      targetRefs:
        - group: ""
          kind: Service
          name: http-backend-2
          sectionName: http
      validation:
        caCertificateRefs:
          - name: ca-cluster-trust-bundle
            group: ""
            kind: ClusterTrustBundle
          - name: ca-cmap
            group: ""
            kind: ConfigMap
        hostname: example.com
