global:
  images:
    envoyGateway:
      image: "docker.io/envoyproxy/gateway-dev:latest"
      pullPolicy: Always
    envoyProxy:
      pullPolicy: Always
      pullSecrets:
        - name: "secret1"
config:
  envoyGateway:
    envoyProxy:
      provider:
        kubernetes:
          envoyDeployment:
            replicas: 2
            container:
              image: "private-hub/envoyproxy/envoy:custom"
