http:
  - name: "first-listener"
    address: "::"
    port: 10080
    hostnames:
      - "foo.com"
    path:
      mergeSlashes: true
      escapedSlashesAction: UnescapeAndRedirect
    routes:
      - name: "first-route"
        hostname: "*"
        destination:
          name: "first-route-dest"
          settings:
            - endpoints:
                - host: "1.2.3.4"
                  port: 50000
              name: "first-route-dest/backend/0"
    headers:
      maxRequestHeadersKB: 96
  - name: "second-listener"
    address: "::"
    port: 10080
    hostnames:
      - "example.com"
    path:
      mergeSlashes: true
      escapedSlashesAction: UnescapeAndRedirect
    routes:
      - name: "second-route"
        hostname: "*"
        destination:
          name: "second-route-dest"
          settings:
            - endpoints:
                - host: "1.2.3.4"
                  port: 50000
              name: "second-route-dest/backend/0"
    headers:
      maxRequestHeadersKB: 96
