http:
  - address: 0.0.0.0
    hostnames:
      - '*'
    name: envoy-gateway/gateway-http3/http
    path:
      escapedSlashesAction: UnescapeAndRedirect
      mergeSlashes: true
    port: 10080
    routes:
      - destination:
          name: httproute/default/http3-auto/rule/0
          settings:
            - addressType: IP
              endpoints:
                - host: 10.244.0.11
                  port: 8080
              protocol: HTTP
              name: httproute/default/http3-auto/rule/0/backend/0
              metadata:
                kind: Service
                name: h3-backend
                namespace: default
              tls:
                CACertificate:
                  certificate: 
                  name: policy-btls/policies-ca
                SNI: example.com
              weight: 1
        hostname: '*'
        name: auto-route
        pathMatch:
          exact: /auto-route
          name: ""
        traffic:
          http3:
            mode: Auto
      - destination:
          name: httproute/default/http3-auto-2/rule/0
          settings:
            - addressType: IP
              endpoints:
                - host: 10.244.0.11
                  port: 8080
              protocol: HTTP
              name: httproute/default/http3-auto-2/rule/0/backend/0
              metadata:
                kind: Service
                name: h3-backend
                namespace: default
              tls:
                CACertificate:
                  certificate: 
                  name: policy-btls/policies-ca
                SNI: example.com
              weight: 1
        hostname: '*'
        name: auto-route-2
        pathMatch:
          exact: /auto-route-2
          name: ""
        traffic:
          http3:
            mode: Auto
      - destination:
          name: httproute/default/http3-always/rule/0
          settings:
            - addressType: IP
              endpoints:
                - host: 10.244.0.11
                  port: 8080
              protocol: HTTP
              name: httproute/default/http3-always/rule/0/backend/0
              metadata:
                kind: Service
                name: h3-backend
                namespace: default
              tls:
                CACertificate:
                  certificate: 
                  name: policy-btls/policies-ca
                SNI: example.com
              weight: 1
        hostname: '*'
        name: always-route
        pathMatch:
          exact: /always-route
          name: ""
        traffic:
          http3:
            mode: Always
      # Still carries http3 Auto, as an extension hook or a mixed weighted rule can leave it,
      # but the plaintext backend never gets QUIC, so neither the alt-svc strip nor the
      # alternate protocols cache is enabled on the route.
      - destination:
          name: httproute/default/http3-no-tls/rule/0
          settings:
            - addressType: IP
              endpoints:
                - host: 10.244.0.11
                  port: 8080
              protocol: HTTP
              name: httproute/default/http3-no-tls/rule/0/backend/0
              weight: 1
        hostname: '*'
        name: no-tls-route
        pathMatch:
          exact: /no-tls-route
          name: ""
        traffic:
          http3:
            mode: Auto
  # Listener with downstream HTTP/3 and an upstream HTTP/3 route: on that route the backend
  # alt-svc is stripped and the gateway's own is re-added by the header mutation filter,
  # while the other route gets the gateway's alt-svc appended by the router.
  - address: 0.0.0.0
    externalPort: 443
    hostnames:
      - '*'
    http3:
      advertisedPort: 8443
    name: envoy-gateway/gateway-http3/https
    path:
      escapedSlashesAction: UnescapeAndRedirect
      mergeSlashes: true
    port: 10443
    tls:
      alpnProtocols: null
      certificates:
        - certificate: 
          name: envoy-gateway/tls-secret-1
          privateKey: "[redacted]"
      maxVersion: "1.3"
      minVersion: "1.2"
    routes:
      - destination:
          name: httproute/default/https-http3-auto/rule/0
          settings:
            - addressType: IP
              endpoints:
                - host: 10.244.0.11
                  port: 8080
              protocol: HTTP
              name: httproute/default/https-http3-auto/rule/0/backend/0
              metadata:
                kind: Service
                name: h3-backend
                namespace: default
              tls:
                CACertificate:
                  certificate: 
                  name: policy-btls/policies-ca
                SNI: example.com
              weight: 1
        hostname: '*'
        name: https-auto-route
        pathMatch:
          exact: /https-auto-route
          name: ""
        traffic:
          http3:
            mode: Auto
      - destination:
          name: httproute/default/https-plain/rule/0
          settings:
            - addressType: IP
              endpoints:
                - host: 10.244.0.12
                  port: 8080
              protocol: HTTP
              name: httproute/default/https-plain/rule/0/backend/0
              weight: 1
        hostname: '*'
        name: https-plain-route
        pathMatch:
          exact: /https-plain-route
          name: ""
