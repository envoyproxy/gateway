http:
- name: "default/gw/http"
  address: "0.0.0.0"
  port: 10443
  externalPort: 10443
  hostnames:
  - "plain.example.com"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  - name: "http-route"
    hostname: "plain.example.com"
    destination:
      name: "http-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "http-route-dest/backend/0"
- name: "default/gw/https-a"
  address: "0.0.0.0"
  port: 10443
  externalPort: 443
  hostnames:
  - "a.example.com"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  tls:
    alpnProtocols:
    - h2
    - http/1.1
    certificates:
    - name: default/good
      # byte slice representation of "cert-data"
      certificate: [99, 101, 114, 116, 45, 100, 97, 116, 97]
      # byte slice representation of "key-data"
      privateKey: [107, 101, 121, 45, 100, 97, 116, 97]
  routes:
  - name: "https-a-route"
    hostname: "a.example.com"
    destination:
      name: "https-a-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "https-a-route-dest/backend/0"
- name: "default/gw/https-b"
  address: "0.0.0.0"
  port: 10443
  externalPort: 443
  hostnames:
  - "b.example.com"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  tls:
    alpnProtocols:
    - h2
    - http/1.1
    certificates:
    - name: default/good
      # byte slice representation of "cert-data"
      certificate: [99, 101, 114, 116, 45, 100, 97, 116, 97]
      # byte slice representation of "key-data"
      privateKey: [107, 101, 121, 45, 100, 97, 116, 97]
  routes:
  - name: "https-b-route"
    hostname: "b.example.com"
    destination:
      name: "https-b-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50000
        name: "https-b-route-dest/backend/0"
