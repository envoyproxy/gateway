spec:
  parentRefs:
    - name: server-header-append-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /server-header
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
