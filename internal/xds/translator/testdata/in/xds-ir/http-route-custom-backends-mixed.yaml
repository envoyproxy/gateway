# Same IR as extension-xds-ir/http-route-custom-backends-mixed-no-merge-backends.yaml, translated
# without an extension manager to capture the xDS Envoy Gateway builds before any extension hook:
# a rule mixing a Service and a custom backend with MergeBackends disabled. Both backendRefs stay
# per-route Settings; the custom one has no endpoints, so the rule collapses into a single EDS
# cluster where the custom backend contributes only an empty locality.
http:
- name: "custom-backends-mixed-no-merge-backends-listener"
  address: "0.0.0.0"
  port: 10080
  hostnames:
  - "*"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  - name: "mixed-route"
    hostname: "*"
    pathMatch:
      prefix: "/mixed"
    destination:
      name: "mixed-route-dest"
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        name: "mixed-route-dest/backend/0"
        protocol: HTTP
        weight: 1
      - isCustomBackend: true
        name: "mixed-route-dest/backend/1"
        weight: 1
    extensionRefs:
    - object:
        apiVersion: inference.networking.x-k8s.io/v1alpha2
        kind: InferencePool
        metadata:
          name: inference-pool
        spec:
          targetPortNumber: 8000
          selector:
            app: vllm-llama3-8b-instruct
          extensionRef:
            name: vllm-llama3-8b-instruct-epp
