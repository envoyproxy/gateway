envoyProxyForGatewayClass:
  apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    name: test
    namespace: envoy-gateway-system
  spec:
    logging: {}
    telemetry:
      accessLog:
        settings:
        - format:
            text: |
              [%START_TIME%] "%REQ(:METHOD)% %PROTOCOL%" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION% "%REQ(X-REQUEST-ID)%" "%UPSTREAM_HOST%"\n
            type: Text
          sinks:
          - file:
              path: /dev/stdout
            type: File
          - openTelemetry:
              backendRefs:
              - name: service-not-found
                namespace: monitoring
                port: 4317
            type: OpenTelemetry
      healthCheckLog:
        matches:
        - Failure
      metrics:
        sinks:
        - openTelemetry:
            host: otel-collector.monitoring.svc.cluster.local
            port: 4317
          type: OpenTelemetry
        - openTelemetry:
            backendRefs:
            - name: service-not-found
              namespace: monitoring
              port: 4317
          type: OpenTelemetry
      tracing:
        provider:
          host: otel-collector.monitoring.svc.cluster.local
          port: 4317
          type: OpenTelemetry
        samplingRate: 100
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: GatewayClass
        name: envoy-gateway-class
      conditions:
      - lastTransitionTime: null
        message: EnvoyProxy has been accepted.
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: 'spec.telemetry.metrics.sinks[0].openTelemetry.host is deprecated
          and will be removed in v1.11, use spec.telemetry.metrics.sinks[0].openTelemetry.backendRefs
          instead; spec.telemetry.tracing.provider.host is deprecated and will be
          removed in v1.11, use spec.telemetry.tracing.provider.backendRefs instead;
          The following invalid telemetry fields were ignored: telemetry.accessLog.settings[0].sinks[1]:
          service monitoring/service-not-found not found; telemetry.metrics.sinks[1]:
          service monitoring/service-not-found not found'
        reason: Warnings
        status: "True"
        type: Warning
gatewayClass:
  apiVersion: gateway.networking.k8s.io/v1
  kind: GatewayClass
  metadata:
    name: envoy-gateway-class
  spec:
    controllerName: gateway.envoyproxy.io/gatewayclass-controller
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: test
      namespace: envoy-gateway-system
  status:
    conditions:
    - lastTransitionTime: null
      message: Valid GatewayClass
      reason: Accepted
      status: "True"
      type: Accepted
gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    name: gateway-1
    namespace: envoy-gateway
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      name: http
      port: 80
      protocol: HTTP
  status:
    listeners:
    - attachedRoutes: 0
      conditions:
      - lastTransitionTime: null
        message: Sending translated listener configuration to the data plane
        reason: Programmed
        status: "True"
        type: Programmed
      - lastTransitionTime: null
        message: Listener has been successfully translated
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Listener references have been resolved
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      name: http
      supportedKinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      - group: gateway.networking.k8s.io
        kind: GRPCRoute
