- address:
    socketAddress:
      address: 0.0.0.0
      portValue: 10080
  defaultFilterChain:
    filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        commonHttpProtocolOptions:
          headersWithUnderscoresAction: REJECT_REQUEST
        http2ProtocolOptions:
          initialConnectionWindowSize: 1048576
          initialStreamWindowSize: 65536
          maxConcurrentStreams: 100
        httpFilters:
        - disabled: true
          name: envoy.filters.http.lua/envoyextensionpolicy/default/one/lua/0
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            defaultSourceCode:
              inlineString: |
                function envoy_on_request(handle)
                  local cluster = handle:route():metadata():get("resolver")
                  handle:httpCall(cluster, {[":method"]="GET", [":path"]="/", [":authority"]="resolver"}, nil, 1000)
                end
        - disabled: true
          name: envoy.filters.http.lua/envoyextensionpolicy/default/two/lua/0
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            defaultSourceCode:
              inlineString: function envoy_on_request(handle) end
        - disabled: true
          name: envoy.filters.http.lua/envoyextensionpolicy/default/one/lua/1
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            defaultSourceCode:
              inlineString: function envoy_on_request(handle) end
        - disabled: true
          name: envoy.filters.http.wasm/envoyextensionpolicy/default/one/wasm/0
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
            config:
              configuration:
                '@type': type.googleapis.com/google.protobuf.StringValue
                value: '{"backend":"resolver"}'
              name: callout
              vmConfig:
                code:
                  remote:
                    httpUri:
                      cluster: wasm_cluster
                      timeout: 10s
                      uri: http://envoy-gateway:18002/callout.wasm
                    retryPolicy:
                      numRetries: 10
                      retryBackOff:
                        baseInterval: 1s
                        maxInterval: 30s
                    sha256: a1f0b78b8c1320690327800e3a5de10e7dbba7b6c752e702193a395a52c727b6
                runtime: envoy.wasm.runtime.v8
                vmId: envoyextensionpolicy/default/one/wasm/0
        - disabled: true
          name: envoy.filters.http.dynamic_modules/envoyextensionpolicy/default/one/dynamic-module/0
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
            dynamicModuleConfig:
              module:
                local:
                  filename: /usr/lib/envoy/callout.so
            filterConfig:
              '@type': type.googleapis.com/google.protobuf.StringValue
              value: '{"backend":"resolver"}'
            filterName: callout
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            suppressEnvoyHeaders: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: default/gateway/http
        serverHeaderTransformation: PASS_THROUGH
        statPrefix: http-10080
        useRemoteAddress: true
    name: default/gateway/http
  maxConnectionsToAcceptPerSocketEvent: 1
  name: default/gateway/http
  perConnectionBufferLimitBytes: 32768
