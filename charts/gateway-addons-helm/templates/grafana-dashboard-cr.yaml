{{- $mode := .Values.dashboard.mode | default "configmap" }}
{{- if eq $mode "grafana-operator" }}
{{/* Old releases upgraded with --reuse-values lack these keys. Preserve explicit empty values. */}}
{{- $folder := "envoy-gateway" }}
{{- if hasKey .Values.dashboard "folder" }}
{{- $folder = .Values.dashboard.folder }}
{{- end }}
{{- $instanceSelector := dict "matchLabels" (dict "dashboards" "grafana") }}
{{- if hasKey .Values.dashboard "instanceSelector" }}
{{- $instanceSelector = .Values.dashboard.instanceSelector }}
{{- end }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $dashboardName := $path | base | trimSuffix ".json" }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $dashboardName | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- with $.Values.dashboard.labels }}
  labels: {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- $anns := merge (dict) ($.Values.dashboard.annotations | default dict) (dict "argocd.argoproj.io/sync-options" "ServerSideApply=true") }}
  annotations: {{- $anns | toYaml | nindent 4 }}
spec:
  allowCrossNamespaceImport: true
  folder: {{ $folder | quote }}
  instanceSelector:
    {{- $instanceSelector | toYaml | nindent 4 }}
  json: {{ $.Files.Get $path | toJson }}
{{- end }}
{{- end }}
