gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: gateway-udp
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: udp
      protocol: UDP
      port: 8088
      allowedRoutes:
        namespaces:
          from: All
udpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: UDPRoute
  metadata:
    namespace: default
    name: udpr-app
  spec:
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-udp
      sectionName: udp
    rules:
    - backendRefs:
      - name: service-1
        port: 8163
securityPolicies:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: SecurityPolicy
  metadata:
    namespace: default
    name: sp-udpr-no-auth
  spec:
    targetRef:
      group: gateway.networking.k8s.io
      kind: UDPRoute
      name: udpr-app
