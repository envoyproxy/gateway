# A rule mixing a Service with a custom backend, and a rule with two custom backends.
# Each backendRef gets its own weighted cluster, and the cluster hook only receives the custom
# backend resource that belongs to that cluster: the Service cluster is left untouched, and each
# InferencePool cluster receives exactly one InferencePool.
http:
- name: "custom-backends-weighted-listener"
  address: "0.0.0.0"
  port: 10080
  hostnames:
  - "*"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  - name: "mixed-route"
    hostname: "*"
    pathMatch:
      prefix: "/mixed"
    destination:
      name: "mixed-route-dest"
      settings:
      - addressType: IP
        endpoints:
        - host: 7.7.7.7
          port: 8080
        name: "mixed-route-dest/backend/0"
        protocol: HTTP
        weight: 1
      - isCustomBackend: true
        name: "mixed-route-dest/backend/1"
        weight: 1
        customBackendRef:
          name: inference.networking.x-k8s.io/inferencepool/default/inference-pool
    extensionRefs:
    - name: inference.networking.x-k8s.io/inferencepool/default/inference-pool
  - name: "pools-route"
    hostname: "*"
    pathMatch:
      prefix: "/pools"
    destination:
      name: "pools-route-dest"
      settings:
      - isCustomBackend: true
        name: "pools-route-dest/backend/0"
        weight: 3
        customBackendRef:
          name: inference.networking.x-k8s.io/inferencepool/default/inference-pool
      - isCustomBackend: true
        name: "pools-route-dest/backend/1"
        weight: 1
        customBackendRef:
          name: inference.networking.x-k8s.io/inferencepool/default/inference-pool-2
    extensionRefs:
    - name: inference.networking.x-k8s.io/inferencepool/default/inference-pool
    - name: inference.networking.x-k8s.io/inferencepool/default/inference-pool-2
extensionResources:
- name: inference.networking.x-k8s.io/inferencepool/default/inference-pool
  object:
    apiVersion: inference.networking.x-k8s.io/v1alpha2
    kind: InferencePool
    metadata:
      name: inference-pool
      namespace: default
    spec:
      targetPortNumber: 8000
      selector:
        app: vllm-llama3-8b-instruct
      extensionRef:
        name: vllm-llama3-8b-instruct-epp
- name: inference.networking.x-k8s.io/inferencepool/default/inference-pool-2
  object:
    apiVersion: inference.networking.x-k8s.io/v1alpha2
    kind: InferencePool
    metadata:
      name: inference-pool-2
      namespace: default
    spec:
      targetPortNumber: 8000
      selector:
        app: vllm-llama3-8b-instruct
      extensionRef:
        name: vllm-llama3-8b-instruct-epp
