gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    name: gateway-1
    namespace: envoy-gateway
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - allowedRoutes:
        namespaces:
          from: All
      name: http
      port: 80
      protocol: HTTP
  status:
    listeners:
    - attachedRoutes: 1
      conditions:
      - lastTransitionTime: null
        message: Sending translated listener configuration to the data plane
        reason: Programmed
        status: "True"
        type: Programmed
      - lastTransitionTime: null
        message: Listener has been successfully translated
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Listener references have been resolved
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      name: http
      supportedKinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
      - group: gateway.networking.k8s.io
        kind: GRPCRoute
httpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: httproute-1
    namespace: default
  spec:
    parentRefs:
    - name: gateway-1
      namespace: envoy-gateway
    rules:
    - backendRefs:
      - filters:
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: rewrite-host-from-header
          type: ExtensionRef
        name: service-1
        port: 8080
      matches:
      - path:
          value: /header
    - backendRefs:
      - filters:
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: rewrite-host-from-backend
          type: ExtensionRef
        name: service-1
        port: 8080
      matches:
      - path:
          value: /backend
    - backendRefs:
      - filters:
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: rewrite-host-from-path-regex
          type: ExtensionRef
        name: service-1
        port: 8080
      matches:
      - path:
          value: /path-regex
    - backendRefs:
      - filters:
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: rewrite-path-regex
          type: ExtensionRef
        name: service-1
        port: 8080
      matches:
      - path:
          value: /regex-path
    - backendRefs:
      - filters:
        - type: URLRewrite
          urlRewrite:
            hostname: rewritten.example.com
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: append-x-forwarded-host
          type: ExtensionRef
        name: service-1
        port: 8080
      matches:
      - path:
          value: /append-x-forwarded-host
    - backendRefs:
      - filters:
        - type: URLRewrite
          urlRewrite:
            hostname: rewritten.example.com
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: no-x-forwarded-host
          type: ExtensionRef
        name: service-1
        port: 8080
      matches:
      - path:
          value: /no-x-forwarded-host
  status:
    parents:
    - conditions:
      - lastTransitionTime: null
        message: Route is accepted
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: |-
          Failed to process route rule 0 backendRef 0: URLRewrite hostname modifier of type Header is not supported in the filters of a backendRef.
          Failed to process route rule 1 backendRef 0: URLRewrite hostname modifier of type Backend is not supported in the filters of a backendRef.
          Failed to process route rule 2 backendRef 0: URLRewrite hostname modifier of type PathRegex is not supported in the filters of a backendRef.
          Failed to process route rule 3 backendRef 0: URLRewrite path modifier is not supported in the filters of a backendRef.
          Failed to process route rule 4 backendRef 0: URLRewrite appendXForwardedHost: true is not supported in the filters of a backendRef.
        reason: InvalidBackendFilters
        status: "False"
        type: ResolvedRefs
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
      parentRef:
        name: gateway-1
        namespace: envoy-gateway
infraIR:
  envoy-gateway/gateway-1:
    proxy:
      listeners:
      - name: envoy-gateway/gateway-1/http
        ports:
        - containerPort: 10080
          name: http-80
          protocol: HTTP
          servicePort: 80
      metadata:
        labels:
          gateway.envoyproxy.io/owning-gateway-name: gateway-1
          gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway
        ownerReference:
          kind: GatewayClass
          name: envoy-gateway-class
      name: envoy-gateway/gateway-1
      namespace: envoy-gateway-system
xdsIR:
  envoy-gateway/gateway-1:
    accessLog:
      json:
      - path: /dev/stdout
    globalResources:
      proxyServiceCluster:
        metadata:
          kind: Service
          name: envoy-envoy-gateway-gateway-1-196ae069
          namespace: envoy-gateway-system
          sectionName: "8080"
        name: envoy-gateway/gateway-1
        settings:
        - addressType: IP
          endpoints:
          - host: 7.6.5.4
            port: 8080
            zone: zone1
          metadata:
            kind: Service
            name: envoy-envoy-gateway-gateway-1-196ae069
            namespace: envoy-gateway-system
            sectionName: "8080"
          name: envoy-gateway/gateway-1
          protocol: TCP
    http:
    - address: 0.0.0.0
