- clusterName: plaintext-http2-auto-dest
  endpoints:
  - lbEndpoints:
    - endpoint:
        address:
          socketAddress:
            address: 1.2.3.4
            portValue: 50000
      loadBalancingWeight: 1
    loadBalancingWeight: 1
    locality:
      region: plaintext-http2-auto-dest/backend/0
